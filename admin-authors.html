<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作者登録の承認 — AniNovel</title>
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#2d2a26; --muted:#6b645c;
  --line:#e5ded4; --accent:#8b5e34; --accent2:#a67c52; --err:#b23a3a; --ok:#3a7d44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
    --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
  --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
.wrap.wide{max-width:860px}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--muted);font-size:.95rem;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card+.card{margin-top:16px}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.9rem}
label:first-child{margin-top:0}
label .opt{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:8px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}
.btn{margin-top:26px;width:100%;padding:13px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{width:auto;margin:0;padding:8px 16px;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(139,94,52,.08)}
.msg{margin-top:18px;padding:13px 15px;border-radius:9px;font-size:.92rem;display:none}
.msg.err{display:block;background:rgba(178,58,58,.1);border:1px solid rgba(178,58,58,.35);color:var(--err)}
.msg.ok{display:block;background:rgba(58,125,68,.1);border:1px solid rgba(58,125,68,.3)}
.foot{margin-top:26px;font-size:.88rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.tag.pending{background:rgba(201,162,39,.18);color:#8a6d0b}
.tag.approved{background:rgba(58,125,68,.15);color:#2f6637}
.tag.rejected{background:rgba(178,58,58,.13);color:var(--err)}
dl.kv{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0;word-break:break-word}
.bio{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-top:4px;font-size:.9rem}

</style>
</head>
<body>
<div class="wrap wide">
  <h1>作者登録の承認</h1>
  <p class="lead">申請の内容を確認して、承認または却下してください。<br>
    決定すると、申請者へメールでお知らせします。</p>

  <div class="row" style="margin-bottom:16px">
    <button class="btn sm ghost" id="reload">再読み込み</button>
    <label class="row" style="gap:6px;margin:0;font-weight:400;font-size:.9rem">
      <input type="checkbox" id="onlyPending" checked style="width:auto"> 審査待ちだけ表示
    </label>
  </div>

  <div id="list"></div>
  <div class="msg" id="msg"></div>
</div>

<script>
var $=function(id){return document.getElementById(id);};
function show(kind,text){ var m=$('msg'); m.className='msg '+kind; m.textContent=text; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function when(ms){ return ms ? new Date(ms).toLocaleString('ja-JP') : ''; }

var all=[];

async function load(){
  show('ok','読み込んでいます…');
  try{
    var r=await fetch('/api/admin/applications',{cache:'no-store'});
    if(!r.ok){
      var e=await r.json().catch(function(){return {};});
      show('err',e.message||e.error||('エラー ('+r.status+')'));
      return;
    }
    var j=await r.json();
    all=j.applications||[];
    $('msg').className='msg';
    render();
  }catch(e){ show('err','通信に失敗しました。'); }
}

function render(){
  var only=$('onlyPending').checked;
  var rows=all.filter(function(a){ return !only || a.status==='pending'; });
  if(!rows.length){
    $('list').innerHTML='<div class="card"><p style="margin:0;color:var(--muted)">'+
      (only?'審査待ちの申請はありません。':'申請はありません。')+'</p></div>';
    return;
  }
  $('list').innerHTML=rows.map(function(a){
    var tag='<span class="tag '+a.status+'">'+
      ({pending:'審査待ち',approved:'承認済み',rejected:'却下'}[a.status]||a.status)+'</span>';
    var acts = a.status==='pending'
      ? '<div class="row" style="margin-top:16px">'+
        '<button class="btn sm" data-act="approve" data-id="'+esc(a.id)+'">承認する</button>'+
        '<button class="btn sm ghost" data-act="reject" data-id="'+esc(a.id)+'">却下する</button>'+
        '</div>'
      : '<p class="hint" style="margin-top:14px">'+when(a.decidedAt)+' に'+
        (a.status==='approved'?'承認':'却下')+
        (a.reason?'（'+esc(a.reason)+'）':'')+'</p>';
    return '<div class="card">'+
      '<div class="row" style="justify-content:space-between">'+
        '<strong style="font-size:1.1rem">'+esc(a.nickname)+'</strong>'+tag+'</div>'+
      '<dl class="kv">'+
        '<dt>お名前</dt><dd>'+esc(a.name)+'</dd>'+
        '<dt>メール</dt><dd>'+esc(a.email)+'</dd>'+
        '<dt>申請日時</dt><dd>'+when(a.createdAt)+'</dd>'+
      '</dl>'+
      (a.bio?'<div class="bio">'+esc(a.bio)+'</div>':'')+
      acts+'</div>';
  }).join('');
}

document.addEventListener('click',async function(ev){
  var b=ev.target.closest('button[data-act]');
  if(!b) return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  var reason='';
  if(act==='reject'){
    reason=prompt('却下の理由（任意・申請者へのメールに載ります）')||'';
  }else{
    if(!confirm('承認しますか。申請者へログインのご案内が届きます。')) return;
  }
  b.disabled=true;
  try{
    var r=await fetch('/api/admin/applications',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id,action:act,reason:reason})});
    var j=await r.json();
    if(r.ok){
      show('ok',(act==='approve'?'承認しました。':'却下しました。')+
        (j.mailed?'メールを送信しました。':'（メールは送信されていません）'));
      await load();
    }else{
      show('err',j.message||j.error||('エラー ('+r.status+')'));
      b.disabled=false;
    }
  }catch(e){ show('err','通信に失敗しました。'); b.disabled=false; }
});

$('reload').onclick=load;
$('onlyPending').onchange=render;
load();
</script>
</body>
</html>
