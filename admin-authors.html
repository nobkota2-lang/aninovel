<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作者登録の承認 — AniNovel</title>
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#2d2a26; --muted:#6b645c;
  --line:#e5ded4; --accent:#8b5e34; --accent2:#a67c52; --err:#b23a3a; --ok:#3a7d44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
    --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
  --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
.wrap.wide{max-width:860px}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--muted);font-size:.95rem;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card+.card{margin-top:16px}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.9rem}
label:first-child{margin-top:0}
label .opt{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:8px}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}
.btn{margin-top:26px;width:100%;padding:13px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{width:auto;margin:0;padding:8px 16px;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(139,94,52,.08)}
.msg{margin-top:18px;padding:13px 15px;border-radius:9px;font-size:.92rem;display:none}
.msg.err{display:block;background:rgba(178,58,58,.1);border:1px solid rgba(178,58,58,.35);color:var(--err)}
.msg.ok{display:block;background:rgba(58,125,68,.1);border:1px solid rgba(58,125,68,.3)}
.foot{margin-top:26px;font-size:.88rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.tag.pending{background:rgba(201,162,39,.18);color:#8a6d0b}
.tag.approved{background:rgba(58,125,68,.15);color:#2f6637}
.tag.rejected{background:rgba(178,58,58,.13);color:var(--err)}
dl.kv{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0;word-break:break-word}
.bio{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-top:4px;font-size:.9rem}

</style>
</head>
<body>
<div class="wrap wide">
  <h1>作者登録の承認</h1>
  <p class="lead">申請の内容を確認して、承認または却下してください。<br>
    決定すると、申請者へメールでお知らせします。</p>

  <div class="row" style="margin-bottom:16px">
    <button class="btn sm ghost" id="reload">再読み込み</button>
    <label class="row" style="gap:6px;margin:0;font-weight:400;font-size:.9rem">
      <input type="checkbox" id="onlyPending" checked style="width:auto"> 審査待ちだけ表示
    </label>
  </div>

  <div id="list"></div>
  <div class="msg" id="msg"></div>

  <h1 style="margin-top:42px">作品の作者を決める</h1>
  <p class="lead">その作品を「自分の作品」として編集・公開できる人を1人だけ指定します。<br>
    ここで指定された人だけが、その作品で作者モードに入れます。</p>
  <div class="card">
    <label for="wid">作品</label>
    <select id="wid"><option value="">読み込んでいます…</option></select>
    <p class="hint">一覧に無い作品は、下の欄に作品IDを直接入力してください。</p>
    <input id="widManual" placeholder="pub_owner_bizwoman のように直接入力（任意）" style="margin-top:6px">
    <div class="row" style="margin-top:14px">
      <button class="btn sm ghost" id="whoGet">いまの作者を見る</button>
    </div>
    <div id="whoNow" class="hint" style="margin-top:10px"></div>

    <label for="wmail" style="margin-top:20px">この作品の作者にするメールアドレス</label>
    <input id="wmail" type="email" placeholder="kota2@f4.dion.ne.jp" autocomplete="off">
    <p class="hint">読者・作者として登録済みのメールアドレスを、そのまま入れてください。
      空のまま「作者を外す」を押すと、誰の作品でもない状態に戻ります。</p>
    <div class="row" style="margin-top:14px">
      <button class="btn sm" id="wset">この人を作者にする</button>
      <button class="btn sm ghost" id="wclear">作者を外す</button>
    </div>
    <div class="msg" id="wmsg"></div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id);};
function show(kind,text){ var m=$('msg'); m.className='msg '+kind; m.textContent=text; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function when(ms){ return ms ? new Date(ms).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}) : ''; }

var all=[];

async function load(){
  show('ok','読み込んでいます…');
  try{
    var r=await fetch('/api/admin/applications',{cache:'no-store'});
    if(r.status===401){ needLogin(); return; }
    if(!r.ok){
      var e=await r.json().catch(function(){return {};});
      show('err',e.message||e.error||('エラー ('+r.status+')'));
      return;
    }
    var j=await r.json();
    all=j.applications||[];
    $('msg').className='msg';
    render();
  }catch(e){
    // Access のログインへリダイレクトされると、宛先が CSP で止められ
    // fetch が例外になる。この場合はログインが切れている。
    needLogin();
  }
}

function needLogin(){
  $('list').innerHTML='<div class="card">'+
    '<p style="margin:0 0 14px">オーナーとしてのログインが必要です。</p>'+
    '<a class="btn sm" href="/api/admin/applications" style="text-decoration:none">ログインする</a>'+
    '<p class="hint" style="margin-top:12px">ログイン後に一覧(JSON)が表示されたら、'+
    'このページに戻って再読込みしてください。</p></div>';
  $('msg').className='msg';
}

function render(){
  var only=$('onlyPending').checked;
  var rows=all.filter(function(a){ return !only || a.status==='pending'; });
  if(!rows.length){
    $('list').innerHTML='<div class="card"><p style="margin:0;color:var(--muted)">'+
      (only?'審査待ちの申請はありません。':'申請はありません。')+'</p></div>';
    return;
  }
  $('list').innerHTML=rows.map(function(a){
    var tag='<span class="tag '+a.status+'">'+
      ({pending:'審査待ち',approved:'承認済み',rejected:'却下'}[a.status]||a.status)+'</span>';
    var acts = a.status==='pending'
      ? '<div class="row" style="margin-top:16px">'+
        '<button class="btn sm" data-act="approve" data-id="'+esc(a.id)+'">承認する</button>'+
        '<button class="btn sm ghost" data-act="reject" data-id="'+esc(a.id)+'">却下する</button>'+
        '</div>'
      : '<p class="hint" style="margin-top:14px">'+when(a.decidedAt)+' に'+
        (a.status==='approved'?'承認':'却下')+
        (a.reason?'（'+esc(a.reason)+'）':'')+'</p>';
    return '<div class="card">'+
      '<div class="row" style="justify-content:space-between">'+
        '<strong style="font-size:1.1rem">'+esc(a.nickname)+'</strong>'+
        '<span>'+(a.existingUser?'<span class="tag approved" style="margin-right:6px">既存の読者</span>':'')+tag+'</span></div>'+
      '<dl class="kv">'+
        '<dt>お名前</dt><dd>'+esc(a.name)+'</dd>'+
        '<dt>メール</dt><dd>'+esc(a.email)+'</dd>'+
        '<dt>申請日時</dt><dd>'+when(a.createdAt)+'</dd>'+
      '</dl>'+
      (a.bio?'<div class="bio">'+esc(a.bio)+'</div>':'')+
      acts+'</div>';
  }).join('');
}

document.addEventListener('click',async function(ev){
  var b=ev.target.closest('button[data-act]');
  if(!b) return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  var reason='';
  if(act==='reject'){
    reason=prompt('却下の理由（任意・申請者へのメールに載ります）')||'';
  }else{
    if(!confirm('承認しますか。申請者へログインのご案内が届きます。')) return;
  }
  b.disabled=true;
  try{
    var r=await fetch('/api/admin/applications',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id,action:act,reason:reason})});
    var j=await r.json();
    if(r.ok){
      show('ok',(act==='approve'?'承認しました。':'却下しました。')+
        (j.mailed?'メールを送信しました。':'（メールは送信されていません）'));
      await load();
    }else{
      show('err',j.message||j.error||('エラー ('+r.status+')'));
      b.disabled=false;
    }
  }catch(e){ show('err','通信に失敗しました。'); b.disabled=false; }
});

$('reload').onclick=load;
$('onlyPending').onchange=render;
load();

/* ===== 作品の作者を決める ===== */
function wshow(kind,text){ var m=$('wmsg'); m.className='msg '+kind; m.textContent=text; }
function widNow(){ return ($('widManual').value.trim() || $('wid').value || ''); }

// 作品の一覧をカタログから引いて選べるようにする
(async function loadWorks(){
  try{
    var r=await fetch('/api/catalog',{cache:'no-store'});
    var j=await r.json();
    var list=(j.works||j.items||j||[]);
    if(!Array.isArray(list)) list=[];
    if(!list.length){ $('wid').innerHTML='<option value="">（一覧を取得できませんでした。下の欄にIDを入力）</option>'; return; }
    $('wid').innerHTML='<option value="">— 選んでください —</option>'+list.map(function(w){
      var id=w.id||w.workId||''; var t=w.title||'(無題)'; var a=w.author?('／'+w.author):'';
      return '<option value="'+esc(id)+'">'+esc(t)+esc(a)+'　['+esc(id)+']</option>';
    }).join('');
  }catch(e){ $('wid').innerHTML='<option value="">（一覧を取得できませんでした。下の欄にIDを入力）</option>'; }
})();

$('whoGet').onclick=async function(){
  var id=widNow(); if(!id){ wshow('err','作品を選ぶか、作品IDを入力してください。'); return; }
  $('whoNow').textContent='';
  try{
    var r=await fetch('/api/author/works/'+encodeURIComponent(id)+'/owner',{cache:'no-store'});
    var j=await r.json();
    if(!r.ok){ wshow('err',j.message||j.error||('エラー ('+r.status+')')); return; }
    $('wmsg').className='msg';
    $('whoNow').textContent='「'+(j.title||id)+'」のいまの作者: '+(j.ownerEmail||'（未設定）');
    if(j.ownerEmail) $('wmail').value=j.ownerEmail;
  }catch(e){ wshow('err','通信に失敗しました。オーナーとしてログインしているか確認してください。'); }
};

async function wput(email){
  var id=widNow(); if(!id){ wshow('err','作品を選ぶか、作品IDを入力してください。'); return; }
  try{
    var r=await fetch('/api/author/works/'+encodeURIComponent(id)+'/owner',{method:'PUT',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({ownerEmail:email})});
    var j=await r.json();
    if(!r.ok){ wshow('err',j.message||j.error||('エラー ('+r.status+')')); return; }
    wshow('ok',email
      ? ('「'+id+'」の作者を '+j.after+' にしました。（前: '+(j.before||'未設定')+'）')
      : ('「'+id+'」の作者を外しました。（前: '+(j.before||'未設定')+'）'));
    $('whoNow').textContent='いまの作者: '+(j.after||'（未設定）');
  }catch(e){ wshow('err','通信に失敗しました。オーナーとしてログインしているか確認してください。'); }
}

$('wset').onclick=function(){
  var em=$('wmail').value.trim();
  if(!em){ wshow('err','メールアドレスを入力してください。'); return; }
  if(!confirm('「'+widNow()+'」の作者を '+em+' にします。よろしいですか？')) return;
  wput(em);
};
$('wclear').onclick=function(){
  if(!confirm('「'+widNow()+'」の作者を外します。よろしいですか？')) return;
  $('wmail').value=''; wput(null);
};
</script>
</body>
</html>
