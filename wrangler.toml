# =============================================================================
# アニノベル Cloudflare Pages 設定
# wrangler.toml
#
# 配置: プロジェクトルート
# 公式: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
# =============================================================================

name = "aninovel"
compatibility_date = "2025-05-01"
pages_build_output_dir = "dist"
# Pagesプロジェクトはダッシュボードで作成済みのものに紐付ける

# ===== Functions の互換性 =====
# Node.js 互換APIの一部を有効化 (必要に応じて)
compatibility_flags = ["nodejs_compat"]

# ===== 環境変数 (非Encrypt) =====
# 機密情報はダッシュボード側で "Encrypt" として設定すること。
# ここに書くのは公開情報のみ。
[vars]
SITE_URL = "https://aninovel.com"
ENVIRONMENT = "production"

# ===== Preview用環境変数の上書き =====
[env.preview.vars]
SITE_URL = "https://aninovel.pages.dev"
ENVIRONMENT = "preview"

# =============================================================================
# 以下は Cloudflare ダッシュボード で設定する項目 (wrangler.tomlでは管理しない)
# =============================================================================
#
# [Settings > Environment Variables] (Encrypted 推奨)
#   STRIPE_SECRET_KEY         = sk_live_...
#   STRIPE_WEBHOOK_SECRET     = whsec_...
#   RESEND_API_KEY            = re_...
#   RESEND_AUDIENCE_ID        = aud_...
#   FROM_EMAIL                = noreply@aninovel.com
#   NOTIFY_EMAIL              = admin@aninovel.com (運営者宛通知)
#   DISCORD_WEBHOOK_URL       = https://discord.com/api/webhooks/...
#   DISCORD_ERROR_WEBHOOK_URL = (エラー監視用、別チャンネル推奨)
#   ADMIN_TOKEN               = (運営者APIの認証トークン、ランダム32文字)
#
# [Settings > Functions > KV namespace bindings]
#   NEWSLETTER_KV   → aninovel-newsletter
#   REPORTS_KV      → aninovel-reports
#   ERRORS_KV       → aninovel-errors
#   BILLING_KV      → aninovel-billing
#   RATE_LIMIT_KV   → aninovel-ratelimit (TTL自動消滅で十分)
#
# [Settings > Functions > D1 bindings] (Phase 2.5 - Supabase代替案)
#   DB → aninovel-db
#
# [Settings > Functions > R2 bindings] (Phase 3 - 大容量配信)
#   AUDIO_BUCKET → aninovel-audio (VOICEVOXで生成した音声ファイル等)
#
# =============================================================================

# ===== Build 設定 (ダッシュボードで指定) =====
# Build command: bash scripts/build.sh
# Build output directory: dist
# Root directory: /
# Environment variables (build時用): NODE_VERSION=20

# ===== ローカル開発 =====
# wrangler pages dev dist --port 8788
# wrangler pages dev --binding KV=NEWSLETTER_KV=local-kv dist  # KVのローカルエミュレート
