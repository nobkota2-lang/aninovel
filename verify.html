<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メールアドレスの確認 — AniNovel</title>
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#2d2a26; --muted:#6b645c;
  --line:#e5ded4; --accent:#8b5e34; --accent2:#a67c52; --err:#b23a3a; --ok:#3a7d44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
    --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
  --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
.wrap.wide{max-width:860px}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--muted);font-size:.95rem;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card+.card{margin-top:16px}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.9rem}
label:first-child{margin-top:0}
label .opt{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:8px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}
.btn{margin-top:26px;width:100%;padding:13px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{width:auto;margin:0;padding:8px 16px;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(139,94,52,.08)}
.msg{margin-top:18px;padding:13px 15px;border-radius:9px;font-size:.92rem;display:none}
.msg.err{display:block;background:rgba(178,58,58,.1);border:1px solid rgba(178,58,58,.35);color:var(--err)}
.msg.ok{display:block;background:rgba(58,125,68,.1);border:1px solid rgba(58,125,68,.3)}
.foot{margin-top:26px;font-size:.88rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.tag.pending{background:rgba(201,162,39,.18);color:#8a6d0b}
.tag.approved{background:rgba(58,125,68,.15);color:#2f6637}
.tag.rejected{background:rgba(178,58,58,.13);color:var(--err)}
dl.kv{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0;word-break:break-word}
.bio{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-top:4px;font-size:.9rem}

.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px}
.pw-eye:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.pw-eye:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

</style>
</head>
<body>
<div class="wrap">
  <h1>メールアドレスの確認</h1>
  <div class="card">
    <p id="state">確認しています…</p>
    <a class="btn" id="go" href="/login.html" style="display:none;text-align:center;text-decoration:none">ログインする</a>
  </div>
</div>
<script>
/* パスワード欄に目玉マークを付ける。押すと表示・非表示を切り替える。
   ページ内の input[type=password] を自動で探して付けるので、各欄に何か書く必要はない。 */
(function(){
  var OPEN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  function attach(inp){
    if(inp.dataset.eye) return;
    inp.dataset.eye='1';
    var wrap=document.createElement('div');
    wrap.className='pw-wrap';
    inp.parentNode.insertBefore(wrap,inp);
    wrap.appendChild(inp);
    var b=document.createElement('button');
    b.type='button';
    b.className='pw-eye';
    b.setAttribute('aria-label','パスワードを表示');
    b.innerHTML=OPEN;
    b.onclick=function(){
      var show=inp.type==='password';
      inp.type=show?'text':'password';
      b.innerHTML=show?SHUT:OPEN;
      b.setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示');
      inp.focus();
    };
    wrap.appendChild(b);
  }
  function run(){ document.querySelectorAll('input[type=password]').forEach(attach); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();

</script>
<script>
var $=function(id){return document.getElementById(id);};
function show(el,kind,text){ el.className='msg '+kind; el.textContent=text; }
(async function(){
  var t=new URLSearchParams(location.search).get('token')||'';
  if(!t){ $('state').textContent='リンクが正しくありません。メールのリンクをもう一度お開きください。'; return; }
  try{
    var r=await fetch('/api/auth/verify',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})});
    var j=await r.json();
    $('state').textContent = r.ok ? (j.message||'確認が完了しました。') : (j.error||('エラー ('+r.status+')'));
    if(r.ok) $('go').style.display='block';
  }catch(e){ $('state').textContent='通信に失敗しました。時間をおいてお試しください。'; }
})();
</script>
</body>
</html>
