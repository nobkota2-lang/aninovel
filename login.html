<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ログイン — AniNovel</title>
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#2d2a26; --muted:#6b645c;
  --line:#e5ded4; --accent:#8b5e34; --accent2:#a67c52; --err:#b23a3a; --ok:#3a7d44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
    --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
  --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
.wrap.wide{max-width:860px}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--muted);font-size:.95rem;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card+.card{margin-top:16px}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.9rem}
label:first-child{margin-top:0}
label .opt{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:8px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}
.btn{margin-top:26px;width:100%;padding:13px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{width:auto;margin:0;padding:8px 16px;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(139,94,52,.08)}
.msg{margin-top:18px;padding:13px 15px;border-radius:9px;font-size:.92rem;display:none}
.msg.err{display:block;background:rgba(178,58,58,.1);border:1px solid rgba(178,58,58,.35);color:var(--err)}
.msg.ok{display:block;background:rgba(58,125,68,.1);border:1px solid rgba(58,125,68,.3)}
.foot{margin-top:26px;font-size:.88rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.tag.pending{background:rgba(201,162,39,.18);color:#8a6d0b}
.tag.approved{background:rgba(58,125,68,.15);color:#2f6637}
.tag.rejected{background:rgba(178,58,58,.13);color:var(--err)}
dl.kv{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0;word-break:break-word}
.bio{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-top:4px;font-size:.9rem}

.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px}
.pw-eye:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.pw-eye:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

</style>
</head>
<body>
<div class="wrap">
  <h1>ログイン</h1>
  <p class="lead">読者・作者どちらも、ご登録のメールアドレスとパスワードでログインします。</p>

  <div class="card" id="box">
    <label for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">パスワード</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="btn" id="go">ログイン</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="me" style="display:none">
    <p id="meText" style="margin:0"></p>
    <p id="meRole" class="hint" style="margin-top:6px"></p>
    <div class="row" style="margin-top:14px">
      <a class="btn sm" href="/" style="text-decoration:none">トップへ</a>
      <button class="btn sm ghost" id="chpw">パスワードを変更</button>
      <button class="btn sm ghost" id="out">ログアウト</button>
    </div>
  </div>

  <div class="card" id="pwbox" style="display:none">
    <label for="cur">現在のパスワード</label>
    <input id="cur" type="password" autocomplete="current-password">
    <label for="next">新しいパスワード <span class="opt">10文字以上</span></label>
    <input id="next" type="password" autocomplete="new-password">
    <button class="btn" id="pwgo">変更する</button>
    <div class="msg" id="pwmsg"></div>
  </div>

  <p class="foot">
    <a href="#" id="forgot">パスワードを忘れた方</a><br>
    <a href="/register.html">読者として登録</a> ／ <a href="/author-apply.html">作者登録の申請</a>
  </p>
  <p class="foot" style="font-size:.82rem;line-height:1.7">
    再設定のメールが届かないときは、そのアドレスがまだ登録されていないか、<br>
    確認メールのリンクをまだ開いていない場合です。<br>
    迷惑メールフォルダもあわせてご確認ください。<br>
    <span style="opacity:.8">※ 管理画面（作者の承認・作品の作者指定）は、この画面ではなく<br>
    メールに届く使い捨ての番号で入ります。パスワードは使いません。</span>
  </p>
</div>
<script>
/* パスワード欄に目玉マークを付ける。押すと表示・非表示を切り替える。
   ページ内の input[type=password] を自動で探して付けるので、各欄に何か書く必要はない。 */
(function(){
  var OPEN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  function attach(inp){
    if(inp.dataset.eye) return;
    inp.dataset.eye='1';
    var wrap=document.createElement('div');
    wrap.className='pw-wrap';
    inp.parentNode.insertBefore(wrap,inp);
    wrap.appendChild(inp);
    var b=document.createElement('button');
    b.type='button';
    b.className='pw-eye';
    b.setAttribute('aria-label','パスワードを表示');
    b.innerHTML=OPEN;
    b.onclick=function(){
      var show=inp.type==='password';
      inp.type=show?'text':'password';
      b.innerHTML=show?SHUT:OPEN;
      b.setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示');
      inp.focus();
    };
    wrap.appendChild(b);
  }
  function run(){ document.querySelectorAll('input[type=password]').forEach(attach); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();

</script>
<script>
var $=function(id){return document.getElementById(id);};
function show(el,kind,text){ el.className='msg '+kind; el.textContent=text; }
// 戻り先。?back= があればそこ、無ければトップ。
function dest(){
  var back=new URLSearchParams(location.search).get('back');
  return (back && /^\/[^\/]/.test(back)) ? back : '/';
}
// justLoggedIn = いまボタンを押してログインが通ったところ。
//   その場合は確認画面をはさまず、そのまま読みたいページ(なければトップ)へ進む。
//   すでにログイン済みの人が自分で /login.html を開いたときだけ、
//   アカウントの画面(パスワード変更・ログアウト)を見せる。
async function refresh(justLoggedIn){
  try{
    var r=await fetch('/api/auth/me',{cache:'no-store'});
    var j=await r.json();
    if(j.loggedIn){
      var back=new URLSearchParams(location.search).get('back');
      if(justLoggedIn || (back && /^\/[^\/]/.test(back))){ location.replace(dest()); return; }
      $('box').style.display='none'; $('me').style.display='block';
      document.querySelector('h1').textContent='アカウント';
      document.querySelector('.lead').textContent='ログイン中です。パスワードの変更やログアウトができます。';
      $('meText').textContent=j.nickname+' さんとしてログインしています';
      $('meRole').textContent=j.email+' ／ '+(j.isAuthor?'作者・読者':'読者');
    }else{
      $('box').style.display='block'; $('me').style.display='none'; $('pwbox').style.display='none';
    }
  }catch(e){}
}
refresh();

$('go').onclick=async function(){
  var btn=$('go'); btn.disabled=true; show($('msg'),'ok','確認しています…');
  try{
    var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
    var j=await r.json();
    if(r.ok){ $('password').value=''; show($('msg'),'ok','ログインしました。移動します…'); await refresh(true); btn.disabled=false; return; }
    show($('msg'),'err',j.error||('エラー ('+r.status+')'));
  }catch(e){ show($('msg'),'err','通信に失敗しました。'); }
  btn.disabled=false;
};
$('password').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });

$('out').onclick=async function(){ await fetch('/api/auth/logout',{method:'POST'}); location.reload(); };
$('chpw').onclick=function(){ var b=$('pwbox'); b.style.display=b.style.display==='none'?'block':'none'; };

$('pwgo').onclick=async function(){
  var btn=$('pwgo'); btn.disabled=true;
  try{
    var r=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({current:$('cur').value,next:$('next').value})});
    var j=await r.json();
    if(r.ok){ show($('pwmsg'),'ok','パスワードを変更しました。'); $('cur').value=''; $('next').value=''; }
    else show($('pwmsg'),'err',j.error||('エラー ('+r.status+')'));
  }catch(e){ show($('pwmsg'),'err','通信に失敗しました。'); }
  btn.disabled=false;
};

$('forgot').onclick=async function(e){
  e.preventDefault();
  var em=$('email').value.trim()||prompt('ご登録のメールアドレスを入力してください');
  if(!em) return;
  show($('msg'),'ok','送信しています…');
  try{
    var r=await fetch('/api/auth/reset-request',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:em})});
    var j=await r.json();
    show($('msg'),'ok',(j.message||'ご案内をお送りしました。')+' 迷惑メールフォルダもご確認ください。');
  }catch(e2){ show($('msg'),'err','通信に失敗しました。'); }
};
</script>
</body>
</html>
