<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リップシンクGIF一括生成 (MediaPipe Tasks)</title>
<style>
body{font-family:sans-serif;background:#222;color:#eee;padding:20px;max-width:1400px;margin:0 auto}
h1{font-size:18px;margin:0 0 12px}
.note{background:#3a3520;color:#fc8;padding:10px;border-radius:6px;font-size:13px;margin:10px 0}
#dropZone{border:2px dashed #666;padding:30px;text-align:center;border-radius:8px;margin:10px 0;cursor:pointer}
#dropZone:hover,#dropZone.dragover{background:#2a2a4a;border-color:#6366F1}
input[type=file]{display:none}
button{background:#6366F1;color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;margin-right:8px}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}

</style>

<body>
<h1>🎭 リップシンクGIF 一括生成ツール (MediaPipe Tasks-Vision + メッシュ変形)</h1>
<div class="note">
  ギャラリーフォルダを下のエリアにドラッグ&amp;ドロップ、またはクリックして画像を複数選択。<br>
  各画像を MediaPipe FaceLandmarker (478点) で解析し、メッシュ変形+自然な口腔描画でリップシンクGIFを生成します。
</div>

<label id="dropZone" for="fileInput">
  📁 <b>ここにフォルダ or 画像をドロップ</b><br>
  <span style="font-size:12px;color:#888">（WebP / JPEG / PNG 対応）</span>
</label>
<input type="file" id="fileInput" accept="image/*" multiple webkitdirectory directory>
<input type="file" id="fileInputFiles" accept="image/*" multiple>
<div style="font-size:12px;margin:-5px 0 10px"><a href="#" id="modeSwitch" style="color:#9cf">→ 個別ファイル選択に切替</a></div>

<div class="controls">
  <button id="btnStart" disabled>▶ 一括生成開始</button>
  <button id="btnZip" disabled>📦 全GIFをZIPダウンロード</button>
  <button id="btnClear">🗑 クリア</button>
  <label class="opt">サイズ: <select id="szSel"><option>128</option><option selected>192</option><option>256</option></select></label>
  <label class="opt"><input type="checkbox" id="skipNoFace" checked> 顔未検出はスキップ</label>
</div>
<progress id="prog" value="0" max="1"></progress>
<div id="status" style="font-size:13px;color:#9cf;margin:6px 0"></div>

<div id="gallery"></div>
<div class="box"><h3 style="color:#9cf">ログ</h3><div id="log"></div></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module">
import {FaceLandmarker, FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs';

const $=(id)=>document.getElementById(id);
const log=function(){
  const args=Array.prototype.slice.call(arguments);
  const el=$('log');
  el.textContent+='['+new Date().toLocaleTimeString()+'] '+args.join(' ')+'\n';
  el.scrollTop=el.scrollHeight;
  console.log.apply(console,args);
};
window.addEventListener('error',e=>log('❌ JS例外:',e.message));
window.addEventListener('unhandledrejection',e=>log('❌ Promise拒否:',(e.reason&&e.reason.message)||e.reason));

// === ランドマーク定義 (MediaPipe Face Mesh 468点トポロジー) ===
const MOUTH_CORNER_L=61, MOUTH_CORNER_R=291;
const UPPER_LIP_TOP=13, LOWER_LIP_BOTTOM=14;
const UPPER_OUTER_TOP=0, LOWER_OUTER_BOTTOM=17;
const UPPER_LIP_POINTS=[0,11,12,13,37,38,39,40,41,42,61,62,72,73,74,76,77,78,80,81,82,84,87,88,90,91,95,96,178,180,181,183,184,185,191,267,268,269,270,271,272,291,292,302,303,304,306,307,308,310,311,312,317,318,320,321,324,325,402,404,405,407,408,409,415];
const LOWER_LIP_POINTS=[14,17,18,84,85,86,87,89,90,91,95,96,140,148,149,150,152,170,171,175,176,178,180,181,182,183,194,200,201,204,208,210,211,212,313,314,316,317,319,320,321,324,325,335,375,377,378,379,394,395,396,400,402,404,405,418,422,430,431,432,435];
// 三角メッシュ(口周辺)
const MOUTH_TRIANGLES=[
  [61,185,40],[185,40,39],[40,39,37],[39,37,0],[37,0,267],[0,267,269],[267,269,270],[269,270,409],[270,409,291],
  [61,78,191],[78,191,80],[191,80,81],[80,81,82],[81,82,13],[82,13,312],[13,312,311],[312,311,310],[311,310,415],[310,415,308],[291,415,308],
  [61,185,78],[185,78,191],[185,40,191],[40,191,80],[40,39,80],[39,80,81],[39,37,81],[37,81,82],[37,0,82],[0,82,13],[0,267,13],[267,13,312],[267,269,312],[269,312,311],[269,270,311],[270,311,310],[270,409,310],[409,310,415],[409,291,415],
  [78,95,88],[95,88,178],[88,178,87],[178,87,14],[87,14,317],[14,317,402],[317,402,318],[402,318,324],[318,324,308],
  [61,146,91],[146,91,181],[91,181,84],[181,84,17],[84,17,314],[17,314,405],[314,405,321],[405,321,375],[321,375,291],
  [61,146,78],[146,78,95],[146,91,95],[91,95,88],[91,181,88],[181,88,178],[181,84,178],[84,178,87],[84,17,87],[17,87,14],[17,314,14],[314,14,317],[314,405,317],[405,317,402],[405,321,402],[321,402,318],[321,375,318],[375,318,324],[375,291,324],[291,324,308]
];

// === FaceLandmarker 初期化 ===
let faceLandmarker=null;
async function initFL(){
  log('MediaPipe Tasks-Vision WASM 読込中...');
  const fr=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');
  log('FaceLandmarker モデル読込中...');
  faceLandmarker=await FaceLandmarker.createFromOptions(fr,{
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate:'GPU'
    },
    numFaces:1,
    runningMode:'IMAGE',
    outputFaceBlendshapes:false,
    outputFacialTransformationMatrixes:false
  });
  log('✓ FaceLandmarker 準備完了');
}

function detectLandmarks(canvas,sz){
  const r=faceLandmarker.detect(canvas);
  if(!r||!r.faceLandmarks||r.faceLandmarks.length===0)throw new Error('顔未検出');
  return r.faceLandmarks[0].map(p=>({x:p.x*sz, y:p.y*sz}));
}

// === ランドマーク変形 (調整済: baseGap=0.24, peak=0.88) ===
function deformLandmarks(lm,op){
  const out=lm.map(p=>({x:p.x,y:p.y}));
  const cL=lm[MOUTH_CORNER_L], cR=lm[MOUTH_CORNER_R];
  const mouthW=Math.hypot(cR.x-cL.x, cR.y-cL.y);
  const upT=lm[UPPER_LIP_TOP], loB=lm[LOWER_LIP_BOTTOM];
  const cy=(upT.y+loB.y)/2;
  const baseGap=mouthW*0.24; // 0.32→0.24 に抑制
  const gap=baseGap*op;
  const upperOuter=lm[UPPER_OUTER_TOP], lowerOuter=lm[LOWER_OUTER_BOTTOM];
  const upperSpan=Math.max(4,cy-upperOuter.y);
  const lowerSpan=Math.max(4,lowerOuter.y-cy);
  for(const idx of UPPER_LIP_POINTS){
    const p=lm[idx];
    const d=Math.max(0,(cy-p.y)/upperSpan); // 0(中央)〜1(外側)
    const w=Math.max(0.1, 1.0-d*0.75);
    out[idx].y = p.y - gap*0.42*w;
  }
  for(const idx of LOWER_LIP_POINTS){
    const p=lm[idx];
    const d=Math.max(0,(p.y-cy)/lowerSpan);
    const w=Math.max(0.1, 1.0-d*0.75);
    out[idx].y = p.y + gap*0.58*w;
  }
  return out;
}

// === 三角アフィン変換 ===
function drawWarpedTri(ctx,srcCanvas,s0,s1,s2,d0,d1,d2){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d0.x,d0.y);ctx.lineTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.closePath();
  ctx.clip();
  // 2D アフィン変換: src 三角形→dst 三角形
  const sx0=s0.x,sy0=s0.y,sx1=s1.x,sy1=s1.y,sx2=s2.x,sy2=s2.y;
  const dx0=d0.x,dy0=d0.y,dx1=d1.x,dy1=d1.y,dx2=d2.x,dy2=d2.y;
  const det=(sx1-sx0)*(sy2-sy0)-(sy1-sy0)*(sx2-sx0);
  if(Math.abs(det)<1e-6){ctx.restore();return;}
  const a=((dx1-dx0)*(sy2-sy0)-(dx2-dx0)*(sy1-sy0))/det;
  const b=((dx2-dx0)*(sx1-sx0)-(dx1-dx0)*(sx2-sx0))/det;
  const c=((dy1-dy0)*(sy2-sy0)-(dy2-dy0)*(sy1-sy0))/det;
  const d=((dy2-dy0)*(sx1-sx0)-(dy1-dy0)*(sx2-sx0))/det;
  const e=dx0-a*sx0-b*sy0;
  const f=dy0-c*sx0-d*sy0;
  ctx.setTransform(a,c,b,d,e,f);
  ctx.drawImage(srcCanvas,0,0);
  ctx.restore();
}

function warpFrame(srcCanvas,srcLM,dstLM,sz){
  const fc=document.createElement('canvas');
  fc.width=sz;fc.height=sz;
  const fctx=fc.getContext('2d');
  fctx.save();
  fctx.beginPath();fctx.arc(sz/2,sz/2,sz/2,0,Math.PI*2);fctx.clip();
  // 1) 背景は元画像をそのまま
  fctx.drawImage(srcCanvas,0,0);
  // 2) 口周辺のみメッシュ変形
  for(const tri of MOUTH_TRIANGLES){
    const s0=srcLM[tri[0]],s1=srcLM[tri[1]],s2=srcLM[tri[2]];
    const d0=dstLM[tri[0]],d1=dstLM[tri[1]],d2=dstLM[tri[2]];
    if(!s0||!s1||!s2||!d0||!d1||!d2)continue;
    drawWarpedTri(fctx,srcCanvas,s0,s1,s2,d0,d1,d2);
  }
  // 3) 口腔内描画 (変形後の上下唇の隙間)
  const upT=dstLM[UPPER_LIP_TOP], loB=dstLM[LOWER_LIP_BOTTOM];
  const cL=dstLM[MOUTH_CORNER_L], cR=dstLM[MOUTH_CORNER_R];
  const mh=Math.max(0, loB.y-upT.y);
  const mw=Math.hypot(cR.x-cL.x, cR.y-cL.y);
  const mcx=(cL.x+cR.x)/2, mcy=(upT.y+loB.y)/2;
  if(mh>1){
    // 口腔の暗い楕円
    fctx.save();
    fctx.beginPath();
    fctx.ellipse(mcx,mcy,mw/2*0.92,mh/2+0.5,0,0,Math.PI*2);
    fctx.fillStyle='rgb(16,6,5)';fctx.fill();
    // 中央を少し赤っぽく
    const grd=fctx.createRadialGradient(mcx,mcy,0,mcx,mcy,mw/2*0.92);
    grd.addColorStop(0,'rgba(58,14,10,0.55)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=grd;fctx.fill();
    fctx.restore();
    // 上歯(控えめ・mh>sz*0.035 以上でのみ表示)
    if(mh>sz*0.035){
      const teethW=mw*0.26;     // 幅控えめ
      const teethH=sz*0.028;    // 高さ控えめ
      const tx=mcx, ty=upT.y+teethH*0.48;
      fctx.save();
      // 楕円クリップで口腔内にだけ描画
      fctx.beginPath();
      fctx.ellipse(mcx,mcy,mw/2*0.92,mh/2+0.5,0,0,Math.PI*2);
      fctx.clip();
      // アイボリー色の上歯
      fctx.beginPath();
      fctx.ellipse(tx,ty,teethW/2,teethH/2,0,0,Math.PI*2);
      fctx.fillStyle='rgba(242,230,206,0.72)';
      fctx.fill();
      // 上歯の下側に暗いグラデを重ねて口腔と馴染ませる
      const shadeGrd=fctx.createLinearGradient(tx,ty-teethH*0.2,tx,ty+teethH*0.9);
      shadeGrd.addColorStop(0,'rgba(0,0,0,0)');
      shadeGrd.addColorStop(0.55,'rgba(0,0,0,0.25)');
      shadeGrd.addColorStop(1,'rgba(0,0,0,0.75)');
      fctx.beginPath();
      fctx.ellipse(tx,ty,teethW/2,teethH/2*1.4,0,0,Math.PI*2);
      fctx.fillStyle=shadeGrd;
      fctx.fill();
      fctx.restore();
    }
  }
  fctx.restore();
  return fc;
}

// === GIFエンコーダ ===
function _gif_lzw(data,minBits){
  const cc=1<<minBits,eoi=cc+1;let bits=minBits+1,nc=eoi+1;
  const out=[];let buf=0,blen=0;
  function emit(code){buf|=(code<<blen);blen+=bits;while(blen>=8){out.push(buf&0xFF);buf>>>=8;blen-=8;}}
  let dict=[];for(let i=0;i<cc;i++)dict[i]={};
  if(data.length===0){emit(cc);emit(eoi);if(blen>0)out.push(buf&0xFF);return out;}
  emit(cc);let prefix=data[0];
  for(let pos=1;pos<data.length;pos++){
    const sym=data[pos];
    if(dict[prefix]&&dict[prefix][sym]!==undefined){prefix=dict[prefix][sym];}
    else{
      emit(prefix);
      if(nc<=4095){if(!dict[prefix])dict[prefix]={};dict[prefix][sym]=nc++;if(nc>(1<<bits)&&bits<12)bits++;}
      else{emit(cc);bits=minBits+1;nc=eoi+1;dict=[];for(let j=0;j<cc;j++)dict[j]={};}
      prefix=sym;
    }
  }
  emit(prefix);emit(eoi);if(blen>0)out.push(buf&0xFF);return out;
}
function _gif_palette(frames){
  const hist={};
  for(const rgba of frames){
    for(let i=0;i<rgba.length;i+=4){
      if(rgba[i+3]<80)continue;
      const r=rgba[i]>>3,g=rgba[i+1]>>3,b=rgba[i+2]>>3;
      const k=(r<<10)|(g<<5)|b;hist[k]=(hist[k]||0)+1;
    }
  }
  const sorted=Object.keys(hist).sort((a,b)=>hist[b]-hist[a]);
  const pal=[[0,0,0]];
  for(let k=0;k<Math.min(255,sorted.length);k++){
    const ki=parseInt(sorted[k]);
    pal.push([(ki>>10)<<3,((ki>>5)&31)<<3,(ki&31)<<3]);
  }
  while(pal.length<256)pal.push([0,0,0]);
  return pal;
}
function _gif_quantize(rgba,pal){
  const n=rgba.length>>2,idx=new Uint8Array(n),cache={};
  for(let i=0;i<n;i++){
    const r=rgba[i*4],g=rgba[i*4+1],b=rgba[i*4+2];
    const k=(r>>3)|((g>>3)<<5)|((b>>3)<<10);
    if(cache[k]!==undefined){idx[i]=cache[k];continue;}
    let best=1,bestD=1e9;
    for(let j=1;j<pal.length;j++){
      const dr=r-pal[j][0],dg=g-pal[j][1],db=b-pal[j][2];
      const d=dr*dr+dg*dg+db*db;
      if(d<bestD){bestD=d;best=j;}
      if(d===0)break;
    }
    cache[k]=best;idx[i]=best;
  }
  return idx;
}
function gifEncode(frames,w,h,delayCs){
  const pal=_gif_palette(frames);
  let cb=2;while((1<<cb)<pal.length)cb++;cb=Math.max(2,Math.min(8,cb));
  const ps=1<<cb,out=[];
  [0x47,0x49,0x46,0x38,0x39,0x61].forEach(b=>out.push(b));
  out.push(w&0xFF,(w>>8)&0xFF,h&0xFF,(h>>8)&0xFF,0x80|(cb-1),0,0);
  for(let i=0;i<ps;i++){const c=pal[i]||[0,0,0];out.push(c[0],c[1],c[2]);}
  [0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00].forEach(b=>out.push(b));
  for(const f of frames){
    [0x21,0xF9,0x04,0x00].forEach(b=>out.push(b));
    out.push(delayCs&0xFF,(delayCs>>8)&0xFF,0,0);
    [0x2C,0,0,0,0].forEach(b=>out.push(b));
    out.push(w&0xFF,(w>>8)&0xFF,h&0xFF,(h>>8)&0xFF,0x00);
    out.push(cb);
    const idx=_gif_quantize(f,pal);
    const lzw=_gif_lzw(idx,cb);
    for(let pos=0;pos<lzw.length;){
      const len=Math.min(255,lzw.length-pos);
      out.push(len);for(let k=0;k<len;k++)out.push(lzw[pos++]);
    }
    out.push(0);
  }
  out.push(0x3B);
  return new Uint8Array(out);
}

// === 1ファイル処理 ===
// 開口フレーム: ピーク 0.88 に抑制 (1.0 → 0.88)
const OPENS=[0, 0.13, 0.46, 0.79, 0.88, 0.79, 0.46, 0.13];

async function processOne(file,sz){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const im=new Image();
      im.onload=()=>res(im);
      im.onerror=()=>rej(new Error('デコード失敗'));
      im.src=url;
    });
    const sw=img.naturalWidth, sh=img.naturalHeight;
    if(sw<50||sh<50)throw new Error('画像が小さすぎ');
    const sd=Math.min(sw,sh);
    const sx=(sw-sd)/2, sy=Math.max(0,(sh-sd)/2 - sd*0.05);
    const srcCanvas=document.createElement('canvas');
    srcCanvas.width=sz;srcCanvas.height=sz;
    srcCanvas.getContext('2d').drawImage(img,sx,sy,sd,sd,0,0,sz,sz);
    const lm=detectLandmarks(srcCanvas,sz);
    const frames=[];
    for(const op of OPENS){
      const dstLM=deformLandmarks(lm,op);
      const fc=warpFrame(srcCanvas,lm,dstLM,sz);
      frames.push(new Uint8Array(fc.getContext('2d').getImageData(0,0,sz,sz).data));
    }
    const bytes=gifEncode(frames,sz,sz,7);
    return {ok:true,blob:new Blob([bytes],{type:'image/gif'}),bytes:bytes.length};
  }finally{
    URL.revokeObjectURL(url);
  }
}

// === UI ===
let fileList=[], gifResults=[];

function addFiles(files){
  fileList=[];$('gallery').innerHTML='';
  for(const f of files){
    if(!f.type||!f.type.startsWith('image/')){
      const n=(f.webkitRelativePath||f.name||'').toLowerCase();
      if(!/\.(webp|jpe?g|png)$/.test(n))continue;
    }
    const rel=f.webkitRelativePath||f.name;
    const item={file:f,relPath:rel,status:'pending',gifBlob:null};
    const card=document.createElement('div');card.className='item';
    const imgEl=document.createElement('img');imgEl.src=URL.createObjectURL(f);
    card.appendChild(imgEl);
    const name=document.createElement('div');name.textContent=rel;name.style.fontSize='10px';card.appendChild(name);
    const st=document.createElement('span');st.className='st pending';st.textContent='待機中';card.appendChild(st);
    item.cardEl=card;item.statusEl=st;item.imgEl=imgEl;
    $('gallery').appendChild(card);fileList.push(item);
  }
  $('btnStart').disabled=fileList.length===0||!faceLandmarker;
  $('status').textContent=fileList.length+' 件のファイルを読み込みました';
  log('ファイル読込:',fileList.length+'件');
}

function setStatus(item,status,text){item.status=status;item.statusEl.className='st '+status;item.statusEl.textContent=text;}

async function runBatch(){
  const sz=parseInt($('szSel').value);
  const skip=$('skipNoFace').checked;
  $('btnStart').disabled=true;$('btnZip').disabled=true;
  $('prog').value=0;$('prog').max=fileList.length;
  let done=0;gifResults=[];
  // FaceLandmarker は IMAGE runningMode なので直列実行
  for(const item of fileList){
    setStatus(item,'processing','処理中...');
    try{
      const r=await processOne(item.file,sz);
      item.gifBlob=r.blob;
      item.imgEl.src=URL.createObjectURL(r.blob);
      setStatus(item,'done','✓ '+(r.bytes/1024|0)+'KB');
      gifResults.push(item);
    }catch(e){
      setStatus(item,'failed','✗ '+e.message);
      log((skip?'  skip:':'  fail:'),item.relPath,'-',e.message);
    }
    done++;
    $('prog').value=done;
    $('status').textContent=done+'/'+fileList.length+' 完了 (成功:'+gifResults.length+')';
  }
  log('✓ 完了:',gifResults.length+'/'+fileList.length);
  $('btnStart').disabled=false;
  $('btnZip').disabled=gifResults.length===0;
}

async function makeZip(){
  const zip=new JSZip();
  for(const item of gifResults){
    if(!item.gifBlob)continue;
    const p=item.relPath.replace(/\.(webp|jpe?g|png)$/i,'.gif');
    zip.file(p,item.gifBlob);
  }
  $('status').textContent='ZIP生成中...';
  const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='lipsync_gallery.zip';a.click();
  $('status').textContent='ZIPダウンロード開始: '+(blob.size/1024/1024).toFixed(1)+'MB';
  log('ZIP生成:',gifResults.length+'ファイル,',(blob.size/1024/1024).toFixed(1)+'MB');
}

// === イベント ===
$('fileInput').addEventListener('change',e=>addFiles(Array.from(e.target.files)));
$('fileInputFiles').addEventListener('change',e=>addFiles(Array.from(e.target.files)));
$('modeSwitch').addEventListener('click',e=>{
  e.preventDefault();
  const dz=$('dropZone'),ms=$('modeSwitch');
  if(dz.getAttribute('for')==='fileInput'){dz.setAttribute('for','fileInputFiles');ms.textContent='→ フォルダ選択に切替';}
  else{dz.setAttribute('for','fileInput');ms.textContent='→ 個別ファイル選択に切替';}
});
$('dropZone').addEventListener('dragover',e=>{e.preventDefault();$('dropZone').classList.add('dragover');});
$('dropZone').addEventListener('dragleave',e=>{$('dropZone').classList.remove('dragover');});
$('dropZone').addEventListener('drop',async e=>{
  e.preventDefault();$('dropZone').classList.remove('dragover');
  const items=e.dataTransfer.items;
  const files=[];
  async function walk(entry,path){
    if(entry.isFile){
      await new Promise(res=>{entry.file(f=>{try{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});}catch(e){}files.push(f);res();});});
    }else if(entry.isDirectory){
      const rd=entry.createReader();
      await new Promise(res=>{
        const collect=[];
        (function readMore(){
          rd.readEntries(async ents=>{
            if(!ents.length){for(const c of collect)await walk(c,path+entry.name+'/');res();}
            else{for(const en of ents)collect.push(en);readMore();}
          });
        })();
      });
    }
  }
  if(items&&items[0]&&items[0].webkitGetAsEntry){
    for(let i=0;i<items.length;i++){
      const en=items[i].webkitGetAsEntry();
      if(en)await walk(en,'');
    }
    addFiles(files);
  }else{
    addFiles(Array.from(e.dataTransfer.files));
  }
});
$('btnStart').onclick=runBatch;
$('btnZip').onclick=makeZip;
$('btnClear').onclick=()=>{fileList=[];gifResults=[];$('gallery').innerHTML='';$('btnStart').disabled=true;$('btnZip').disabled=true;$('prog').value=0;$('status').textContent='';};

// === 起動 ===
(async()=>{
  log('初期化...');
  try{
    await initFL();
    log('ギャラリーフォルダをドロップしてください');
    if(fileList.length>0)$('btnStart').disabled=false;
  }catch(e){
    log('❌ MediaPipe初期化失敗:',e.message||e);
    log('詳細:',e.stack||'(スタックなし)');
  }
})();
</script>
