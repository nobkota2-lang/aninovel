<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 - ページが見つかりません | アニノベル</title>
<!-- ------------------------------------------------------------------
     このページの言葉について
     ------------------------------------------------------------------
     404 は何よりも速く出たい。だから js/i18n.js (31KB) は読まない。
     差し替えるのは5語だけなので、このページの中に置いている。
     日本語は本文にそのまま書いてある。JavaScript が動かない人にも
     読めるように。英語のときだけ、描く前に隠して、入れ替えてから
     見せる。index.html と同じやり方。
     ------------------------------------------------------------------ -->
<script>(function(){try{
  var l=localStorage.getItem('aninovel_lang_v1')||localStorage.getItem('aninovel_lang')||'ja';
  if(l!=='en')return;
  var d=document.documentElement;
  d.lang='en';
  d.className=(d.className?d.className+' ':'')+'i18n-pending';
  var reveal=function(){try{d.className=d.className.replace(/\bi18n-pending\b/g,'').trim();}catch(e){}};
  setTimeout(reveal,3000);          // 何かあっても、白い画面のままにはしない
  document.addEventListener('DOMContentLoaded',function(){
    try{
      document.title='404 - Page not found | AniNovel';
      var EN={
        'h2':'Page not found',
        'p':'The story you are looking for has moved on, or does not exist yet.<br>Shall we go back to the top page and look for a new one?',
        'a':'\uD83D\uDCD6 Back to the top page',
        'deco':'\u2014\u2014 AniNovel \u2014\u2014'
      };
      var b=document.querySelector('.box');
      if(b){
        var h2=b.querySelector('h2'); if(h2)h2.textContent=EN.h2;
        var ps=b.querySelectorAll('p');
        if(ps[0])ps[0].innerHTML=EN.p;
        var a=b.querySelector('a'); if(a)a.textContent=EN.a;
        var dc=b.querySelector('.deco'); if(dc)dc.textContent=EN.deco;
      }
    }catch(e){}
    reveal();
  });
}catch(e){}})();</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');
html.i18n-pending body{visibility:hidden}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Kaku Gothic New','Noto Serif JP',serif;background:linear-gradient(160deg,#2D2A26,#6B4423);color:#FAF6F0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.box{max-width:520px;padding:40px}
h1{font-family:'Noto Serif JP',serif;font-size:96px;font-weight:700;margin-bottom:8px;letter-spacing:8px}
h2{font-size:22px;font-weight:500;margin-bottom:24px;opacity:.85}
p{font-size:15px;line-height:1.8;opacity:.7;margin-bottom:32px}
a{display:inline-block;padding:14px 32px;background:#C0392B;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;letter-spacing:2px;transition:transform .2s,box-shadow .2s}
a:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.deco{font-size:14px;opacity:.4;margin-top:32px;letter-spacing:4px}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <h2>ページが見つかりません</h2>
  <p>お探しの物語は、別の場所へ旅立ったか、まだ存在しないようです。<br>トップに戻って、新しい物語を探してみませんか？</p>
  <a href="/">📖 トップに戻る</a>
  <p class="deco">—— アニノベル ——</p>
</div>
</body>
</html>
