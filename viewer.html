    {id:'c1',type:'narration',text:'真夏の太陽が照りつける中、少年は海辺の小道を歩いていた。潮風が頬を撫で、遠くでカモメの鳴き声が聞こえる。',order:0},
    {id:'c2',type:'dialogue',characterId:'char1',text:'やっと着いた！ここが例の洞窟なんだね。',order:1},
    {id:'c3',type:'dialogue',characterId:'char2',text:'でも、ちょっと怖いかも...本当に入るの？',order:2},
    {id:'c4',type:'narration',text:'二人は洞窟の入り口に立ち、暗闇の奥を見つめた。そこには、想像を超える冒険が待っていた。',order:3},
    {id:'c5',type:'pageBreak',order:4},
    {id:'c6',type:'dialogue',characterId:'char1',text:'行こう！きっと宝物が見つかるはずだよ！',order:5}

    var pub=JSON.parse(localStorage.getItem('aninovel_published_works')||'{}');
    if(pub[wp]){pub[wp].data=payload;pub[wp].updatedAt=new Date().toISOString();localStorage.setItem('aninovel_published_works',JSON.stringify(pub));console.info('[Save] pub_ → aninovel_published_works に保存',wp);}

  }else if(wp){
    // 同梱作品(リポジトリ配信のJSON)のオーバーライドを localStorage に保存
    // → 次回ロード時に静的JSONにマージされる
    var ov=JSON.parse(localStorage.getItem('aninovel_bundled_overrides')||'{}');
    ov[wp]={data:payload,updatedAt:new Date().toISOString()};
    localStorage.setItem('aninovel_bundled_overrides',JSON.stringify(ov));
    console.info('[Save] 同梱作品 → aninovel_bundled_overrides に保存',wp);
  }else{
    localStorage.setItem('aninovel_data',JSON.stringify(Object.assign({},payload,{bookmarks:state.bookmarks,darkMode:state.darkMode,timestamp:new Date().toISOString()})));
  }
  state.lastSaved=new Date().toLocaleTimeString();

}catch(e){console.error('[Save]エラー',e);alert('保存エラー: '+e.message);}render()}

async function exportDataWithAudio(){
  var wid=_currentWorkId();
  var keys=await _idbKeysByWork(wid);
  if(!keys.length){
    if(!confirm('このブラウザにこの作品の生成音声がありません。\n音声なしでエクスポートしますか? (「~1F3A4~ 音声生成」ボタンで先に作れます)'))return;
    return exportData();
  }
  // Base64は元の約1.33倍に膨らみ、しかも1つのJSON文字列に載せるので
  // 大きい作品では確実にメモリが足りなくなる。先に見積もって警告する。
  var _est=0;
  for(var _s=0;_s<Math.min(keys.length,20);_s++){
    var _r0=await _idbGet(wid,keys[_s].itemId,keys[_s].lang);
    if(_r0&&_r0.blob)_est+=_r0.blob.size;
  }
  var _estMB=Math.round(_est/Math.max(Math.min(keys.length,20),1)*keys.length*1.4/1e6);
  if(_estMB>300&&!confirm('音声'+keys.length+'件を埋め込むと約'+_estMB+'MBのファイルになります。\n'
      +'この大きさだとブラウザが落ちる可能性が高いです。\n\n'
      +'投稿すれば音声はサーバーに保存され、読者にも配信されます。\n'
      +'それでも埋め込みエクスポートを続けますか？'))return;
  var pg=_showProgress('~1F4E6~ 音声埋込みエクスポート中');
  try{
    var audioStore={};var i=0;
    for(var k=0;k<keys.length;k++){
      _updateProgress(pg,++i,keys.length,keys[k].itemId);
      var r=await _idbGet(wid,keys[k].itemId,keys[k].lang);
      if(!r||!r.blob)continue;
      var b64=await _blobToB64(r.blob);
      audioStore[r.itemId]={b64:b64,mime:(r.blob&&r.blob.type)||'audio/wav',meta:r.meta||{}};
      r=null;b64=null;
      if(i%25===0)await new Promise(function(res){setTimeout(res,0);});
    }
    var payload={
      version:'2.3',
      novel:state.novel,chapters:state.chapters,characters:state.characters,
      content:state.content,displaySettings:state.displaySettings,bookmarks:state.bookmarks,
      audioStore:audioStore,
      audioEngine:'voicevox',
      timestamp:new Date().toISOString()
    };
    var blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=(state.novel.title||'作品')+'_音声付_'+Date.now()+'.aninovel';a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    alert(state.lang==='en'?('Export complete ('+recs.length+' audio embedded, approx '+Math.round(blob.size/1024)+'KB)'):('エクスポート完了 ('+recs.length+'音声を埋込み, サイズ約'+Math.round(blob.size/1024)+'KB)'));
  }finally{_hideProgress(pg);}
}

function exportTxt(){
  var lines=[];var title=state.novel.title||'無題';var author=state.novel.author||'';
  lines.push(title);if(author)lines.push('著：'+author);lines.push('');lines.push('');
  var sorted=state.content.slice().sort(function(a,b){return a.order-b.order});
  sorted.forEach(function(item){
    if(item.type==='chapter_break'){lines.push('');lines.push('═══════════════════');lines.push(item.text||'');lines.push('═══════════════════');lines.push('');}
    else if(item.type==='section_break'){lines.push('');lines.push('───────────────────');lines.push(item.text||'');lines.push('───────────────────');lines.push('');}
    else if(item.type==='page_break'){lines.push('');lines.push('＊　　＊　　＊');lines.push('');}
    else if(item.type==='narration'){lines.push('　'+item.text);}
    else if(item.type==='dialogue'){
      var ch=state.characters.find(function(c){return c.id===item.characterId});
      var name=ch?ch.name:'';
      lines.push(name+'「'+item.text+'」');
    }
  });
  var txt=lines.join('\n');
  var b=new Blob(['\uFEFF'+txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(state.novel.title||'作品')+'.txt';a.click();URL.revokeObjectURL(a.href);
}

// --- 音声性別判定 ---
function _voiceGender(v){
  var raw=v.name||'';
  var n=raw.toLowerCase();
  // 漢字名 (Edge Natural 日本語表記)
  if(/七海|碧衣|真夕|志織|彩|遥香|歩美|沙耶香|美月|花|結菜|楓|桜|凛/.test(raw))return'female';
  if(/圭太|大智|直紀|一郎|健|拓海|翔|蓮|樹|涼太/.test(raw))return'male';
  // macOS/iOS
  if(/kyoko|haruka|ayumi|mizuki|nanami|female|woman|sayuri|akari|hana|sora-f|yuna|aoi|mayu|shiori|sayaka/i.test(n))return'female';
  if(/otoya|ichiro|keita|male|man|takumi|shin.ichi|naoki|sora-m|daichi/i.test(n))return'male';
  if(/samantha|victoria|karen|tessa|moira|fiona|serena|allison|ava|susan|zira|jenny|aria|michelle|nicky|joanna|salli|kimberly|kendra|emma|amy|sonia|libby/i.test(n))return'female';
  if(/daniel|alex|fred|tom|aaron|oliver|david|mark|guy|ryan|matthew|joey|brian|arthur|george|eric|liam/i.test(n))return'male';
  // Google Wavenet/Standard/Neural2/News (A,B=女性 C,D=男性)
  if(/[-_][ab]\b/i.test(n))return'female';
  if(/[-_][cd]\b/i.test(n))return'male';
  return'unknown';
}
function _voiceLabel(v){
  var g=_voiceGender(v);

}

// Edge Online Natural 日本語音声カタログ (ブラウザ標準で使える最高品質)
// ブラウザにより漢字 (七海/圭太/碧衣/大智/真夕/直紀/志織) かローマ字 (Nanami/Keita/...) で登録されるので両方掲載
var _NATURAL_JA_FEMALE=['七海 Online','碧衣 Online','真夕 Online','志織 Online','Nanami Online','Aoi Online','Mayu Online','Shiori Online','Nanami','Aoi','Mayu','Shiori','Sayaka','Haruka','Ayumi'];
var _NATURAL_JA_MALE=['圭太 Online','大智 Online','直紀 Online','Keita Online','Daichi Online','Naoki Online','Keita','Daichi','Naoki','Ichiro'];
function _matchVoiceByPrefs(voices,prefs){
  for(var i=0;i<prefs.length;i++){
    var p=prefs[i].toLowerCase();
    var m=voices.find(function(v){var n=(v.name||'').toLowerCase();return n===p||n.indexOf(p)>=0;});
    if(m)return m;
  }
  return null;
}
// 高品質音声（Neural/Natural/Wavenet等）優先スコア
function _voiceQuality(v){
  var n=(v.name||'').toLowerCase();
  if(/natural|online.*natural/.test(n))return 100; // Edge/Windows Neural
  if(/neural|neural2/.test(n))return 90;
  if(/wavenet/.test(n))return 85;
  if(/studio|news/.test(n))return 80;
  if(/premium|enhanced/.test(n))return 70;
  if(v.localService===false)return 60; // クラウド一般
  return 10;
}
function _sortByQuality(arr){return arr.slice().sort(function(a,b){return _voiceQuality(b)-_voiceQuality(a);});}

// --- キャラクター別音声自動割り当て (Edge Natural音声を優先カタログから割当) ---
var _charVoiceMap={};
// 実際に発話させたら synthesis-failed になった音声を記録する(音声名→true)。
// Windows の SAPI 音声(Microsoft Ichiro 等)はブラウザによっては列挙されるのに
// 一切鳴らせないことがあり、その音声を割り当てられたキャラだけ無音になっていた。
var _badVoices={};
// _badVoices を避けて、鳴らせる見込みのある日本語音声を1つ返す。
// exclude(現在使用中で失敗した音声)は必ず除外する。性別一致を優先し、
// 見つからなければ品質順(オンライン音声も含む)で選ぶ。
function _pickWorkingJaVoice(ch,exclude){
  var voices=state.tts.voices;if(!voices||!voices.length)voices=speechSynthesis.getVoices();
  var ja=voices.filter(function(v){return v.lang&&v.lang.indexOf('ja')===0;});
  var ok=ja.filter(function(v){return !_badVoices[v.name]&&(!exclude||v.name!==exclude.name);});
  if(!ok.length)return null;
  var g=ch&&ch.gender;
  if(g&&g!=='neutral'){
    var gv=ok.filter(function(v){return _voiceGender(v)===g;});
    if(gv.length)return _sortByQuality(gv)[0];
  }
  return _sortByQuality(ok)[0];
}
function _buildVoicePool(voices,prefList,fallbackPool){
  var pool=[];var seen={};
  prefList.forEach(function(p){
    var pl=p.toLowerCase();
    voices.forEach(function(v){
      var n=(v.name||'').toLowerCase();
      if(seen[v.name])return;
      if(n===pl||n.indexOf(pl)>=0){pool.push(v);seen[v.name]=true;}
    });
  });
  // 不足分は性別フォールバック品質順
  fallbackPool.forEach(function(v){if(!seen[v.name]){pool.push(v);seen[v.name]=true;}});
  return pool;
}
function _assignCharVoices(){
  var voices=state.tts.voices;if(!voices||!voices.length)voices=speechSynthesis.getVoices();
  var ja=voices.filter(function(v){return v.lang&&v.lang.indexOf('ja')===0;});
  // 過去に synthesis-failed になった音声は割当対象から外す(全滅する場合のみ元に戻す)
  var _jaOk=ja.filter(function(v){return !_badVoices[v.name];});
  if(_jaOk.length)ja=_jaOk;
  var jaFemRaw=_sortByQuality(ja.filter(function(v){return _voiceGender(v)==='female';}));
  var jaMasRaw=_sortByQuality(ja.filter(function(v){return _voiceGender(v)==='male';}));
  var jaUnkRaw=_sortByQuality(ja.filter(function(v){return _voiceGender(v)==='unknown';}));
  // Edge Natural を最優先で並べ、その後品質順フォールバックを足す
  var fem=_buildVoicePool(voices,_NATURAL_JA_FEMALE,jaFemRaw.length?jaFemRaw:ja);
  var mas=_buildVoicePool(voices,_NATURAL_JA_MALE,jaMasRaw.length?jaMasRaw:ja);
  var unk=jaUnkRaw.length?jaUnkRaw:ja;
  if(!fem.length)fem=ja;
  if(!mas.length)mas=ja;
  if(!unk.length)unk=ja;
  _charVoiceMap={};
  var fi=0,mi=0,ui=0;
  // narrator は中性なので、まず男性カタログ末尾の渋い声を割当
  state.characters.forEach(function(ch){
    var rc=(!state.isAuthorMode)&&state.readerCustom&&state.readerCustom[ch.id];
    if(rc&&rc.ttsVoice)return;
    if(ch.ttsVoice)return;
    var g=ch.gender||'male';
    if(ch.id==='narrator'){
      // ナレータは女性ナチュラル(Aoi等)を使うと聞き取りやすい
      var nv=_matchVoiceByPrefs(voices,['碧衣 Online','Aoi Online','真夕 Online','Mayu Online','七海 Online','Nanami Online','碧衣','Aoi']);
      if(nv){_charVoiceMap[ch.id]=nv.name;return;}
    }
    if(g==='female'&&fem.length){_charVoiceMap[ch.id]=fem[fi%fem.length].name;fi++;}
    else if(g==='male'&&mas.length){_charVoiceMap[ch.id]=mas[mi%mas.length].name;mi++;}
    else if(unk.length){_charVoiceMap[ch.id]=unk[ui%unk.length].name;ui++;}
  });
  // デバッグ: 何が割り当たったか
  try{
    var assigned=Object.keys(_charVoiceMap).map(function(k){var ch=state.characters.find(function(c){return c.id===k});return (ch&&ch.name||k)+'→'+_charVoiceMap[k];});
    console.info('[TTS] 音声割当:',assigned.join(' / '));
    // 診断用: 利用可能な日本語音声一覧を出力 (Ayumi=rate無視, Haruka/Sayaka/Ichiro=rate対応)
    var allJa=voices.filter(function(v){return v.lang&&v.lang.indexOf('ja')===0;});
    console.info('[TTS] 利用可能な日本語音声('+allJa.length+'種):',allJa.map(function(v){return v.name+(v.localService?' [offline]':' [online]');}).join(' | '));
    var nat=voices.filter(function(v){var n=(v.name||'').toLowerCase();return v.lang&&v.lang.indexOf('ja')===0&&/natural/.test(n);});
    if(!nat.length)console.warn('[TTS] Edge Natural日本語音声が見つかりません。Microsoft Edge ブラウザを使うと劇的に品質が向上します。Chrome の場合はクラウドTTSフォールバック。');
    else console.info('[TTS] Natural音声検出:',nat.length+'種');
  }catch(e){}
}

// --- キャラクターの音声を返す（性別対応・キャラ別割り当て） ---
function _ttsVoice(ch){
  var voices=state.tts.voices;if(!voices||!voices.length)voices=speechSynthesis.getVoices();
  var lang=(ch&&ch.voiceLang==='en')?'en':'ja';
  var voiceName=null;
  if(ch){
    var rc=(!state.isAuthorMode)&&state.readerCustom&&state.readerCustom[ch.id];
    voiceName=(rc&&rc.ttsVoice)||_charVoiceMap[ch.id]||null; // 旧 character.ttsVoice(手動選択)は廃止
  }
  if(voiceName){var v=voices.find(function(x){return x.name===voiceName});if(v&&v.lang&&v.lang.indexOf(lang)===0)return v;}
  var langVoices=_sortByQuality(voices.filter(function(v){return v.lang&&v.lang.indexOf(lang)===0}));
  if(!langVoices.length){
    langVoices=_sortByQuality(voices.filter(function(v){return v.lang&&v.lang.indexOf(lang==='en'?'ja':'en')===0}));
    if(!langVoices.length)return voices[0]||null;
  }
  var gender=ch?(ch.gender||'male'):'male';
  if(gender!=='neutral'){
    var gv=langVoices.filter(function(v){return _voiceGender(v)===gender});
    if(gv.length)return gv[0];
  }
  return langVoices[0];
}

// ====== MediaPipe FaceMesh 遅延初期化 ======
var _fmInstance=null, _fmInitPromise=null, _fmBusy=false, _fmQueue=[];
function _fmAvailable(){return typeof FaceMesh!=='undefined';}
function _fmGet(){
  if(_fmInitPromise)return _fmInitPromise;
  if(!_fmAvailable())return Promise.reject(new Error('FaceMesh未ロード'));
  _fmInitPromise=new Promise(function(resolve,reject){
    try{
      var fm=new FaceMesh({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/'+f;}});
      fm.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.3});

    }catch(e){reject(e);}
  });

// 直列化：MediaPipeは並列呼び出しで結果が混ざるため、キューで1件ずつ処理
function _fmDetect(srcCanvas,sz){
  return new Promise(function(resolve,reject){
    _fmQueue.push({cv:srcCanvas,sz:sz,resolve:resolve,reject:reject});
    _fmDrain();
  });
}
function _fmDrain(){
  if(_fmBusy||!_fmQueue.length)return;
  var job=_fmQueue.shift();_fmBusy=true;
  _fmGet().then(function(fm){
    var timer=setTimeout(function(){_fmBusy=false;job.reject(new Error('検出タイムアウト'));_fmDrain();},12000);
    fm.onResults(function(res){
      clearTimeout(timer);_fmBusy=false;
      if(!res.multiFaceLandmarks||!res.multiFaceLandmarks.length){job.reject(new Error('顔未検出'));}
      else{job.resolve(res.multiFaceLandmarks[0].map(function(p){return {x:p.x*job.sz,y:p.y*job.sz,z:p.z*job.sz};}));}
      _fmDrain();
    });
    fm.send({image:job.cv}).catch(function(e){_fmBusy=false;job.reject(e);_fmDrain();});
  }).catch(function(e){_fmBusy=false;job.reject(e);_fmDrain();});
}

function _mpDeform(srcLM,openness){
  var dst=srcLM.map(function(p){return {x:p.x,y:p.y,z:p.z};});
  var ml=srcLM[_MP_MOUTH_L],mr=srcLM[_MP_MOUTH_R];
  var mw=mr.x-ml.x;
  var baseGap=mw*0.18*openness;
  var cx=(ml.x+mr.x)/2;
  _MP_UPPER.forEach(function(i){if(!dst[i])return;var r=1-Math.min(1,Math.abs(dst[i].x-cx)/(mw/2));dst[i].y-=baseGap*0.40*r;});
  _MP_LOWER.forEach(function(i){if(!dst[i])return;var r=1-Math.min(1,Math.abs(dst[i].x-cx)/(mw/2));dst[i].y+=baseGap*0.60*r;});
  return dst;
}
function _mpDrawTri(ctx,src,sx0,sy0,sx1,sy1,sx2,sy2,dx0,dy0,dx1,dy1,dx2,dy2){
  ctx.save();ctx.beginPath();ctx.moveTo(dx0,dy0);ctx.lineTo(dx1,dy1);ctx.lineTo(dx2,dy2);ctx.closePath();ctx.clip();
  var den=sx0*(sy2-sy1)+sx1*(sy0-sy2)+sx2*(sy1-sy0);
  if(Math.abs(den)<1e-6){ctx.restore();return;}
  var a=(dx0*(sy2-sy1)+dx1*(sy0-sy2)+dx2*(sy1-sy0))/den;
  var c=(dx0*(sx1-sx2)+dx1*(sx2-sx0)+dx2*(sx0-sx1))/den;
  var e=(dx0*(sx2*sy1-sx1*sy2)+dx1*(sx0*sy2-sx2*sy0)+dx2*(sx1*sy0-sx0*sy1))/den;
  var b=(dy0*(sy2-sy1)+dy1*(sy0-sy2)+dy2*(sy1-sy0))/den;
  var d=(dy0*(sx1-sx2)+dy1*(sx2-sx0)+dy2*(sx0-sx1))/den;
  var f=(dy0*(sx2*sy1-sx1*sy2)+dy1*(sx0*sy2-sx2*sy0)+dy2*(sx1*sy0-sx0*sy1))/den;
  ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(src,0,0);ctx.restore();ctx.setTransform(1,0,0,1,0,0);
}

// ====== IndexedDB GIFキャッシュ ======
var _lipDB=null;
var _lipDBFailed=false;
function _lipDBOpen(){
  if(_lipDB)return Promise.resolve(_lipDB);
  if(_lipDBFailed)return Promise.resolve(null);
  return new Promise(function(resolve){
    var done=false;
    var tid=setTimeout(function(){if(done)return;done=true;_lipDBFailed=true;console.info('[LipSync] IndexedDB タイムアウト→無効化');resolve(null);},1500);
    try{
      if(typeof indexedDB==='undefined'){done=true;clearTimeout(tid);_lipDBFailed=true;resolve(null);return;}
      var rq=indexedDB.open('aninovel_lipsync',1);
      rq.onupgradeneeded=function(e){try{e.target.result.createObjectStore('gif',{keyPath:'key'});}catch(_){}};
      rq.onsuccess=function(){if(done)return;done=true;clearTimeout(tid);_lipDB=rq.result;resolve(_lipDB);};
      rq.onerror=function(){if(done)return;done=true;clearTimeout(tid);_lipDBFailed=true;console.info('[LipSync] IndexedDB open error→無効化');resolve(null);};
      rq.onblocked=function(){if(done)return;done=true;clearTimeout(tid);_lipDBFailed=true;resolve(null);};
    }catch(e){if(!done){done=true;clearTimeout(tid);_lipDBFailed=true;resolve(null);}}
  });
}
function _lipDBGet(key){
  return _lipDBOpen().then(function(db){
    if(!db)return null;
    return new Promise(function(resolve){
      try{
        var tx=db.transaction('gif','readonly').objectStore('gif').get(key);
        tx.onsuccess=function(){resolve(tx.result?tx.result.blob:null);};
        tx.onerror=function(){resolve(null);};
      }catch(e){resolve(null);}
    });
  });
}
function _lipDBPut(key,blob){
  return _lipDBOpen().then(function(db){
    if(!db)return;
    try{db.transaction('gif','readwrite').objectStore('gif').put({key:key,blob:blob});}catch(e){}
  });
}


// ====== コンパクトGIFエンコーダ（外部ライブラリ不要） ======
function _gif_lzw(data,minBits){
  var cc=1<<minBits,eoi=cc+1,bits=minBits+1,nc=eoi+1;
  var out=[],buf=0,blen=0;
  function emit(code){buf|=(code<<blen);blen+=bits;while(blen>=8){out.push(buf&0xFF);buf>>>=8;blen-=8;}}
  var dict=[];
  for(var i=0;i<cc;i++)dict[i]={};
  if(data.length===0){emit(cc);emit(eoi);if(blen>0)out.push(buf&0xFF);return out;}
  emit(cc);
  var prefix=data[0];
  for(var pos=1;pos<data.length;pos++){
    var sym=data[pos];
    if(dict[prefix]&&dict[prefix][sym]!==undefined){
      prefix=dict[prefix][sym];
    }else{
      emit(prefix);
      if(nc<=4095){
        if(!dict[prefix])dict[prefix]={};
        dict[prefix][sym]=nc++;
        if(nc>(1<<bits)&&bits<12)bits++;
      }else{
        emit(cc);bits=minBits+1;nc=eoi+1;
        dict=[];for(var j=0;j<cc;j++)dict[j]={};
      }
      prefix=sym;
    }
  }
  emit(prefix);emit(eoi);
  if(blen>0)out.push(buf&0xFF);
  return out;
}

function _gif_palette(frames,w,h){
  var hist={};
  for(var f=0;f<frames.length;f++){
    var rgba=frames[f];
    for(var i=0;i<rgba.length;i+=4){
      if(rgba[i+3]<80)continue;
      var r=rgba[i]>>4,g=rgba[i+1]>>4,b=rgba[i+2]>>4;
      var key=(r<<8)|(g<<4)|b;
      hist[key]=(hist[key]||0)+1;
    }
  }
  var sorted=Object.keys(hist).sort(function(a,b){return hist[b]-hist[a];});
  var pal=[[0,0,0]];
  for(var k=0;k<Math.min(255,sorted.length);k++){
    var ki=parseInt(sorted[k]);
    pal.push([(ki>>8)<<4,((ki>>4)&15)<<4,(ki&15)<<4]);
  }
  while(pal.length<256)pal.push([0,0,0]);
  return pal;
}

function _gif_quantize(rgba,pal){
  var n=rgba.length>>2,idx=new Uint8Array(n),cache={};
  for(var i=0;i<n;i++){
    var r=rgba[i*4],g=rgba[i*4+1],b=rgba[i*4+2];
    var key=(r>>4)|((g>>4)<<4)|((b>>4)<<8);
    if(cache[key]!==undefined){idx[i]=cache[key];continue;}
    var best=1,bestD=1e9;
    for(var j=1;j<pal.length;j++){
      var dr=r-pal[j][0],dg=g-pal[j][1],db=b-pal[j][2];
      var d=dr*dr+dg*dg+db*db;
      if(d<bestD){bestD=d;best=j;}
      if(d===0)break;
    }
    cache[key]=best;idx[i]=best;
  }
  return idx;
}

function _gifEncode(frames,w,h,delayCs){
  var pal=_gif_palette(frames,w,h);
  var cb=2;while((1<<cb)<pal.length)cb++;
  cb=Math.max(2,Math.min(8,cb));
  var ps=1<<cb,out=[];
  // GIF89a
  [0x47,0x49,0x46,0x38,0x39,0x61].forEach(function(b){out.push(b);});
  // Logical Screen Descriptor
  out.push(w&0xFF,(w>>8)&0xFF,h&0xFF,(h>>8)&0xFF,0x80|(cb-1),0,0);
  // Global Color Table
  for(var i=0;i<ps;i++){var c=pal[i]||[0,0,0];out.push(c[0],c[1],c[2]);}
  // Netscape loop extension (infinite)
  [0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00].forEach(function(b){out.push(b);});
  // Frames
  for(var f=0;f<frames.length;f++){
    // Graphic Control Extension
    [0x21,0xF9,0x04,0x00].forEach(function(b){out.push(b);});
    out.push(delayCs&0xFF,(delayCs>>8)&0xFF,0,0);
    // Image Descriptor
    [0x2C,0,0,0,0].forEach(function(b){out.push(b);});
    out.push(w&0xFF,(w>>8)&0xFF,h&0xFF,(h>>8)&0xFF,0x00);
    // Image Data
    out.push(cb);
    var idx=_gif_quantize(frames[f],pal);
    var lzw=_gif_lzw(idx,cb);
    for(var pos=0;pos<lzw.length;){
      var len=Math.min(255,lzw.length-pos);
      out.push(len);
      for(var k=0;k<len;k++)out.push(lzw[pos++]);
    }
    out.push(0);
  }
  out.push(0x3B);
  return new Uint8Array(out);
}

// ====== 口部分カラー分析 ======
function _analyzeMouth(ctx,sz){
  var rs=Math.floor(sz*0.48),re=Math.floor(sz*0.82);
  var cc=Math.floor(sz/2),cw=Math.floor(sz*0.52),cl=cc-Math.floor(cw/2);
  var bestScore=-1,bestRow=Math.floor(sz*0.68),bestX=cl,bestW=cw;
  for(var row=rs;row<re;row++){
    var px;try{px=ctx.getImageData(cl,row,cw,1).data;}catch(e){continue;}
    var score=0,lx1=cw,lx2=0,lipCnt=0;
    for(var x=0;x<cw;x++){
      var r=px[x*4],g=px[x*4+1],b=px[x*4+2];
      // 赤み・ピンク系（唇）判定
      var isLip=(r>130&&r>g*1.18&&r>b*1.05&&g>50&&b>30);
      // 暗い輪郭線（アニメ）判定
      var isDark=(r<75&&g<75&&b<75);
      if(isLip){score+=2;lipCnt++;lx1=Math.min(lx1,x);lx2=Math.max(lx2,x);}
      if(isDark)score+=1;
    }
    if(score>bestScore){
      bestScore=score;bestRow=row;
      if(lipCnt>3){bestX=cl+lx1;bestW=Math.max(8,lx2-lx1+1);}
    }
  }
  var mw=bestW>5?Math.min(bestW,Math.floor(sz*0.44)):Math.floor(sz*0.30);
  var mx=(bestX+mw/2)>(sz*0.25)&&(bestX+mw/2)<(sz*0.75)?bestX:(cc-Math.floor(mw/2));
  return{y:bestRow,x:mx,w:mw};
}

function _genSpeechFrames_OLD(img,sz){

  var OPENS=[0,0.15,0.52,0.90,1.0,0.90,0.52,0.15];

  var sy=mouth.y,mw=mouth.w,mx=mouth.x+mw/2;
  var maxGap=Math.round(sz*0.14);

  for(var fi=0;fi<OPENS.length;fi++){
    var op=OPENS[fi];
    var gap=Math.round(maxGap*op);
    var up=Math.round(gap*0.40),dn=Math.round(gap*0.60);
    var fc=document.createElement('canvas');
    fc.width=sz;fc.height=sz;
    var fctx=fc.getContext('2d');

    fctx.beginPath();fctx.arc(sz/2,sz/2,sz/2,0,Math.PI*2);fctx.clip();

    if(op<0.05){
      // 閉じた口：元画像そのまま
      fctx.drawImage(img,0,0,sz,sz);
    }else{
      var gY1=sy-up,gY2=sy+dn,gH=gY2-gY1;
      // 1) 元画像をベースとして描画
      fctx.drawImage(img,0,0,sz,sz);
      // 2) 口の開く隙間を暗く塗りつぶす
      fctx.fillStyle='rgb(12,4,3)';
      fctx.fillRect(0,gY1,sz,Math.max(1,gH));
      // 3) 上半身（0〜sy）をup分上にシフト
      fctx.drawImage(img,0,0,sz,sy,0,-up,sz,sy);
      // 4) 下半身（sy〜sz）をdn分下にシフト
      fctx.drawImage(img,0,sy,sz,sz-sy,0,sy+dn,sz,sz-sy);
      // 5) 口の内側を描画
      if(gH>1){
        var midY=(gY1+gY2)/2;

        fctx.beginPath();
        fctx.ellipse(mx,midY,mw/2*0.94,gH/2+1.5,0,0,Math.PI*2);
        fctx.fillStyle='rgb(18,5,3)';
        fctx.fill();

        var grd=fctx.createRadialGradient(mx,midY,0,mx,midY,mw/2*0.94);
        grd.addColorStop(0,'rgba(55,12,8,0.65)');
        grd.addColorStop(1,'rgba(0,0,0,0)');
        fctx.beginPath();
        fctx.ellipse(mx,midY,mw/2*0.94,gH/2+1.5,0,0,Math.PI*2);
        fctx.fillStyle=grd;fctx.fill();
        // 上歯（40%以上開いた時）
        if(op>0.40){
          var thH=Math.min(gH*0.42,sz*0.048);
          fctx.beginPath();
          fctx.ellipse(mx,gY1+thH*0.52,mw/2*0.66,thH,0,0,Math.PI*2);
          fctx.fillStyle='rgba(252,248,244,0.93)';fctx.fill();
          // 歯の境界線
          fctx.beginPath();
          for(var t=0;t<3;t++){
            var tx=mx-mw/2*0.55+(mw/2*1.1/3)*t+mw/2*1.1/6;
            fctx.moveTo(tx,gY1+thH*0.1);
            fctx.lineTo(tx,gY1+thH*0.95);
          }
          fctx.strokeStyle='rgba(180,165,150,0.35)';fctx.lineWidth=0.8;fctx.stroke();
        }
        // 下歯（70%以上開いた時）
        if(op>0.70){

          fctx.beginPath();
          fctx.ellipse(mx,gY2-ltH*0.52,mw/2*0.56,ltH,0,0,Math.PI*2);
          fctx.fillStyle='rgba(248,244,238,0.85)';fctx.fill();
        }
        // 舌（88%以上開いた時）
        if(op>0.88){
          fctx.beginPath();
          fctx.ellipse(mx,gY2-gH*0.20,mw/2*0.40,gH*0.22,0,0,Math.PI*2);
          fctx.fillStyle='rgba(200,75,70,0.76)';fctx.fill();
        }
      }
    }
    fctx.restore();
    frames.push(new Uint8Array(fctx.getImageData(0,0,sz,sz).data));
  }
  return frames;
}

  ctx.restore();
}
// 唇色を元画像からサンプリング → 口腔色 (暗いピンク〜赤寄り)
function _sampleLipColor(srcCanvas,srcLM){
  try{
    var sctx=srcCanvas.getContext('2d');
    var pts=[0,13,14,17,37,267,61,291];
    var rs=0,gs=0,bs=0,n=0;
    for(var i=0;i<pts.length;i++){
      var p=srcLM[pts[i]];if(!p)continue;
      var px=Math.max(0,Math.min(srcCanvas.width-1,p.x|0));
      var py=Math.max(0,Math.min(srcCanvas.height-1,p.y|0));
      var d=sctx.getImageData(px,py,1,1).data;
      rs+=d[0];gs+=d[1];bs+=d[2];n++;
    }
    if(n===0)return{r:175,g:85,b:90};
    // 口腔色(濡れた赤ピンク): 唇より少し彩度を上げR高め、G/Bも潰しすぎない
    var ar=rs/n, ag=gs/n, ab=bs/n;
    var r=Math.min(215,Math.round(ar*0.92));
    var g=Math.round(ag*0.62);
    var b=Math.round(ab*0.64);
    // 下限を底上げして真っ黒にならないように
    return{r:Math.max(155,r), g:Math.max(70,g), b:Math.max(72,b)};
  }catch(e){return{r:175,g:85,b:90};}
}
function _mpWarpFrame(srcCanvas,srcLM,dstLM,sz,lipCol,op){
  var fc=document.createElement('canvas');fc.width=sz;fc.height=sz;
  var fctx=fc.getContext('2d');
  fctx.save();fctx.beginPath();fctx.arc(sz/2,sz/2,sz/2,0,Math.PI*2);fctx.clip();
  fctx.drawImage(srcCanvas,0,0);
  for(var k=0;k<_MP_MOUTH_TRIANGLES.length;k++){
    var tri=_MP_MOUTH_TRIANGLES[k];
    var s0=srcLM[tri[0]],s1=srcLM[tri[1]],s2=srcLM[tri[2]];
    var d0=dstLM[tri[0]],d1=dstLM[tri[1]],d2=dstLM[tri[2]];
    if(s0&&s1&&s2&&d0&&d1&&d2)_mpDrawTri(fctx,srcCanvas,s0,s1,s2,d0,d1,d2);
  }
  var upT=dstLM[_MP_UPPER_LIP_TOP],loB=dstLM[_MP_LOWER_LIP_BOTTOM];
  var cL=dstLM[_MP_MOUTH_CORNER_L],cR=dstLM[_MP_MOUTH_CORNER_R];
  var mh=Math.max(0,loB.y-upT.y);
  var mw=Math.hypot(cR.x-cL.x,cR.y-cL.y);
  var mcx=(cL.x+cR.x)/2,mcy=(upT.y+loB.y)/2;
  var lc=lipCol||{r:175,g:85,b:90};
  if(mh>1){
    fctx.save();
    fctx.beginPath();fctx.ellipse(mcx,mcy,mw/2*0.92,mh/2+0.5,0,0,Math.PI*2);
    fctx.fillStyle='rgb('+lc.r+','+lc.g+','+lc.b+')';fctx.fill();
    // 中央に明るい赤ピンクのハイライト → 口腔らしい湿り気と奥行き
    var grd=fctx.createRadialGradient(mcx,mcy,0,mcx,mcy,mw/2*0.92);
    grd.addColorStop(0,'rgba('+Math.min(255,lc.r+55)+','+Math.min(255,lc.g+28)+','+Math.min(255,lc.b+30)+',0.75)');
    grd.addColorStop(0.6,'rgba('+Math.min(255,lc.r+15)+','+Math.min(255,lc.g+6)+','+Math.min(255,lc.b+8)+',0.25)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=grd;fctx.fill();
    fctx.restore();
    // 歯: ほんのちょこっと。ピーク付近(op>=0.75)かつ mh>sz*0.045 の時だけ。サイズ/不透明度も控えめ
    if(op!=null&&op>=0.75&&mh>sz*0.045){
      var teethW=mw*0.18,teethH=sz*0.016;
      var tx=mcx,ty=upT.y+teethH*0.55;
      fctx.save();
      fctx.beginPath();fctx.ellipse(mcx,mcy,mw/2*0.92,mh/2+0.5,0,0,Math.PI*2);fctx.clip();
      fctx.beginPath();fctx.ellipse(tx,ty,teethW/2,teethH/2,0,0,Math.PI*2);
      fctx.fillStyle='rgba(238,224,200,0.55)';fctx.fill();
      var sg=fctx.createLinearGradient(tx,ty-teethH*0.2,tx,ty+teethH*1.1);
      sg.addColorStop(0,'rgba(0,0,0,0)');sg.addColorStop(0.6,'rgba(0,0,0,0.35)');sg.addColorStop(1,'rgba(0,0,0,0.85)');
      fctx.beginPath();fctx.ellipse(tx,ty,teethW/2,teethH/2*1.6,0,0,Math.PI*2);
      fctx.fillStyle=sg;fctx.fill();
      fctx.restore();
    }
  }
  fctx.restore();
  return fc;
}
function _genFramesMP(srcCanvas,sz){
  return _mpInit().then(function(fl){
    var r=fl.detect(srcCanvas);
    if(!r||!r.faceLandmarks||!r.faceLandmarks.length)throw new Error('顔未検出');
    var lm=r.faceLandmarks[0].map(function(p){return{x:p.x*sz,y:p.y*sz};});
    // ランドマーク妥当性チェック: 口の位置/サイズが妥当範囲にあるか
    var cL=lm[_MP_MOUTH_CORNER_L],cR=lm[_MP_MOUTH_CORNER_R];
    var upT=lm[_MP_UPPER_LIP_TOP],loB=lm[_MP_LOWER_LIP_BOTTOM];
    if(!cL||!cR||!upT||!loB)throw new Error('口ランドマーク欠損');
    var mw=Math.hypot(cR.x-cL.x,cR.y-cL.y);
    var mcy=(upT.y+loB.y)/2;
    var mcx=(cL.x+cR.x)/2;
    if(mw<sz*0.06||mw>sz*0.65)throw new Error('口幅が異常 mw='+mw.toFixed(1));
    if(mcy<sz*0.20||mcy>sz*0.95)throw new Error('口位置が異常 y='+mcy.toFixed(1));
    if(mcx<sz*0.15||mcx>sz*0.85)throw new Error('口位置が横に偏り x='+mcx.toFixed(1));
    var lipCol=_sampleLipColor(srcCanvas,lm);
    var frames=[];
    for(var i=0;i<_MP_OPENS.length;i++){
      var op=_MP_OPENS[i];
      var dst=_mpDeform(lm,op);
      var fc=_mpWarpFrame(srcCanvas,lm,dst,sz,lipCol,op);
      frames.push(new Uint8Array(fc.getContext('2d').getImageData(0,0,sz,sz).data));
    }
    return frames;
  });
}

// ====== GIFキャッシュと生成（MediaPipeのみ。失敗時は口パクしない） ======
function _buildSrcCanvas(img,sz,cropMode){
  var sw=img.naturalWidth,sh=img.naturalHeight,sd=Math.min(sw,sh);
  var sx,sy;
  if(cropMode==='wide'){
    sd=Math.max(sw,sh);
    sx=(sw-sd)/2;sy=(sh-sd)/2;
  }else if(cropMode==='center'){
    sx=(sw-sd)/2;sy=(sh-sd)/2;
  }else if(cropMode==='top-left'){
    // 横長画像で顔が左上にある場合 (例: ナレータ画像)
    sx=0;sy=0;
  }else if(cropMode==='top-center'){
    sx=(sw-sd)/2;sy=0;
  }else if(cropMode==='top-right'){
    sx=Math.max(0,sw-sd);sy=0;
  }else{ // default: 顔が上寄りの写真向け
    sx=(sw-sd)/2;sy=Math.max(0,(sh-sd)/2-sd*0.05);
  }
  var c=document.createElement('canvas');c.width=sz;c.height=sz;
  var cx=c.getContext('2d');
  cx.fillStyle='#000';cx.fillRect(0,0,sz,sz);
  // ソースが canvas をはみ出しても drawImage は自動クリップ
  cx.drawImage(img,sx,sy,sd,sd,0,0,sz,sz);
  return c;
}
function _genFromImage(img,sz){
  // 3パターンのクロップで MediaPipe を試行。全部ダメなら口パク無し（glowのみ）
  // 横長画像の場合は top-* クロップも試行（顔が画面上半分にある写真対応）
  var isLandscape=img.naturalWidth>img.naturalHeight*1.2;
  var modes=isLandscape?['top-center','top-left','top-right','default','center','wide']:['default','center','top-center','wide'];
  function tryMode(i){
    if(i>=modes.length)return Promise.reject(new Error('全クロップで顔未検出'));
    var srcCanvas=_buildSrcCanvas(img,sz,modes[i]);
    return _genFramesMP(srcCanvas,sz).then(function(frames){
      return{frames:frames,method:'mediapipe:'+modes[i],srcCanvas:srcCanvas};
    }).catch(function(e){
      console.info('[LipSync] crop='+modes[i]+' 失敗: '+(e.message||e));
      return tryMode(i+1);
    });
  }
  return tryMode(0).catch(function(e){
    console.warn('[LipSync] MediaPipe検出不可→口パクなし:',e.message||e);
    return null; // 呼び出し側で callback(null) → glow のみ
  });
}
function _generateLipGif(cid,callback){
  var ch=state.characters.find(function(c){return c.id===cid;});
  if(!ch)return callback(null);
  var rc=(!state.isAuthorMode)&&state.readerCustom&&state.readerCustom[cid];
  var iconImg=rc&&rc.iconImage?rc.iconImage:ch.iconImage;
  if(!iconImg)return callback(null);
  var displaySz=state.displaySettings.iconSize||56;
  // GIFは表示サイズの3倍 (上限256) で生成して、CSSでダウンスケール → 高解像度ディスプレイでも鮮明
  var sz=Math.min(256,Math.max(displaySz*3,168));
  var cacheKey='v7mp|'+sz+'|'+iconImg;
  var _iconDebug=iconImg.length>80?iconImg.substring(0,60)+'...(len='+iconImg.length+')':iconImg;
  console.info('[LipSync] '+cid+' icon=',_iconDebug);
  // 事前生成GIF優先: iconImg が /gallery/.../X.png 形式なら 対応する /lipsync/.../X.gif を探す。
  // 見つかればそれを採用、無ければ next() で MediaPipe 生成にフォールバック。
  function tryPreGen(next){
    var m=/(?:^https?:\/\/[^\/]+)?\/?gallery\/(.+)\.png$/i.exec(iconImg||"");
    if(!m){console.info("[LipSync] アイコンが/gallery/...png形式でないため事前生成GIF探索をスキップ→MediaPipe。icon:",iconImg);return next();}
    var gifUrl="/lipsync/"+m[1]+".gif";
    var probe=new Image(),done=false;
    probe.onload=function(){
      if(done)return;done=true;
      console.info("[LipSync] 事前生成GIF採用:",gifUrl);
      _lipGifCache[cid]={gif:gifUrl,orig:iconImg,sz:displaySz};
      callback(gifUrl);
    };
    probe.onerror=function(){
      if(done)return;done=true;
      console.info("[LipSync] 事前生成GIF 404→MediaPipe生成。探したURL:",gifUrl,"／元アイコン:",iconImg);
      next();
    };
    probe.src=gifUrl;
  }
  tryPreGen(function(){
  // 1) IndexedDB キャッシュ確認
  _lipDBGet(cacheKey).then(function(cachedBlob){
    if(cachedBlob){
      var url=URL.createObjectURL(cachedBlob);
      _lipGifCache[cid]={gif:url,orig:iconImg,sz:displaySz};
      return callback(url);
    }
    // 2) 画像ロード→フレーム生成（CORSエラー時はcrossOrigin無しで再試行）
    function loadImg(useCORS){
      return new Promise(function(res,rej){
        var img=new Image();
        if(useCORS)img.crossOrigin='anonymous';
        img.onload=function(){res(img);};
        img.onerror=function(){rej(new Error('img load err'+(useCORS?' (CORS)':'')));};
        img.src=iconImg;
      });
    }
    var isDataUrl=/^data:/i.test(iconImg);
    (isDataUrl?loadImg(false):loadImg(true).catch(function(){console.info('[LipSync] CORS再試行→crossOrigin無し');return loadImg(false);}))
      .then(function(img){
        console.info('[LipSync] 画像ロード完了 '+img.naturalWidth+'x'+img.naturalHeight);
        return _genFromImage(img,sz);
      })
      .then(function(r){
        if(!r||!r.frames||!r.frames.length){console.warn('[LipSync] フレーム生成失敗（口パクなし）');return callback(null);}
        console.info('[LipSync] 生成成功 method='+r.method+' frames='+r.frames.length);
        var gifBytes=_gifEncode(r.frames,sz,sz,3); // 30ms/frame (~33fps) → 標準の約1.5倍速
        var blob=new Blob([gifBytes],{type:'image/gif'});
        var url=URL.createObjectURL(blob);
        _lipGifCache[cid]={gif:url,orig:iconImg,sz:displaySz};
        _lipDBPut(cacheKey,blob);
        callback(url);
      })
      .catch(function(e){console.warn('[LipSync] 生成エラー:',e.message||e);callback(null);});
  });
  });
}

function _lipWrapsForCurrent(cid){
  // 発話中のアイテム(data-cid=itemId)内の .char-icon-wrap[data-charid=cid] のみを対象にする。
  // item要素が見つからない場合のみ従来動作(全マッチ)にフォールバック。
  var itemId=state.tts&&state.tts.currentItemId;
  if(itemId){
    var scope=document.querySelector('[data-cid="'+itemId+'"]');
    if(scope){
      var wr=scope.querySelectorAll('.char-icon-wrap[data-charid="'+cid+'"]');
      if(wr.length)return wr;
      // item内にキャラアイコンが無い場合（レイアウト違い）→ 同itemの最初のcharアイコン
      var any=scope.querySelector('.char-icon-wrap');
      if(any)return[any];
    }
  }
  return document.querySelectorAll('.char-icon-wrap[data-charid="'+cid+'"]');
}
function _applyLipGif(cid,gifUrl){
  _lipWrapsForCurrent(cid).forEach(function(wrap){
    wrap.classList.add('tts-speaking');
    wrap.classList.remove('tts-talk');
    var imgEl=wrap.querySelector('.char-icon img');
    if(imgEl){
      if(!imgEl.dataset.lipOrig)imgEl.dataset.lipOrig=imgEl.src;
      imgEl.src=gifUrl;
    }
  });
}
// GIF未生成時、元画像のまま発光だけ適用（見苦しい口パクフォールバック抑制）
function _applyLipGlow(cid){
  _lipWrapsForCurrent(cid).forEach(function(wrap){wrap.classList.add('tts-speaking');wrap.classList.add('tts-talk');});
}

function _restoreLipImg(cid){
  document.querySelectorAll('.char-icon-wrap[data-charid="'+cid+'"]').forEach(function(wrap){
    wrap.classList.remove('tts-speaking');
    wrap.classList.remove('tts-talk');
    var imgEl=wrap.querySelector('.char-icon img');
    if(imgEl&&imgEl.dataset.lipOrig){
      imgEl.src=imgEl.dataset.lipOrig;
      delete imgEl.dataset.lipOrig;
    }
  });
}

function _clearAllLipSync(){
  Object.keys(_lipSyncAnims).forEach(function(cid){
    var aid=_lipSyncAnims[cid];
    if(aid>1)cancelAnimationFrame(aid);
    _restoreLipImg(cid);
  });
  _lipSyncAnims={};
  document.querySelectorAll('.lipsync-ov').forEach(function(c){c.remove();});
}

// 画像なしキャラ用フォールバック（テキストアイコン口パク）
function _startLipSyncFallback(cid,wraps,iconClr,sn){
  wraps.forEach(function(wrap){
    var iconEl=wrap.querySelector('.char-icon');
    var sz=iconEl?Math.round(iconEl.getBoundingClientRect().width||iconEl.offsetWidth):0;
    if(sz<8)sz=state.displaySettings.iconSize||56;
    var canvas=document.createElement('canvas');
    canvas.className='lipsync-ov';
    canvas.setAttribute('data-lcid',cid);
    canvas.width=sz;canvas.height=sz;
    canvas.style.cssText='position:absolute;top:0;left:0;width:'+sz+'px;height:'+sz+'px;border-radius:50%;pointer-events:none;z-index:4;';
    wrap.appendChild(canvas);
    var ctx=canvas.getContext('2d');
    var frame=0,mOpen=0,tOpen=0,mFrac=0.70;
    function drawFrame(){
      frame++;
      if(frame%9===0)tOpen=Math.random()>0.28?Math.random()*0.72+0.28:0.04;
      mOpen+=(tOpen-mOpen)*0.38;
      ctx.save();ctx.clearRect(0,0,sz,sz);
      ctx.beginPath();ctx.arc(sz/2,sz/2,sz/2,0,Math.PI*2);ctx.clip();
      ctx.fillStyle=iconClr;ctx.fillRect(0,0,sz,sz);
      ctx.fillStyle='rgba(255,255,255,0.92)';
      ctx.font='bold '+Math.round(sz/3)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(sn,sz/2,sz*0.43);
      ctx.restore();
      ctx.save();
      ctx.beginPath();ctx.arc(sz/2,sz/2,sz/2,0,Math.PI*2);ctx.clip();
      var cmy=sz*mFrac,cmx=sz*0.50,cmw=sz*0.32,cmh=Math.max(0.8,sz*0.10*mOpen);
      if(mOpen>0.04){
        ctx.beginPath();ctx.ellipse(cmx,cmy,cmw/2,cmh/2+sz*0.003,0,0,Math.PI*2);
        ctx.fillStyle='rgb(18,5,3)';ctx.fill();
        if(mOpen>0.35){
          ctx.beginPath();ctx.ellipse(cmx,cmy-cmh*0.12,cmw*0.37,cmh*0.33,0,Math.PI,0);
          ctx.fillStyle='rgba(248,240,234,0.90)';ctx.fill();
        }
      }else{
        ctx.beginPath();ctx.moveTo(cmx-cmw/2,cmy);ctx.quadraticCurveTo(cmx,cmy+sz*0.013,cmx+cmw/2,cmy);
        ctx.strokeStyle='rgba(50,15,10,0.40)';ctx.lineWidth=Math.max(1,sz*0.016);ctx.stroke();
      }
      ctx.restore();
      _lipSyncAnims[cid]=requestAnimationFrame(drawFrame);
    }
    drawFrame();
  });
}

function _startLipSyncChar(cid){
  if(_lipSyncAnims[cid]!=null){
    var old=_lipSyncAnims[cid];
    if(old>1)cancelAnimationFrame(old);
    delete _lipSyncAnims[cid];
  }
  document.querySelectorAll('.lipsync-ov[data-lcid="'+cid+'"]').forEach(function(c){c.remove();});
  var ch=state.characters.find(function(c){return c.id===cid;});
  if(!ch)return;
  var rc=(!state.isAuthorMode)&&state.readerCustom&&state.readerCustom[cid];
  var iconImg=rc&&rc.iconImage?rc.iconImage:ch.iconImage;
  var iconClr=rc&&rc.iconColor?rc.iconColor:(ch.iconColor||'#6366F1');
  var sn=(_cname(ch)||'?').substring(0,2);
  // 発話中のアイテム配下のアイコンのみ対象
  var wraps=_lipWrapsForCurrent(cid);
  console.info('[LipSync] start cid='+cid+' wraps='+wraps.length+' iconImg='+(iconImg?'yes':'no')+' style='+state.displaySettings.narratorStyle);
  if(!wraps.length){
    // ナレータでアイコン無しの場合、本文itemにパルスを付与
    if(cid==='narrator'){
      var itemId=state.tts&&state.tts.currentItemId;
      var sc=itemId?document.querySelector('[data-cid="'+itemId+'"]'):null;
      if(sc){sc.classList.add('tts-narr-active');_lipSyncAnims[cid]=-3;console.info('[LipSync] narrator: bubbleパルス');}
    }
    return;
  }

  if(iconImg){
    var cached=_lipGifCache[cid];
    var sz=state.displaySettings.iconSize||56;
    if(cached&&cached.orig===iconImg&&cached.sz===sz){
      _applyLipGif(cid,cached.gif);
      _lipSyncAnims[cid]=-1;
    }else{
      // 生成中は元画像＋発光のみ（見苦しい口パクを出さない）
      _applyLipGlow(cid);
      _lipSyncAnims[cid]=-2;
      _generateLipGif(cid,function(gifUrl){
        if(!state.tts||!state.tts.active||state.tts.currentCharId!==cid)return;
        if(gifUrl){
          _applyLipGif(cid,gifUrl);
          _lipSyncAnims[cid]=-1;
        }else{
          // 生成失敗時も発光のみ（元画像を維持）
          _applyLipGlow(cid);
          _lipSyncAnims[cid]=-1;
        }
      });
    }
    return;
  }
  // 画像なし→テキストアイコンアニメ（scope: 現在発話中itemのみ）
  _startLipSyncFallback(cid,wraps,iconClr,sn);
}

function _stopLipSyncChar(cid){
  var aid=_lipSyncAnims[cid];
  if(aid>1)cancelAnimationFrame(aid);
  delete _lipSyncAnims[cid];
  document.querySelectorAll('.lipsync-ov[data-lcid="'+cid+'"]').forEach(function(c){c.remove();});
  document.querySelectorAll('.citem.tts-narr-active').forEach(function(el){el.classList.remove('tts-narr-active');});
  _restoreLipImg(cid);
}

function _updateLipSync(){
  var newCid=state.tts&&state.tts.active?state.tts.currentCharId:null;
  Object.keys(_lipSyncAnims).forEach(function(cid){if(cid!==newCid)_stopLipSyncChar(cid);});
  if(newCid&&_lipSyncAnims[newCid]==null)_startLipSyncChar(newCid);
  // ナレーター/アイコン無し時の本文パルス
  document.querySelectorAll('.citem.tts-narr-active').forEach(function(el){el.classList.remove('tts-narr-active');});
  var itemId=state.tts&&state.tts.currentItemId;
  if(itemId&&newCid){
    var scope=document.querySelector('[data-cid="'+itemId+'"]');
    if(scope){
      var hasIconWrap=scope.querySelector('.char-icon-wrap[data-charid="'+newCid+'"]');
      if(!hasIconWrap)scope.classList.add('tts-narr-active');
    }
  }
}

// --- TTS軽量UIアップデート（render不要） ---
function _updateTTSDisplay(){
  // ハイライト更新
  document.querySelectorAll('.tts-highlight').forEach(function(el){el.classList.remove('tts-highlight');});
  if(state.tts.currentItemId){
    var te=document.querySelector('[data-cid="'+state.tts.currentItemId+'"]');
    if(te){te.classList.add('tts-highlight');te.scrollIntoView({behavior:'smooth',block:'center'});}
  }
  // ステータステキスト更新
  var statusEl=document.getElementById('tts-status');
  if(statusEl&&state.tts.currentItemId){
    var it=getPC().find(function(i){return i.id===state.tts.currentItemId;});
    statusEl.textContent=it?(state.lang==='en'?'Now reading: ':'読上中: ')+(it.text||'').substring(0,30)+'…':'';
  }
  // リップシンク更新
  _updateLipSync();
}

// --- クラウドTTS (StreamElements Polly Neural / Google Translate) ---
// 文字を 180 文字ごとに区切る（日本語句読点優先）
function _ttsChunk(text,maxLen){
  maxLen=maxLen||180;
  if(!text)return[];
  if(text.length<=maxLen)return[text];
  var out=[],buf='';
  var parts=text.split(/(?<=[。！？!?\n])/);
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if((buf+p).length>maxLen){
      if(buf)out.push(buf);
      if(p.length>maxLen){for(var j=0;j<p.length;j+=maxLen)out.push(p.substr(j,maxLen));buf='';}
      else buf=p;
    }else buf+=p;
  }
  if(buf)out.push(buf);
  return out;
}
// キャラ性別からStreamElements Amazon Polly日本語ボイスを選択（Neural音声）
function _cloudVoice(ch){
  var g=ch?(ch.gender||'male'):'neutral';

  // StreamElements は Polly Neural もサポート: Takumi-Neural, Kazuha-Neural, Tomoko-Neural
  if(g==='male')return 'Takumi';
  return 'Mizuki';
}
function _cloudTTSUrls(text,voice){
  var enc=encodeURIComponent(text);
  return[
    'https://api.streamelements.com/kappa/v2/speech?voice='+voice+'&text='+enc,
    'https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&q='+enc+'&client=tw-ob'

var _cloudAudioCtrl=null; // {stop,pause,resume,setRate}
function _speakCloud(text,ch,rate,session,onEnd,onError,onStart){
  // 後方互換: sessionがfunction(旧onEnd)なら引数シフト
  if(typeof session==='function'){onError=onEnd;onEnd=session;session=null;}
  var chunks=_ttsChunk(text,180);
  if(!chunks.length){onEnd();return null;}
  var voice=_cloudVoice(ch);
  var idx=0,audio=null,stopped=false,started=false;
  function isStale(){return session!=null&&session!==_speakSessionId;}
  function playIdx(i,urlIdx){
    if(stopped||isStale())return;
    if(i>=chunks.length){onEnd();return;}
    var urls=_cloudTTSUrls(chunks[i],voice);
    if(urlIdx>=urls.length){
      // 最初のチャンクで完全失敗 → Web Speech API へフォールバック
      if(i===0&&!started){onError&&onError(new Error('全TTSエンドポイント失敗'));return;}
      // 2チャンク目以降はスキップして続行
      console.warn('[TTS] chunk',i,'スキップ');playIdx(i+1,0);return;
    }
    try{if(audio){audio.onended=null;audio.onerror=null;audio.pause();audio.src='';}}catch(e){}
    audio=new Audio();
    var done=false;
    var timer=setTimeout(function(){
      if(done||stopped)return;done=true;
      console.info('[TTS] タイムアウト(3s)→次のエンドポイント');
      playIdx(i,urlIdx+1);
    },3000);
    audio.oncanplay=function(){if(done||stopped)return;};
    audio.onplaying=function(){if(done||stopped)return;done=true;clearTimeout(timer);if(!started){started=true;if(onStart)try{onStart();}catch(e){}}};
    audio.onended=function(){if(stopped)return;done=true;clearTimeout(timer);playIdx(i+1,0);};
    audio.onerror=function(e){
      if(done||stopped)return;done=true;clearTimeout(timer);
      console.info('[TTS] エラー→次のエンドポイント',urlIdx+1);
      playIdx(i,urlIdx+1);
    };
    audio.playbackRate=Math.max(0.5,Math.min(4,rate||1.4));
    audio.src=urls[urlIdx];
    var p;try{p=audio.play();}catch(e){done=true;clearTimeout(timer);playIdx(i,urlIdx+1);return;}
    if(p&&p.catch)p.catch(function(err){
      if(done||stopped)return;done=true;clearTimeout(timer);
      console.info('[TTS] play失敗→次のエンドポイント:',err.message||err);
      playIdx(i,urlIdx+1);
    });
  }
  playIdx(0,0);
  return{
    stop:function(){stopped=true;if(audio){try{audio.onended=null;audio.onerror=null;audio.pause();audio.src='';}catch(e){}}},
    pause:function(){if(audio)try{audio.pause();}catch(e){}},
    resume:function(){if(audio)try{audio.play();}catch(e){}},
    setRate:function(r){rate=r;if(audio)audio.playbackRate=Math.max(0.5,Math.min(4,r));}
  };
}

    warm.onend=function(){if(settled)return;settled=true;done();};

// エラー本文まで読む fetch。VOICEVOX は {"detail":...} で理由を返すので握り潰さない。
function _vvFetch(url,opts,timeoutMs){
  var ms=timeoutMs||60000,timedOut=false;
  var ac=new AbortController();
  var to=setTimeout(function(){timedOut=true;try{ac.abort();}catch(e){}},ms);
  opts=opts||{};opts.signal=ac.signal;
  return fetch(url,opts).then(function(r){
    clearTimeout(to);
    if(r.ok)return r;
    return r.text().then(function(t){
      var d=t;try{var j=JSON.parse(t);d=j.detail?JSON.stringify(j.detail):t;}catch(e){}
      throw new Error('HTTP '+r.status+' '+String(d).slice(0,300));
    });
  },function(e){
    clearTimeout(to);
    // AbortError のままだと「signal is aborted without reason」としか出ず原因が分からない
    if(timedOut)throw new Error('timeout '+Math.round(ms/1000)+'s');

// 合成にかかる時間は文字数にほぼ比例する。CPU合成だと1文字あたり0.3秒程度かかる
// こともあるので、長さに応じて待ち時間を伸ばす(下限30秒・上限5分)。
function _vvTimeoutFor(text){

// 長文は文単位に切る。VOICEVOX は極端に長いテキストで落ちることがある(猫は最長9,521字)。
function _vvSplit(text,maxLen){

  if(s.length<=maxLen)return [s];
  var out=[],buf='';
  var parts=s.split(/(?<=[\u3002\uFF01\uFF1F\n])/);
  parts.forEach(function(p){
    while(p.length>maxLen){
      var cut=p.lastIndexOf('\u3001',maxLen);if(cut<maxLen*0.4)cut=maxLen;
      if(buf){out.push(buf);buf='';}
      out.push(p.slice(0,cut));p=p.slice(cut);
    }
    if((buf+p).length>maxLen){out.push(buf);buf=p;}else{buf+=p;}
  });

  return out.filter(function(x){return x.replace(/\s/g,'').length;});

// 複数のWAVを1つに繋ぐ(fmtが同じ前提。dataチャンクだけ連結してヘッダを作り直す)
function _wavConcat(bufs){
  if(bufs.length===1)return bufs[0];
  var fmt=null,datas=[],total=0;
  for(var i=0;i<bufs.length;i++){
    var dv=new DataView(bufs[i]),pos=12;
    while(pos+8<=dv.byteLength){
      var id=String.fromCharCode(dv.getUint8(pos),dv.getUint8(pos+1),dv.getUint8(pos+2),dv.getUint8(pos+3));
      var sz=dv.getUint32(pos+4,true);
      if(id==='fmt ' && !fmt)fmt=new Uint8Array(bufs[i].slice(pos+8,pos+8+sz));
      if(id==='data'){var d=new Uint8Array(bufs[i].slice(pos+8,pos+8+sz));datas.push(d);total+=d.length;}
      pos+=8+sz+(sz%2);
    }
  }
  if(!fmt||!datas.length)return bufs[0];
  var out=new Uint8Array(12+8+fmt.length+8+total),v=new DataView(out.buffer),o=0;
  function str(s){for(var i=0;i<s.length;i++)out[o++]=s.charCodeAt(i);}
  str('RIFF');v.setUint32(o,out.length-8,true);o+=4;str('WAVE');
  str('fmt ');v.setUint32(o,fmt.length,true);o+=4;out.set(fmt,o);o+=fmt.length;
  str('data');v.setUint32(o,total,true);o+=4;
  datas.forEach(function(d){out.set(d,o);o+=d.length;});
  return out.buffer;
}
// 1ブロックを合成する。長ければ分割して繋ぐ。
async function _vvSynth(text,speaker,engineUrl,sampleRate){
  engineUrl=engineUrl||'http://localhost:50021';
  var chunks=_vvSplit(text,120),bufs=[];
  for(var i=0;i<chunks.length;i++){
    var tmo=_vvTimeoutFor(chunks[i]),buf=null,lastErr=null;
    // タイムアウトは一時的な混み合いのこともあるので、1チャンクにつき1回だけ待ち直す
    for(var attempt=0;attempt<2&&buf===null;attempt++){
      try{
        var qr=await _vvFetch(engineUrl+'/audio_query?speaker='+speaker+'&text='+encodeURIComponent(chunks[i]),{method:'POST'},tmo);
        var q=await qr.json();
        q.speedScale=1.0;q.outputStereo=false;
        if(sampleRate)q.outputSamplingRate=sampleRate;
        var sr=await _vvFetch(engineUrl+'/synthesis?speaker='+speaker,
          {method:'POST',headers:{'Content-Type':'application/json','Accept':'audio/wav'},body:JSON.stringify(q)},tmo*2);
        buf=await sr.arrayBuffer();
      }catch(e){
        lastErr=e;
        if(attempt===0&&/timeout/.test((e&&e.message)||'')){
          console.warn('[VOICEVOX] '+chunks[i].length+'字のチャンクがタイムアウト。待ち時間を伸ばして再試行します');
          tmo=Math.min(300000,tmo*2);
        }else break;
      }
    }
    if(buf===null)throw new Error('chunk '+(i+1)+'/'+chunks.length+' ('+chunks[i].length+'字) '+((lastErr&&lastErr.message)||'失敗'));
    bufs.push(buf);buf=null;
  }
  var out=new Blob([_wavConcat(bufs)],{type:'audio/wav'});
  bufs.length=0;
  return out;
}

function _idbPut(workId,itemId,blob,meta){
  return _idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(_IDB_STORE,'readwrite'),st=tx.objectStore(_IDB_STORE);
      var _lang=(meta&&meta.lang)||'ja';
      var rec={key:_idbKey(workId,itemId,_lang),workId:workId,itemId:itemId,blob:blob,meta:meta||{lang:_lang},updatedAt:Date.now()};
      if(!rec.meta.lang) rec.meta.lang=_lang;
      var r=st.put(rec);r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};
    });
  });
}
function _idbGet(workId,itemId,lang){
  return _idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(_IDB_STORE,'readonly'),st=tx.objectStore(_IDB_STORE);
      var r=st.get(_idbKey(workId,itemId,lang||'ja'));
      r.onsuccess=function(){
        if(r.result){res(r.result);return;}
        // 旧形式 (lang無し) へのフォールバック (lang='ja'指定時のみ)
        if((lang||'ja')==='ja'){
          var r2=st.get(workId+'::'+itemId);
          r2.onsuccess=function(){res(r2.result||null);};
          r2.onerror=function(){res(null);};
        }else{ res(null); }
      };
      r.onerror=function(){rej(r.error);};
    });
  }).catch(function(){return null;});
}
// 音声をまとめてサーバへ送る。**全件を一度にメモリへ載せない**のが要点で、
// キーだけ先に列挙し、chunk 件ずつ読み出しては送って捨てる。
// copyTo を渡すとアップロードのついでにそのworkIdへ複製する(投稿時の my_→pub_)。
async function _audioUploadStreamed(srcWorkId,destWorkId,opts){
  opts=opts||{};
  var chunk=opts.chunk||25;
  var keys=await _idbKeysByWork(srcWorkId);
  var total=keys.length,sent=0,fail=0,bytes=0,skipped=0;
  if(!total)return {total:0,fail:0,bytes:0,skipped:0};
  // 既にサーバにあるものは送らない。1.5GB級のアップロードが途中で切れても、
  // もう一度実行すれば続きから再開できるようにするため。
  var already={};
  if(!opts.force){
    try{
      var mr=await fetch('/api/audio/'+encodeURIComponent(destWorkId),{cache:'no-store'});
      if(mr.ok){
        var mj=await mr.json();
        Object.keys((mj&&mj.items)||{}).forEach(function(id){already[id]=1;});
        if(Object.keys(already).length)console.info('[Upload] サーバに既に '+Object.keys(already).length+'件。その分は送りません');
      }
    }catch(e){}
  }
  for(var i=0;i<total;i+=chunk){
    var slice=keys.slice(i,i+chunk),fd=new FormData(),n=0;
    for(var j=0;j<slice.length;j++){
      var rec=null;
      if(already[slice[j].itemId]&&!(opts.copyTo&&opts.copyTo!==srcWorkId)){skipped++;sent++;continue;}
      try{rec=await _idbGet(srcWorkId,slice[j].itemId,slice[j].lang);}catch(e){}
      if(!rec||!rec.blob)continue;
      if(opts.copyTo&&opts.copyTo!==srcWorkId){
        try{await _idbPut(opts.copyTo,rec.itemId,rec.blob,rec.meta||{});}catch(e){}
      }
      if(already[slice[j].itemId]){skipped++;sent++;rec=null;continue;}
      fd.append(rec.itemId,rec.blob,rec.itemId+'.wav');
      bytes+=rec.blob.size;n++;rec=null;
    }
    if(n){
      // 回線の一時的な不調で1.5GBを丸ごとやり直すのは避けたいので、束ごとに3回まで試す
      var okChunk=false,lastMsg='';
      for(var at=0;at<3&&!okChunk;at++){
        try{
          var r=await fetch('/api/audio/'+encodeURIComponent(destWorkId),{method:'PUT',body:fd});
          if(r.ok){
            var jj=await r.json().catch(function(){return{};});
            fail+=((jj.errors&&jj.errors.length)||0);okChunk=true;
          }else{lastMsg='HTTP '+r.status;}
        }catch(e){lastMsg=(e&&e.message)||String(e);}
        if(!okChunk&&at<2){
          console.warn('[Upload] 送信に失敗('+lastMsg+')。'+(at+1)*5+'秒待って再試行します');
          await new Promise(function(res){setTimeout(res,(at+1)*5000);});
        }
      }
      if(!okChunk){fail+=n;console.warn('[Upload] '+n+'件の送信を諦めました: '+lastMsg);}
      sent+=n;
    }
    fd=null;
    if(opts.onProgress)opts.onProgress(sent,total);
    await new Promise(function(res){setTimeout(res,0);});   // 参照を手放してGCさせる
  }
  return {total:total,fail:fail,bytes:bytes,skipped:skipped};
}
function _idbListByWork(workId){
  return _idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(_IDB_STORE,'readonly'),st=tx.objectStore(_IDB_STORE);
      var idx=st.index('workId'),r=idx.getAll(workId);
      r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){rej(r.error);};
    });
  }).catch(function(){return [];});
}
function _idbDeleteByWork(workId){
  return _idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(_IDB_STORE,'readwrite'),st=tx.objectStore(_IDB_STORE);
      var idx=st.index('workId'),r=idx.openCursor(IDBKeyRange.only(workId));
      r.onsuccess=function(e){var c=e.target.result;if(c){c.delete();c.continue();}else res();};
      r.onerror=function(){rej(r.error);};
    });
  });
}
function _simpleHashJS(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);h|=0;}return (h>>>0).toString(36);}
function _b64ToBlob(b64,mime){
  var bin=atob(b64),len=bin.length,arr=new Uint8Array(len);
  for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime||'audio/wav'});
}
function _blobToB64(blob){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var s=r.result||'';var i=s.indexOf(',');res(i>=0?s.slice(i+1):s);};
    r.onerror=function(){rej(r.error);};
    r.readAsDataURL(blob);
  });
}

function _loadAudioManifest(){
  if(_audioManifest!==null)return Promise.resolve(_audioManifest);
  if(_audioManifestLoading)return _audioManifestLoading;
  var base=_audioBaseUrl();
  if(!base){_audioManifest=false;return Promise.resolve(false);}
  _audioManifestLoading=fetch(base+'manifest.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error('manifest '+r.status);return r.json();})
    .then(function(m){_audioManifest=m;console.info('[TTS] 事前生成音声マニフェスト読込:',Object.keys(m.items||{}).length+'件');return m;})
    .catch(function(e){console.info('[TTS] 事前生成音声なし(マニフェスト):',e.message);_audioManifest=false;return false;})
    .finally(function(){_audioManifestLoading=null;});
  return _audioManifestLoading;
}
// 統合ソースマップを構築: リポジトリ事前生成 + IndexedDB + content.audio (埋込み)
// 投稿作品(pub_*)を開いた場合、対応する my_* 側のIDBも探索 (作者が my_ で生成→投稿
// したパターンに対応)。逆方向(my_* を開いたとき pub_* を見に行く)は通常不要。
function _relatedWorkIds(wid){
  var ids=[wid];
  if(wid&&wid.indexOf('pub_')===0)ids.push('my_'+wid.slice(4));
  else if(wid&&wid.indexOf('my_')===0)ids.push('pub_'+wid.slice(3));
  return ids;
}
function _buildAudioSources(){
  _audioSources={};
  _audioSourcesJa={};
  _audioSourcesEn={};
  // 優先度: embedded(item.audio) > IDB > server(R2) > repo
  var wid=_currentWorkId();
  var relIds=_relatedWorkIds(wid);
  var repo=(_audioManifest&&_audioManifest.items)||{};
  Object.keys(repo).forEach(function(id){var src={type:'repo'};_audioSourcesJa[id]=src;_audioSources[id]=src;});
  // 投稿作品(pub_*)はサーバー(R2)のVOICEVOX音声マニフェストを取得 (JAのみ)
  var serverP=(wid&&wid.indexOf('pub_')===0)
    ?fetch('/api/audio/'+encodeURIComponent(wid)).then(function(r){return r.ok?r.json():{items:{}};}).catch(function(){return {items:{}};})
    :Promise.resolve({items:{}});
  return Promise.all([serverP].concat(relIds.map(function(w){return _idbKeysByWork(w).catch(function(){return [];});}))).then(function(results){
    var serverManifest=results[0]||{items:{}};
    var lists=results.slice(1);
    Object.keys(serverManifest.items||{}).forEach(function(id){
      if(!_audioSourcesJa[id]||_audioSourcesJa[id].type==='repo'){
        var src={type:'server',workId:wid,meta:serverManifest.items[id]||{}};
        _audioSourcesJa[id]=src;
        _audioSources[id]=src;
      }
    });
    lists.forEach(function(list,i){
      list.forEach(function(rec){
        var lang=(rec.meta&&rec.meta.lang) || ((rec.meta&&rec.meta.engine==='aura')?'en':'ja');  // 旧Auraデータは engine から推定
        var bucket = (lang==='en') ? _audioSourcesEn : _audioSourcesJa;
        // 既に自workIdのIDBが埋まっていれば上書きしない (先勝ち)
        if(bucket[rec.itemId]&&bucket[rec.itemId].type==='idb'&&bucket[rec.itemId].workId===wid){return;}
        var src={type:'idb',workId:rec.workId,blob:rec.blob,meta:rec.meta||{},fromWorkId:rec.workId};
        bucket[rec.itemId]=src;
        // 後方互換のため _audioSources にも書く (lang=ja優先)
        if(lang==='ja'||!_audioSources[rec.itemId])_audioSources[rec.itemId]=src;
      });
    });
    // embedded (state.content[*].audio) は最優先 — JA扱い (現状の仕様維持)
    (state.content||[]).forEach(function(it){
      if(it.audio){var src={type:'embedded'};_audioSourcesJa[it.id]=src;_audioSources[it.id]=src;}
    });
  });
}
function _hasPreAudio(itemId){
  // state.lang に応じて参照するソースを分岐
  var bucket = (state.lang==='en') ? (_audioSourcesEn||{}) : (_audioSourcesJa||_audioSources||{});
  return !!bucket[itemId];
}
function _getAudioSrc(itemId){
  var bucket = (state.lang==='en') ? (_audioSourcesEn||{}) : (_audioSourcesJa||_audioSources||{});
  return bucket[itemId]||null;
}
// 再生の直前に blob を取り出して URL にする。ソース表には blob を持たないので、
// 4,000件を超える作品でもメモリはほとんど使わない。
function _resolveAudioUrlAsync(itemId){
  var src=(typeof _getAudioSrc==='function')?_getAudioSrc(itemId):_audioSources[itemId];
  if(!src)return Promise.resolve(null);
  if(src.type==='idb'&&!src.blob){
    return _idbGet(src.workId||_currentWorkId(),src.itemId||itemId,src.lang||'ja').then(function(rec){
      if(!rec||!rec.blob)return null;
      var u=URL.createObjectURL(rec.blob);
      return {url:u,revoke:true};
    }).catch(function(){return null;});
  }
  return Promise.resolve(_resolveAudioUrl(itemId));
}
function _resolveAudioUrl(itemId){
  var src=(typeof _getAudioSrc==='function')?_getAudioSrc(itemId):_audioSources[itemId];
  if(!src)return null;
  if(src.type==='repo'){
    return {url:_audioBaseUrl()+encodeURIComponent(itemId)+'.wav',revoke:false};
  }
  if(src.type==='server'){
    return {url:'/api/audio/'+encodeURIComponent(src.workId)+'/'+encodeURIComponent(itemId),revoke:false};
  }
  if(src.type==='idb'&&src.blob){
    var u=URL.createObjectURL(src.blob);return {url:u,revoke:true};
  }
  if(src.type==='embedded'&&src.b64){
    var blob=_b64ToBlob(src.b64,'audio/wav');var u2=URL.createObjectURL(blob);return {url:u2,revoke:true};
  }
  return null;
}
function _speakItemAudio(item,ch,session,onStart,onEnd,onError){
  var src=(typeof _getAudioSrc==='function')?_getAudioSrc(item.id):_audioSources[item.id];
  if(!src){if(onError)onError(new Error('no audio source'));return null;}
  var url=null,needsRevoke=false;
  var spk=src&&src.meta&&src.meta.speaker;
  var fromW=src&&src.fromWorkId;
  console.info('[TTS] 再生開始 item='+item.id+' chId='+(ch&&ch.id)+' chName='+(ch&&ch.name)+' txt="'+(item.text||'').substring(0,20)+'…" type='+(src&&src.type)+(spk!=null?' speaker='+spk:'')+(fromW?' fromWorkId='+fromW:''));
  var audio=new Audio();
  audio.preload='auto';
  var rate=Math.max(0.5,Math.min(2.5,state.tts.rate||1.4));
  try{audio.playbackRate=rate;audio.defaultPlaybackRate=rate;}catch(e){}
  var settled=false,started=false;
  function isStale(){return session!==_speakSessionId;}
  function cleanup(){try{audio.pause();}catch(e){}audio.src='';if(needsRevoke){try{URL.revokeObjectURL(url);}catch(e){}}}
  audio.onplaying=function(){
    if(started||isStale())return;
    started=true;
    // 速度の設定は一部ブラウザで src 設定後に上書きされるため再適用
    try{audio.playbackRate=rate;}catch(e){}
    if(onStart)onStart();
  };
  audio.onended=function(){
    if(settled||isStale())return;settled=true;
    // 一度も onplaying が来ないまま終了 = 長さ0/空ファイル。これを完了扱いにすると
    // 無音のままブロックだけが進むので、失敗として扱いライブ合成へ回す。
    if(!started){
      var _dur=audio.duration;
      cleanup();
      console.warn('[TTS] 事前生成音声が無音のまま終了 item='+item.id+' duration='+_dur);
      if(onError){onError(new Error('audio ended without playing'));return;}
      if(onEnd)onEnd();return;
    }
    cleanup();if(onEnd)onEnd();
  };
  audio.onerror=function(){
    if(settled)return;settled=true;
    var code=(audio.error&&audio.error.code)||'?';
    cleanup();
    // 【絶対原則】再生が一度でも開始していればエラーでも完了扱い。
    // Web Speech フォールバックを走らせると全文が再発話され二重発話になる。
    if(started){
      console.info('[TTS] 事前生成音声エラー(再生開始後→完了扱い) item='+item.id,'code='+code);
      if(onEnd)onEnd();
    }else{
      console.warn('[TTS] 事前生成音声再生失敗(未開始) item='+item.id,'code='+code);
      if(onError)onError(new Error('audio error '+code));
    }
  };
  // URL の用意(IDBからの取り出しは非同期)が済んでから再生する
  _resolveAudioUrlAsync(item.id).then(function(resolved){
    if(settled)return;
    if(isStale()){settled=true;return;}
    if(!resolved){settled=true;if(onError)onError(new Error('no audio source'));return;}
    url=resolved.url;needsRevoke=resolved.revoke;
    audio.src=url;
    var playPromise=audio.play();
    if(playPromise&&playPromise.catch){
      playPromise.catch(function(e){
        if(settled)return;settled=true;
        console.warn('[TTS] audio.play() reject:',e&&e.message||e);
        cleanup();
        if(onError)onError(e);
      });
    }
  },function(e){
    if(settled)return;settled=true;
    if(onError)onError(e||new Error('audio resolve failed'));
  });
  return {
    stop:function(){if(settled)return;settled=true;cleanup();},
    pause:function(){try{audio.pause();}catch(e){}},
    resume:function(){try{audio.play();}catch(e){}},
  };
}

// VOICEVOX 接続診断: 正常 / CORS拒否 / オフライン を切り分ける
async function _voicevoxHealthCheck(engineUrl){
  // 1) 通常リクエスト (CORS が許可されている時のみ成功)
  try{
    var vr=await fetch(engineUrl+'/version');
    if(vr.ok){
      var ver=(await vr.text()).replace(/"/g,'').trim();
      return {ok:true,version:ver};
    }
    return {ok:false,reason:'http',status:vr.status};
  }catch(e){ /* CORS拒否 or 到達不可 — 下の no-cors プローブで切り分け */ }
  // 2) no-cors プローブ: サーバーが生きていれば成功 (応答内容は読めない)
  try{
    await fetch(engineUrl+'/version',{mode:'no-cors'});
    return {ok:false,reason:'cors'};   // 到達できた = 起動中 = CORS が原因
  }catch(e2){
    return {ok:false,reason:'offline'}; // 到達不可 = VOICEVOX 未起動
  }
}

async function generateVoicesLocal(opts){
  opts=opts||{};
  var engineUrl=opts.engineUrl||'http://localhost:50021';
  var wid=_currentWorkId();
  // ヘルスチェック (CORS / オフライン を判別して適切な案内を出す)
  var _hc=await _voicevoxHealthCheck(engineUrl);
  if(!_hc.ok){
    if(_hc.reason==='cors'){
      _showVoicevoxCorsHelp(engineUrl);
    }else if(_hc.reason==='http'){
      alert('VOICEVOX Engine がエラーを返しました ('+engineUrl+' / HTTP '+(_hc.status||'?')+')\n\nVOICEVOX を再起動してから再実行してください。');
    }else{
      alert('VOICEVOX Engine に接続できません ('+engineUrl+')\n\nVOICEVOX が起動していません。\nVOICEVOX を起動してから再実行してください。');
    }
    return {ok:false,reason:_hc.reason};
  }
  console.info('[VOICEVOX] connected:',_hc.version);
  // 既存の確認は「キーの一覧」だけにする(blobを読み込むとメモリが持たない)
  var existingKeys={};
  try{
    (await _idbKeysByWork(wid)).forEach(function(r){if(r.lang!=='en')existingKeys[r.itemId]=r.key;});
  }catch(e){
    alert('既存音声の一覧が取得できませんでした。全件を作り直してしまうため中止します。\n'+(e&&e.message));
    return {ok:false,reason:'list failed'};
  }
  var items=(state.content||[]).filter(function(c){return c.type!=='pageBreak'&&(c.text||'').trim();});
  var total=items.length,generated=0,cached=0,failed=0,reused=0;
  if(!total){alert('生成対象のセリフがありません');return {ok:true,total:0};}
  if(!opts.noConfirm && !confirm('VOICEVOX でこの作品の全セリフ('+total+'件)を音声生成します。\n数十秒〜数分かかります。続行しますか?'))return {ok:false,cancelled:true};
  var progressBox=opts.progressBox||_showProgress('🎤 音声生成中');
  try{
    for(var i=0;i<items.length;i++){
      var it=items[i];
      var ch=state.characters.find(function(c){return c.id===(it.characterId||'narrator');});
      // 注: voiceLang による分岐は廃止。全アイテム VOICEVOX 生成（state.lang='ja'時の再生で使用）
      var speaker=_voicevoxSpeakerFor(ch);
      var hash=_simpleHashJS((it.text||'')+'|sp='+speaker);
      // 同じキーに同じハッシュで入っていれば作り直さない
      var prevRec=existingKeys[it.id]?await _idbGet(wid,it.id,'ja'):null;
      if(prevRec&&prevRec.meta&&prevRec.meta.hash===hash){cached++;_updateProgress(progressBox,i+1,total,'cached '+it.id);continue;}
      // ブロックidが変わっていても、同じ本文+話者の音声が別のidや別作品にあれば使い回す。
      // (取り込み直しで id が総入れ替えになっても作り直さずに済む)
      var donor=await _idbFindByHash(hash);
      if(donor&&donor.blob){
        try{
          await _idbPut(wid,it.id,donor.blob,{lang:'ja',engine:'voicevox',speaker:speaker,hash:hash,
            chars:(it.text||'').length,bytes:donor.blob.size,reusedFrom:donor.key});
          reused++;_updateProgress(progressBox,i+1,total,'reused '+it.id);continue;
        }catch(e){console.warn('[VOICEVOX] 使い回しに失敗:',e&&e.message);}
      }
      _updateProgress(progressBox,i+1,total,it.id);
      // その話者が既に使えないと分かっていれば、最初から代替話者で合成する
      var useSp=speaker;
      if(_badSpeakers[useSp]){
        var alt0=_vvAltSpeaker(useSp,ch&&ch.gender);
        if(alt0!=null)useSp=alt0;
      }
      try{
        var blob=await _vvSynth(it.text,useSp,engineUrl,opts.sampleRate);
        await _idbPut(wid,it.id,blob,{lang:'ja',engine:'voicevox',speaker:useSp,hash:hash,chars:(it.text||'').length,bytes:blob.size});
        blob=null;generated++;
      }catch(e){
        var msg=(e&&e.message)||String(e);
        // 話者そのものが使えない場合(モデル未導入など)は、その話者を記録して代替でやり直す
        var alt=null;
        if(/HTTP 5\d\d/.test(msg)&&!_badSpeakers[useSp]){
          _badSpeakers[useSp]=msg;
          console.warn('[VOICEVOX] 話者 '+useSp+' が使えません → 代替に切り替えます: '+msg.slice(0,160));
          alt=_vvAltSpeaker(useSp,ch&&ch.gender);
        }
        if(alt!=null){
          try{
            var b2=await _vvSynth(it.text,alt,engineUrl,opts.sampleRate);
            await _idbPut(wid,it.id,b2,{lang:'ja',engine:'voicevox',speaker:alt,hash:_simpleHashJS((it.text||'')+'|sp='+alt),chars:(it.text||'').length,bytes:b2.size});
            b2=null;generated++;continue;
          }catch(e2){msg=(e2&&e2.message)||String(e2);}
        }
        console.warn('[VOICEVOX] 失敗 item='+it.id+' ('+(it.text||'').length+'字, speaker='+useSp+') '+msg);
        failed++;
      }
      if((i+1)%25===0)await new Promise(function(r){setTimeout(r,0);});   // 息継ぎ
    }
  }finally{if(!opts.progressBox)_hideProgress(progressBox);}
  // 再生時に使えるようソースマップを再構築
  _audioManifest=_audioManifest||false; // 既存維持
  if(!opts.noRebuild)await _buildAudioSources();
  if(!opts.noAlert)alert('音声生成完了\n新規='+generated+' / 使い回し='+reused+' / キャッシュ='+cached+' / 失敗='+failed+' (合計'+total+')');
  return {ok:true,generated:generated,reused:reused,cached:cached,failed:failed,total:total};
}
// ===== 英語クラウド事前生成 (Deepgram Aura via /api/tts) — VOICEVOXと同じIDBへ保存 =====
async function generateVoicesAura(opts){
  opts=opts||{};
  var wid=_currentWorkId();
  var items=(state.content||[]).filter(function(c){return c.type!=='pageBreak'&&(c.text||'').trim();});
  // 全アイテムを対象（voiceLangで絞り込まない）
  var enItems=items;
  var total=enItems.length;
  if(!total){if(!opts.silent)alert('生成対象のセリフがありません');return {ok:true,total:0,generated:0,cached:0,failed:0};}
  // 英訳を先に取得（state.workTransが無ければ /api/translate で取得）
  var trMap={};
  if(state.workTrans&&state.workTransHash===state._curHash){
    Object.assign(trMap,state.workTrans);
  }else{
    try{
      var _trRes=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:'en',source:'ja',items:items.map(function(it){return {id:it.id,text:it.text};}),characters:(state.characters||[]).filter(function(c){return c.id!=='narrator'&&c.name;}).map(function(c){return {id:c.id,name:c.name};})})});
      if(_trRes.ok){var _trJson=await _trRes.json();(_trJson.items||[]).forEach(function(x){trMap[x.id]=x.text;});}
    }catch(e){console.warn('[Aura] 英訳取得失敗:',e);}
  }
  if(!opts.noConfirm){
    if(!confirm('クラウド(Aura)でこの作品の英訳セリフ('+total+'件)を音声生成します。\nこのブラウザに保存されます。続行しますか?'))return {ok:false,cancelled:true};
  }
  var generated=0,cached=0,failed=0;
  var progressBox=opts.progressBox||_showProgress('\u2601\uFE0F 英語音声生成中 (Aura)');
  try{
    for(var i=0;i<enItems.length;i++){
      var it=enItems[i];
      var ch=state.characters.find(function(c){return c.id===(it.characterId||'narrator');});
      var voice=_auraVoiceFor(ch);
      var srcText=trMap[it.id]||it.text||'';
      if(/[\u3040-\u30ff\u3400-\u9fff]/.test(srcText)){
        console.warn('[Aura] 英訳未取得 → スキップ item='+it.id);failed++;_updateProgress(progressBox,i+1,total,'skip(no-trans) '+it.id);continue;
      }
      var hash=_simpleHashJS(srcText+'|aura1='+voice);
      var prev=await _idbGet(wid,it.id,'en');
      if(prev&&prev.meta&&prev.meta.hash===hash){cached++;_updateProgress(progressBox,i+1,total,'cached '+it.id);continue;}
      _updateProgress(progressBox,i+1,total,it.id);
      try{
        var res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:srcText,voice:voice,model:'aura-1'})});
        if(!res.ok)throw new Error('tts http '+res.status);
        var blob=await res.blob();
        if(!blob||blob.size<200)throw new Error('empty audio '+(blob&&blob.size));
        await _idbPut(wid,it.id,blob,{lang:'en',engine:'aura',voice:voice,hash:hash,chars:srcText.length,bytes:blob.size});
        generated++;
      }catch(e){
        console.warn('[Aura] 失敗 item='+it.id,e&&e.message||e);failed++;
      }
    }
  }finally{if(!opts.progressBox)_hideProgress(progressBox);}
  if(!opts.noRebuild)await _buildAudioSources();
  if(!opts.noAlert)alert('英語音声生成完了\n新規='+generated+' / キャッシュ='+cached+' / 失敗='+failed+' (合計'+total+')');
  return {ok:true,generated:generated,cached:cached,failed:failed,total:total};
}

function _updateProgress(el,cur,total,label){
  if(!el)return;
  var pct=Math.round(cur/total*100);
  var fill=el.querySelector('.pg-fill'),text=el.querySelector('.pg-text');
  if(fill)fill.style.width=pct+'%';
  if(text)text.textContent=cur+' / '+total+(label?' ('+label+')':'');
}

function _speakItem(item,onEnd){
  var mySession=++_speakSessionId;
  _stopAllSpeech();
  var ch=state.characters.find(function(c){return c.id===(item.characterId||'narrator')});
  state.tts.currentItemId=item.id;
  // 前アイテムの口パクを即座に停止 (音声が始まるまで無音・無口パクが正しい状態)
  state.tts.currentCharId=null;
  // 口パクアイコンは音声が実際に始まった瞬間に切り替える (ズレ防止)
  var targetCharId=item.type==='dialogue'?(item.characterId||null):'narrator';
  function applyCharId(){
    if(mySession!==_speakSessionId)return;
    state.tts.currentCharId=targetCharId;
    _updateTTSDisplay();
  }
  _updateTTSDisplay(); // UIテキスト(currentItemId)は即更新、lipsyncはonstartで更新
  function safeEnd(){if(mySession!==_speakSessionId)return;if(onEnd)onEnd();}
  // 英語モード: クラウドAura(高音質)で再生。失敗時のみ英語Web Speechへ。
  if(state.lang==='en'){
    var _liveAura=function(){
      _auraCtrl=_speakItemAura(item,ch,mySession,applyCharId,
        function(){if(mySession!==_speakSessionId)return;_auraCtrl=null;safeEnd();},
        function(err){if(mySession!==_speakSessionId)return;_auraCtrl=null;console.warn('[TTS] Aura失敗→英語Web Speech:',err&&err.message||err);try{speechSynthesis.cancel();}catch(e){}_speakItemWebAPI(item,ch,mySession,applyCharId,safeEnd);});
    };
    // 事前生成(IDB/サーバー)があれば優先再生、無い/失敗時はライブAuraへ
    if(_hasPreAudio(item.id)){
      _preAudioCtrl=_speakItemAudio(item,ch,mySession,applyCharId,
        function(){if(mySession!==_speakSessionId)return;_preAudioCtrl=null;safeEnd();},
        function(err){if(mySession!==_speakSessionId)return;console.warn('[TTS] 英語事前生成音声失敗→ライブAura:',err&&err.message||err);_preAudioCtrl=null;_liveAura();});
      return;
    }
    _liveAura();
    return;
  }
  // 音声オーバーライドが設定されている場合は事前生成音声を使わず Web Speech 側で再生
  // (事前生成はビルド時の話者で固定されているため、ユーザの音声変更が反映されない)
  // オーバーライド元は2系統: ① 作者編集の character.ttsVoice ② 読者カスタムの readerCustom[id].ttsVoice
  var _voiceOverride=null,_voiceOverrideSrc=null;
  try{
    var _rcEntry=ch&&state.readerCustom&&state.readerCustom[ch.id];
    if(_rcEntry&&_rcEntry.ttsVoice){_voiceOverride=_rcEntry.ttsVoice;_voiceOverrideSrc='readerCustom';}
  }catch(e){}
  if(_voiceOverride && _hasPreAudio(item.id)){console.info('[TTS] 事前生成音声をスキップ (音声オーバーライド: '+_voiceOverrideSrc+') item='+item.id+' ch='+(ch&&ch.name)+' voice='+_voiceOverride);}
  // 最優先: 事前生成音声 (VOICEVOX) があればそれを使用 (音声オーバーライド未設定時のみ)
  if(!_voiceOverride && !_preAudioDisabled && state.lang!=='en' && _hasPreAudio(item.id)){
    _preAudioCtrl=_speakItemAudio(item,ch,mySession,applyCharId,
      function(){if(mySession!==_speakSessionId)return;_preAudioCtrl=null;_preAudioFailStreak=0;safeEnd();},
      function(err){
        if(mySession!==_speakSessionId)return;
        console.warn('[TTS] 事前生成音声失敗→ライブ合成へフォールバック:',err&&err.message||err);
        _preAudioCtrl=null;
        _preAudioFailStreak++;
        if(_preAudioFailStreak>=2&&!_preAudioDisabled){
          _preAudioDisabled=true;
          console.warn('[TTS] 事前生成音声が連続で再生できないため、このセッションでは以降ライブ合成のみを使います');
        }
        // 念のためすべての音声経路を停止してから再合成(二重発話防止)
        try{speechSynthesis.cancel();}catch(e){}
        // 旧実装はここで Natural日本語音声が無いと safeEnd() していたため、
        // Edge Natural を持たない環境(Chrome等)では全ブロックが無音で飛ばされていた。
        _speakItemLiveJa();
      });
    return;
  }
  // 事前生成音声を使わない/使えないときのライブ合成経路。
  // 事前生成音声の失敗ハンドラからも呼ぶので関数にしてある(中身は従来と同一)。
  function _speakItemLiveJa(){
    if(mySession!==_speakSessionId)return;
    if(_hasNaturalJaVoice()){
      _speakItemWebAPI(item,ch,mySession,applyCharId,safeEnd,function(err,remainingText){
        if(mySession!==_speakSessionId)return;
        console.warn('[TTS] Web Speech 失敗→クラウドTTSへ:',err&&err.message||err,'残='+(remainingText||'').length);
        _stopAllSpeech();
        // 既に部分再生済みの場合は未再生分のみクラウドで続行(二重発話防止)
        var textToSpeak=(remainingText!=null)?remainingText:(_ttsJaText(item)||'');
        if(!textToSpeak){safeEnd();return;}
        _cloudAudioCtrl=_speakCloud(textToSpeak,ch,state.tts.rate,mySession,
          function(){if(mySession!==_speakSessionId)return;_cloudAudioCtrl=null;safeEnd();},
          function(err2){if(mySession!==_speakSessionId)return;console.warn('[TTS] クラウドも失敗:',err2&&err2.message||err2);_cloudAudioCtrl=null;safeEnd();},
          applyCharId /* onStart: 音声再生開始時に口パク */);
      });
      return;
    }
    if(_cloudDisabled){_speakItemWebAPI(item,ch,mySession,applyCharId,safeEnd);return;}
    _cloudAudioCtrl=_speakCloud(_ttsJaText(item)||'',ch,state.tts.rate,mySession,
      function(){if(mySession!==_speakSessionId)return;_cloudAudioCtrl=null;_cloudFailStreak=0;safeEnd();},
      function(err){
        if(mySession!==_speakSessionId)return;
        console.warn('[TTS] クラウド失敗→Web Speech APIへフォールバック:',err&&err.message||err);
        _cloudAudioCtrl=null;
        _cloudFailStreak++;
        if(_cloudFailStreak>=2&&!_cloudDisabled){
          _cloudDisabled=true;
          console.warn('[TTS] クラウドTTSが連続で失敗するため、このセッションでは以降 Web Speech のみを使います');
        }
        _speakItemWebAPI(item,ch,mySession,applyCharId,safeEnd);
      },
      applyCharId /* onStart */
    );
  }
  _speakItemLiveJa();
}
// Natural でない安定オフライン音声を性別別に返す。
// 優先: Haruka/Sayaka/Ichiro(rate対応) > Ayumi(モバイル音声: rate無視) > その他
var _OFFLINE_PREF_FEMALE=['Haruka','Sayaka','Nanami','Ayumi'];
var _OFFLINE_PREF_MALE=['Ichiro','Keita','Naoki'];
function _offlineFallbackVoice(ch){
  var voices=state.tts.voices;if(!voices||!voices.length)voices=speechSynthesis.getVoices();
  var ja=voices.filter(function(v){return v.lang&&v.lang.indexOf('ja')===0;});
  var _jaOk2=ja.filter(function(v){return !_badVoices[v.name];});
  if(_jaOk2.length)ja=_jaOk2;
  var nonNat=ja.filter(function(v){return !/natural|neural|wavenet|online/i.test(v.name||'');});
  if(!nonNat.length)nonNat=ja;
  var g=ch?(ch.gender||'male'):'male';
  var prefs=g==='male'?_OFFLINE_PREF_MALE:_OFFLINE_PREF_FEMALE;
  for(var i=0;i<prefs.length;i++){
    var hit=nonNat.find(function(v){return (v.name||'').indexOf(prefs[i])>=0;});
    if(hit)return hit;
  }
  var gv=nonNat.filter(function(v){return _voiceGender(v)===g});
  if(gv.length)return gv[0];
  return nonNat[0]||null;
}

var _forceOfflineChars={};

var _disableNaturalForSession=false;

function _speakItemWebAPI(item,ch,session,onStart,onEnd,onError){
  var chunks=_ttsChunk((state.lang==='en'?(_ctext(item)||item.text):_ttsJaText(item))||'',100);
  if(!chunks.length){if(onEnd)onEnd();return;}

function _ageNeighbors(age){

  for(var d=1;d<order.length;d++){
    if(i-d>=0)res.push(order[i-d]);
    if(i+d<order.length)res.push(order[i+d]);
  }
  return res;
}

function _pickIconGroup(gender,age,usedGroups,seedName){

        });

        if(fresh.length)return fresh[seed%fresh.length];

    if(byAge.length)return byAge[seed%byAge.length];

  var anyFresh=g.filter(function(x){return x.gender===G&&usedGroups.indexOf(x.id)<0;});

  var any=g.filter(function(x){return x.gender===G;});

    for(var i=0;i<items.length;i++){
      var it=items[i];
      if(it.type!=='narration')continue;
      var tx=(it.text||'').trim();
      if(!/^「.+?」$/.test(tx)&&!/^『.+?』$/.test(tx))continue;
      var fwd=/(?:言った|云った|言う|云う|言いました|云いました|答えた|答えました|尋ねた|問うた|叫んだ|叫びました|呼んだ|呼びました|囁いた|ささやいた|続けた|呟いた|つぶやいた|申した|申しました)[、。,:：]?[—―ー…]*\s*$/;

// item.ruby を本文のどの位置に当てるかを求める(非重複・各ベース最初の1回)。
// _dispRuby / _ttsJaText / _rubyToMarkup で同じ結果になるよう1箇所にまとめた。
// 親字として妥当か。壊れたデータ(親字が一文に及ぶ等)を表示に持ち込まないための最後の砦。
function _rubyBaseOK(base,read){
  if(!base)return false;
  if(base.length>20)return false;                    // ルビの親字がこれより長いことはまず無い
  if(/[\u3002\u3001\uFF01\uFF1F\u300C\u300D\u300E\u300F\s]/.test(base))return false; // 句読点や括弧を跨いでいる
  if(read&&base.length>read.length*3+4)return false; // 読みに対して親字が長すぎる
  return true;
}
function _rubyMarks(raw,rb){
  var used=[],marks=[];
  if(!raw||!rb||!rb.length)return marks;
  for(var i=0;i<rb.length;i++){
    var base=rb[i][0];if(!base)continue;
    if(!_rubyBaseOK(base,rb[i][1])){
      console.warn('[ruby] 親字が不正なので表示しません: '+JSON.stringify(String(base).slice(0,30))+' → '+rb[i][1]);
      continue;
    }
    // 取り込み時に記録した位置があればそれを使う(検索し直さない)。
    // 位置が本文と食い違う場合(手編集などで本文が変わった)だけ検索へ落とす。
    var pos=rb[i][2];
    if(typeof pos==='number'&&raw.substr(pos,base.length)===base){
      var ng=false;
      for(var u0=0;u0<used.length;u0++){if(pos<used[u0][1]&&pos+base.length>used[u0][0]){ng=true;break;}}
      if(!ng){used.push([pos,pos+base.length]);marks.push({i:pos,l:base.length,r:rb[i][1]});continue;}
    }
    var from=0,at;
    while((at=raw.indexOf(base,from))>=0){
      var hit=false;
      for(var u=0;u<used.length;u++){if(at<used[u][1]&&at+base.length>used[u][0]){hit=true;break;}}
      if(!hit){used.push([at,at+base.length]);marks.push({i:at,l:base.length,r:rb[i][1]});break;}
      from=at+1;
    }
  }
  marks.sort(function(x,y){return x.i-y.i;});
  return marks;
}
// 読み上げ辞書。音声合成が誤読しやすい語(主に近代文語・当て字)を、

// ルビが振ってあればルビが優先される。ここに無い語は、編集画面でルビを
// 振れば恒久的に直る(ルビは読者にも表示される)。
// 追加するときは「その語が他の読みになる可能性がほぼ無い」ものだけにすること。

  ['曾て','かつて'],['嘗て','かつて'],['剰え','あまつさえ'],['如何にも','いかにも'],
  ['聊か','いささか'],['直ぐ','すぐ'],['最早','もはや'],['凡そ','およそ'],
  // 代名詞・指示語
  ['何処','どこ'],['何時','いつ'],['何故','なぜ'],['何方','どちら'],['何卒','なにとぞ'],['何遍','なんべん'],
  ['其処','そこ'],['其れ','それ'],['其の','その'],
  ['此処','ここ'],['此れ','これ'],['此の','この'],
