window.onload=function(){
    loadData();
    document.documentElement.setAttribute('data-theme',state.darkMode?'dark':'light');
    if(_workParam){loadReaderCustom(_workParam);
        // my_ プレフィックスならマイ作品(localStorage)から読み込む
        if(_workParam.indexOf('my_')===0){
            try{
                var u=JSON.parse(localStorage.getItem('aninovel_user'));
                var all=JSON.parse(localStorage.getItem('aninovel_my_works')||'{}');
                var list=(u&&all[u.id])||[];
                var mine=list.find(function(w){return w.id===_workParam});
                if(mine){
                    var data=mine.data;
                    if(data.novel)state.novel=data.novel;
                    if(data.chapters)state.chapters=data.chapters;
                    if(data.characters)state.characters=data.characters;
                    if(data.content)state.content=data.content;
                    if(data.displaySettings)Object.assign(state.displaySettings,data.displaySettings);
                    state.currentScreen='reader';
                    var _ur=u&&(u.roles||[u.role||'reader']);state.isAuthorMode=(u&&(_ur.indexOf('author')>=0||_ur.indexOf('owner')>=0));
                    render();
                    _schedulePregen();
                    // 自動保存フック: my_ 作品は localStorage 側に保存
                    window._saveMyWork=function(){
                        try{
                            var all2=JSON.parse(localStorage.getItem('aninovel_my_works')||'{}');
                            var list2=(u&&all2[u.id])||[];
                            var idx=list2.findIndex(function(w){return w.id===_workParam});
                            if(idx>=0){
                                list2[idx].data={novel:state.novel,chapters:state.chapters,characters:state.characters,content:state.content,displaySettings:state.displaySettings,version:'2.2'};
                                list2[idx].title=state.novel.title||list2[idx].title;
                                list2[idx].updatedAt=new Date().toISOString();
                                all2[u.id]=list2;
                                localStorage.setItem('aninovel_my_works',JSON.stringify(all2));
                            }
                        }catch(e){console.error(e);}
                    };
                    /* 15秒自動保存は削除（60秒saveDataがmy_作品も保存。中断軽減） */
                    return;
                }
            }catch(e){console.error(e);}
            alert('マイ作品が見つかりません');
            window.location.href='index.html';
            return;
        }
        window.AninovelServices.getWork(_workParam).then(function(data){
            if(data.novel)state.novel=data.novel;
            if(data.chapters)state.chapters=data.chapters;
            if(data.characters)state.characters=data.characters;
            if(data.content)state.content=data.content;
            if(data.displaySettings)Object.assign(state.displaySettings,data.displaySettings);
            // 同梱作品オーバーライド適用 (pub_/my_ 以外のとき)
            if(_workParam.indexOf('pub_')!==0&&_workParam.indexOf('my_')!==0){
              try{
                var _ov=JSON.parse(localStorage.getItem('aninovel_bundled_overrides')||'{}');
                var _od=_ov[_workParam]&&_ov[_workParam].data;
                if(_od){
                  if(_od.novel)state.novel=_od.novel;
                  if(_od.chapters)state.chapters=_od.chapters;
                  if(_od.characters)state.characters=_od.characters;
                  if(_od.content)state.content=_od.content;
                  if(_od.displaySettings)Object.assign(state.displaySettings,_od.displaySettings);
                  console.info('[Load] 同梱作品オーバーライド適用',_workParam,'updatedAt='+_ov[_workParam].updatedAt);
                }
              }catch(e){console.warn('[Load] オーバーライド読込失敗',e);}
            }
            state.currentScreen='reader';
            // 投稿版でも作者(author/owner)としてログイン中なら作者モードを許可
            try{var _u=JSON.parse(localStorage.getItem('aninovel_user'));var _r=_u&&(_u.roles||[_u.role||'reader']);state.isAuthorMode=!!(_u&&_u.loggedIn&&_r&&(_r.indexOf('author')>=0||_r.indexOf('owner')>=0));}catch(e){state.isAuthorMode=false;}
            _restoreProgress();_preloadWorkTrans();render();
            _schedulePregen();
        }).catch(function(e){console.error(e);render()});
    } else {
        // ?work= なしで viewer.html を直接開かれた場合はポータルへ戻す
        window.location.replace('index.html');
        return;
    }
    setInterval(function(){if(state.isAuthorMode)saveData(true)},60000);/* 60秒・無音・再描画/カーソル/スクロール変更なし */
    window.addEventListener('beforeunload',function(){try{_saveProgress()}catch(e){}});
};
