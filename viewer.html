];
// 長い語から順に当てる(短い語が先に食い込むのを防ぐ)
TTS_YOMI.sort(function(a,b){return b[0].length-a[0].length;});
function _applyYomiDict(s){
  if(!s)return s;
  for(var i=0;i<TTS_YOMI.length;i++){
    if(s.indexOf(TTS_YOMI[i][0])>=0) s=s.split(TTS_YOMI[i][0]).join(TTS_YOMI[i][1]);
  }
  return s;
}
// 読み上げ用: ルビのある箇所を読み(かな)に置き換える。
// 「怪しからん」→「けしからん」、「居やがらん」→「いやがらん」のように、
// 音声合成が漢字を誤読するのを防ぐ。ルビが無ければ原文のまま。
function _ttsJaText(item){
  var raw=(item&&item.text)||'';
  var marks=_rubyMarks(raw,item&&item.ruby);
  if(!marks.length)return _applyYomiDict(raw);
  var out='',pos=0;
  for(var k=0;k<marks.length;k++){
    var m=marks[k];if(m.i<pos)continue;
    // ルビの無い区間だけ辞書を当てる(ルビが振ってあればルビが優先)
    out+=_applyYomiDict(raw.slice(pos,m.i))+(m.r||raw.substr(m.i,m.l));
    pos=m.i+m.l;
  }
  return out+_applyYomiDict(raw.slice(pos));
}
// 編集用: 本文とルビを青空文庫記法(漢字《かな》)に戻す。
function _rubyToMarkup(item){
  var raw=(item&&item.text)||'';
  var marks=_rubyMarks(raw,item&&item.ruby);
  if(!marks.length)return raw;
  var out='',pos=0;
  // 直前が漢字・カタカナ・英数字だと《》の係り先が広がってしまうので、
  // 青空文庫記法の区切り記号 ｜ を補って対象を明示する(例: 二｜疋《ひき》)。
  var NEED=/[\u4E00-\u9FFF\u3005\u30A1-\u30FA\u30FCA-Za-z0-9]/;
  for(var k=0;k<marks.length;k++){
    var m=marks[k];if(m.i<pos)continue;
    var head=raw.slice(pos,m.i);
    var sep=(m.i>0&&NEED.test(raw.charAt(m.i-1)))?'\uFF5C':'';
    out+=head+sep+raw.substr(m.i,m.l)+'\u300A'+(m.r||'')+'\u300B';
    pos=m.i+m.l;
  }
  return out+raw.slice(pos);
}
// 編集用: 《かな》付きの入力を本文とルビ配列に分解して data に書き戻す。
function _markupToItem(v,data){
  var al=_aozoraLine(String(v==null?'':v));
  data.text=al.text;
  data.ruby=(al.ruby&&al.ruby.length)?al.ruby:null;
}
function _dispRuby(item,query){
  var raw=((typeof _ctext==='function'?_ctext(item):item.text)||item.text||'');
  var rb=item&&item.ruby;
  // 検索中と翻訳表示中は位置が合わないのでルビを付けない
  if(query||!rb||!rb.length||raw!==item.text||state.rubyOff)return displayText(raw,query);
  try{
    var marks=_rubyMarks(raw,rb);
    var en=(state.lang==='en');
    function E(s){return esc(en?s:toFullWidth(s));}
    var out='',pos=0;
    for(var k=0;k<marks.length;k++){
      var m=marks[k];if(m.i<pos)continue;
      out+=E(raw.slice(pos,m.i))+'<ruby>'+E(raw.substr(m.i,m.l))+'<rt>'+esc(m.r)+'</rt></ruby>';
      pos=m.i+m.l;
    }
    out+=E(raw.slice(pos));
    return out;
  }catch(e){return displayText(raw,query);}
}

function renderNarration(item){var ds=state.displaySettings,fs=ds.fontSize,lh=_lh(ds.lineHeight),ft=_font(ds.font),or=ds.orientation,ns=ds.narratorStyle,is=ds.iconSize;
  // 地の文にも話者を持たせられるようにする。characterId が入っていれば
  // 「その人物の独白」として吹き出しで描く(ナレーター表示設定に関わらず)。

function openGallery(){
  state.imageGalleryOpen=true;state.galleryGroup=null;state.galleryPage=0;
  if(!state.galleryManifest){
    fetch('data/gallery-manifest.json',{cache:'force-cache'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(m){state.galleryManifest=m;render();})
      .catch(function(e){console.warn('[Gallery] manifest読込失敗',e);state.galleryManifest={error:true};render();});
  }
  render();
}
function renderGallery(){
  var man=state.galleryManifest;
  // ★ 性別フィルタ（編集中キャラの性別に応じて）
  var _gen=null;
  if(state.readerCustomOpen&&state.readerCustomCharId){
    var _ch=state.characters.find(function(c){return c.id===state.readerCustomCharId});
    if(_ch)_gen=_ch.gender;
  }else if(state.editingItem&&state.editingItem.data){
    _gen=state.editingItem.data.gender;
  }
  if(man&&man.groups&&(_gen==='male'||_gen==='female')){
    man={groups:man.groups.filter(function(g){var gl=(g.gender||'').toLowerCase();return gl===_gen||!gl;})};
  }
  var h='<div class="modal-overlay" style="z-index:55" onclick="if(event.target===this){state.imageGalleryOpen=false;render()}"><div class="modal-content" style="max-width:840px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-weight:700;font-size:16px">🖼️ キャラクター画像ギャラリー</h3><button onclick="state.imageGalleryOpen=false;render()" class="btn-icon" style="color:var(--text-primary)">✕</button></div>';
  if(!man){
    h+='<p style="text-align:center;color:var(--text-muted);padding:48px 0">読み込み中...</p>';
  }else if(man.error){
    h+='<p style="text-align:center;color:var(--text-muted);padding:32px 0">ギャラリーを読み込めませんでした。<br>ローカルサーバー経由で開いているか確認してください。</p>';
  }else if(!state.galleryGroup){
    h+='<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">カテゴリーを選択してください（画風 → 民族 → 年齢）</p>';
    h+='<div style="max-height:60vh;overflow-y:auto;padding-right:4px">';
    // 画風(type)→民族(race)→年齢(age) の階層グルーピング
    var _typeIcon={'Anime':'🎨','AnimeGen':'🎨','Photo':'📷','PhotoGen':'📸','RetroManga':'📚','RetroMangaGen':'📚','Painterly':'🖌️','Watercolor':'💧','Pastel':'🖍️'};
    var _typeJa={'Anime':'アニメ(精選)','AnimeGen':'アニメ(生成)','Photo':'写真(精選)','PhotoGen':'写真(生成)','RetroManga':'レトロ漫画(精選)','RetroMangaGen':'レトロ漫画(生成)','Painterly':'絵画調','Watercolor':'水彩','Pastel':'パステル'};
    var _typeOrder=['Anime','AnimeGen','Photo','PhotoGen','RetroManga','RetroMangaGen','Painterly','Watercolor','Pastel'];
    var _raceJa={'Japanese':'日本','White':'欧米','Asian':'アジア','MiddleEastern':'中東','Hispanic':'ヒスパニック','Black':'黒人','SouthAsian':'南アジア'};
    var _ageJa={'Baby':'赤ちゃん','Child':'子供','Teen':'10代','YoungAdult':'青年','Adult':'成人','MiddleAge':'中年','Senior':'高齢'};
    var _ageOrder=['Baby','Child','Teen','YoungAdult','Adult','MiddleAge','Senior'];
    // type でグループ化
    var _byType={};
    man.groups.forEach(function(grp){var t=grp.type||grp.style||'Other';if(!_byType[t])_byType[t]=[];_byType[t].push(grp);});
    var _types=_typeOrder.filter(function(t){return _byType[t];});
    Object.keys(_byType).forEach(function(t){if(_types.indexOf(t)<0)_types.push(t);});
    _types.forEach(function(type){
      var _ic=_typeIcon[type]||'🎭';var _tja=_trFull(_typeJa[type]||type);
      h+='<div style="margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent,#8E44AD);font-weight:700;font-size:15px">'+_ic+' '+_tja+' <span style="font-size:12px;color:var(--text-muted);font-weight:400">'+type+'</span></div>';
      // race でグループ化
      var _byRace={};
      _byType[type].forEach(function(grp){var r=grp.race||'';if(!_byRace[r])_byRace[r]=[];_byRace[r].push(grp);});
      Object.keys(_byRace).sort().forEach(function(race){
        var _rja=_trFull(_raceJa[race]||race);
        h+='<div style="margin:10px 0 4px;font-size:12px;font-weight:600;color:var(--text-secondary)">'+_rja+' <span style="font-size:10px;color:var(--text-muted)">'+race+'</span></div>';
        h+='<div class="gallery-cat-grid">';
        _byRace[race].sort(function(a,b){return _ageOrder.indexOf(a.age)-_ageOrder.indexOf(b.age);});
        _byRace[race].forEach(function(grp){
          var rep=(grp.items&&grp.items.length)?grp.items[0].p:'';
          var _aja=_trFull(_ageJa[grp.age]||grp.age);
          h+='<button class="gallery-cat-btn" onclick="state.galleryGroup=\''+grp.id+'\';state.galleryPage=0;render()">'
            +(rep?'<img src="'+rep+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<div style="width:66px;height:66px;border-radius:50%;background:var(--bg-secondary)"></div>')
            +'<span class="gallery-cat-label">'+_aja+'</span>'
            +'<span class="gallery-cat-count">'+(grp.items?grp.items.length:0)+(state.lang==='en'?'':'件')+'</span></button>';
        });
        h+='</div>';
      });
    });
    h+='</div>';
  }else{
    var grp=null,i;
    for(i=0;i<man.groups.length;i++){if(man.groups[i].id===state.galleryGroup){grp=man.groups[i];break;}}
    var items=(grp&&grp.items)||[];
    var PER=30;
    var pages=Math.max(1,Math.ceil(items.length/PER));
    var pg=Math.min(Math.max(0,state.galleryPage||0),pages-1);

      +'<button onclick="state.galleryGroup=null;render()" class="btn btn-ghost" style="font-size:12px">← カテゴリー選択</button>'
      +'<span style="font-weight:600;font-size:14px">'+(grp?grp.label:'')+'</span>'
      +'<span style="font-size:12px;color:var(--text-muted)">全'+items.length+'件</span></div>';

        +'<button onclick="if((state.galleryPage||0)<'+(pages-1)+'){state.galleryPage=(state.galleryPage||0)+1;render()}" class="btn btn-ghost"'+(pg>=pages-1?' disabled':'')+'>次 ›</button>'
        +'</div>';
    }
  }
  h+='</div></div>';
  return h;
}
function _metaTagStr(){
  var cur=(state.novel&&Array.isArray(state.novel.tags))?state.novel.tags:[];
  return cur.filter(function(s){return s!=='青空文庫'&&s!=='名作';}).join(', ');
}
function _hasAozora(){
  var cur=(state.novel&&Array.isArray(state.novel.tags))?state.novel.tags:[];
  return cur.indexOf('青空文庫')>=0;
}
function _setNovelTags(str){
  var arr=(str||'').split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  var keep=[];
  var cur=(state.novel&&Array.isArray(state.novel.tags))?state.novel.tags:[];
  if(cur.indexOf('青空文庫')>=0){keep.push('青空文庫');keep.push('名作');}
  var merged=keep.concat(arr.filter(function(s){return s!=='青空文庫'&&s!=='名作';}));
  var uniq=[];merged.forEach(function(s){if(uniq.indexOf(s)<0)uniq.push(s);});
  if(!state.novel)state.novel={};
  state.novel.tags=uniq;
}
function _toggleAozora(on){
  var cur=(state.novel&&Array.isArray(state.novel.tags))?state.novel.tags.slice():[];
  cur=cur.filter(function(s){return s!=='青空文庫'&&s!=='名作';});
  if(on){cur.unshift('名作');cur.unshift('青空文庫');}
  if(!state.novel)state.novel={};
  state.novel.tags=cur;
  render();
}

// === Reader Customize ===
function _getProfileBundle(){
  try{
    var user=JSON.parse(localStorage.getItem('aninovel_user'));
    var all=JSON.parse(localStorage.getItem('aninovel_reader_profiles'))||{};
    var key=(user&&user.loggedIn)?user.id:'_anon';
    if(!all[key])all[key]={current:'デフォルト',profiles:{'デフォルト':{}}};
    if(!all[key].profiles)all[key].profiles={'デフォルト':{}};
    if(!all[key].profiles[all[key].current])all[key].profiles[all[key].current]={};
    return {all:all,key:key,bundle:all[key]};
  }catch(e){return {all:{},key:'_anon',bundle:{current:'デフォルト',profiles:{'デフォルト':{}}}};}
}
function _persistProfiles(pb){
  pb.all[pb.key]=pb.bundle;
  localStorage.setItem('aninovel_reader_profiles',JSON.stringify(pb.all));
}
function loadReaderCustom(workId){
  if(!workId){state.readerCustom=null;return;}
  var pb=_getProfileBundle();
  var p=pb.bundle.profiles[pb.bundle.current]||{};
  state.readerCustom=p[workId]||null;
  state.readerProfileCurrent=pb.bundle.current;
  state.readerProfileList=Object.keys(pb.bundle.profiles);
}
function saveReaderCustom(workId){
  if(!workId)return;
  var pb=_getProfileBundle();
  if(!pb.bundle.profiles[pb.bundle.current])pb.bundle.profiles[pb.bundle.current]={};
  if(state.readerCustom&&Object.keys(state.readerCustom).length){
    // 深いコピーを保存（参照分離で次回読込時の衝突回避）
    pb.bundle.profiles[pb.bundle.current][workId]=JSON.parse(JSON.stringify(state.readerCustom));
  }else{
    delete pb.bundle.profiles[pb.bundle.current][workId];
  }
  _persistProfiles(pb);
  // state を最新のプロファイル情報で更新
  state.readerProfileCurrent=pb.bundle.current;
  state.readerProfileList=Object.keys(pb.bundle.profiles);
  // 読者カスタム変更後に全キャラ口パクGIFを事前生成
  _schedulePregen();
}
function switchReaderProfile(name){
  var pb=_getProfileBundle();
  if(!pb.bundle.profiles[name])pb.bundle.profiles[name]={};
  pb.bundle.current=name;
  _persistProfiles(pb);
  loadReaderCustom(_workParam);
  render();
  showToast(state.lang==='en'?('Switched to profile "'+name+'"'):('プロファイル「'+name+'」に切替えました'));
}
function createReaderProfile(){
  var name=prompt('新しいプロファイル名を入力');
  if(!name||!name.trim())return;
  var pb=_getProfileBundle();
  if(pb.bundle.profiles[name]){showToast('同名のプロファイルがあります');return;}
  pb.bundle.profiles[name]={};
  pb.bundle.current=name;
  _persistProfiles(pb);
  loadReaderCustom(_workParam);
  render();
  showToast(state.lang==='en'?('Created profile "'+name+'"'):('プロファイル「'+name+'」を作成しました'));
}
function deleteReaderProfile(name){
  if(name==='デフォルト'){showToast('デフォルトは削除できません');return;}
  if(!confirm(state.lang==='en'?('Delete profile "'+name+'"?'):('プロファイル「'+name+'」を削除しますか？')))return;
  var pb=_getProfileBundle();
  delete pb.bundle.profiles[name];
  if(pb.bundle.current===name)pb.bundle.current='デフォルト';
  _persistProfiles(pb);
  loadReaderCustom(_workParam);
  render();
  showToast('プロファイルを削除しました');
}
function resetToAuthorDefaults(){
  if(!_workParam)return;
  if(!confirm('この作品のカスタマイズを作者推奨の設定に戻しますか？\n（現在のプロファイル「'+state.readerProfileCurrent+'」のみ影響）'))return;
  state.readerCustom=null;
  saveReaderCustom(_workParam);
  render();
  showToast('作者推奨の設定に戻しました');
}

function _normDupText(t){return (t||'').replace(/[「」『』""''\s\u3000.。、,，!！?？]/g,'');}
function _findDuplicates(){
  var arr=state.content.slice().sort(function(a,b){return a.order-b.order;});
  var pairs=[];
  for(var i=0;i<arr.length;i++){
    if(arr[i].type==='pageBreak')continue;
    var ni=_normDupText(arr[i].text);if(ni.length<3)continue;
    for(var j=i+1;j<arr.length;j++){
      if(arr[j].type==='pageBreak')continue;
      var nj=_normDupText(arr[j].text);if(nj.length<3)continue;
      // 距離が遠すぎるペアは除外（誤検出抑制）
      if(Math.abs(arr[i].order-arr[j].order)>20)continue;
      var kind=null;
      if(ni===nj)kind='完全一致';
      else if(ni.length>=8&&nj.length>=8&&(ni.indexOf(nj)>=0||nj.indexOf(ni)>=0)){
        var lr=Math.min(ni.length,nj.length)/Math.max(ni.length,nj.length);
        if(lr>=0.7)kind='包含一致('+Math.round(lr*100)+'%)';
      }
      if(!kind)continue;
      // どちらを削除推奨にするか:
      // 1. ナレーターが「キャラセリフ」を引用している場合 → ナレーター側を削除推奨
      // 2. それ以外 → 後ろのitemを削除推奨
      var a=arr[i],b=arr[j];
      var aIsN=(a.type==='narration'||a.characterId==='narrator'||!a.characterId);
      var bIsN=(b.type==='narration'||b.characterId==='narrator'||!b.characterId);
      var suggest=b.id;
      if(aIsN&&!bIsN)suggest=a.id;
      else if(!aIsN&&bIsN)suggest=b.id;
      pairs.push({a:a,b:b,kind:kind,suggest:suggest});
    }
  }
  return pairs;
}
function _itemLabel(it){
  if(!it)return '?';
  if(it.type==='narration'||it.characterId==='narrator'||!it.characterId)return '📝 ナレーター';
  var ch=state.characters.find(function(c){return c.id===it.characterId;});
  return '💬 '+(ch?ch.name:'(不明)');
}
function _itemPageNo(it){
  var arr=state.content.slice().sort(function(a,b){return a.order-b.order;});
  var p=0;for(var k=0;k<arr.length;k++){if(arr[k].type==='pageBreak'){p++;continue;}if(arr[k].id===it.id)return p+1;}
  return p+1;
}
function openDupModal(){state.dupModalOpen=true;render();}
function closeDupModal(){state.dupModalOpen=false;render();}
function deleteDupItem(id){
  var it=state.content.find(function(c){return c.id===id;});
  if(!it){showToast('既に削除済み');render();return;}
  if(!confirm('削除しますか?\n['+_itemLabel(it)+'] '+(it.text||'').substring(0,40)))return;
  state.content=state.content.filter(function(c){return c.id!==id;});
  saveData&&saveData();
  showToast('削除しました');
  render();
}
function jumpToDupItem(id){
  var it=state.content.find(function(c){return c.id===id;});
  if(!it){showToast('既に削除済み');return;}
  var p=_itemPageNo(it)-1;
  state.dupModalOpen=false;
  if(p!==state.currentPage)state.currentPage=p;
  state._scrollToId=id;
  render();
}
function renderDupModal(){
  if(!state.dupModalOpen)return '';
  var pairs=_findDuplicates();
  var h='<div class="modal-overlay" onclick="if(event.target===this)closeDupModal()"><div class="modal-content" style="max-width:780px;max-height:85vh;overflow-y:auto">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3 style="font-weight:700;font-size:16px">🔍 重複コンテンツ検出 ('+pairs.length+'件)</h3><button onclick="closeDupModal()" class="btn-icon" style="color:var(--text-primary)">✕</button></div>';
  h+='<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">同一テキストが複数ある箇所を表示します。ナレーター側がキャラセリフを引用しているケース等が候補です。<br>★ = 削除推奨。「ジャンプ」で本文の位置を確認できます。</p>';
  if(!pairs.length){h+='<p style="text-align:center;color:var(--text-muted);padding:30px">重複は検出されませんでした 🎉</p>';}
  else{
    h+='<div style="display:flex;flex-direction:column;gap:14px">';
    pairs.forEach(function(p,idx){
      h+='<div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--bg-secondary)">';
      h+='<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">No.'+(idx+1)+' / '+esc(p.kind)+'</div>';
      [p.a,p.b].forEach(function(it){
        var rec=(it.id===p.suggest);
        h+='<div style="border:'+(rec?'2px solid #F59E0B':'1px solid var(--border)')+';border-radius:6px;padding:8px;margin-bottom:6px;background:var(--bg-primary)">';
        h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:12px;font-weight:600">'+(rec?'★ ':'')+_itemLabel(it)+'</span><span style="font-size:10px;color:var(--text-muted)">P'+_itemPageNo(it)+' / id='+esc(it.id)+'</span></div>';
        h+='<div style="font-size:13px;line-height:1.5;color:var(--text-secondary);margin-bottom:6px;white-space:pre-wrap">'+esc((it.text||'').substring(0,200))+((it.text||'').length>200?'…':'')+'</div>';
        h+='<div style="display:flex;gap:6px"><button onclick="jumpToDupItem(\''+it.id+'\')" class="btn btn-ghost" style="font-size:11px;padding:4px 10px">📍 ジャンプ</button><button onclick="deleteDupItem(\''+it.id+'\')" class="btn" style="font-size:11px;padding:4px 10px;background:#FEE2E2;color:#DC2626">🗑️ 削除</button></div>';
        h+='</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }
  h+='<div style="display:flex;justify-content:flex-end;margin-top:16px"><button onclick="closeDupModal()" class="btn btn-ghost">閉じる</button></div>';
  h+='</div></div>';
  return h;
}

function _contentHash(){
  var s=(state.novel.title||'')+'|'+(state.novel.author||'')+'|';
  var arr=state.content.slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  arr.forEach(function(it){ if(it.text) s+=it.id+':'+it.text+'\n'; });

}

function _preloadWorkTrans(){

function maybeTranslateWork(){

function translateWork(hash){

  state.translating=true;
  showToast('Translating…');

    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({target:state.lang,source:_srcLang(),sourceLang:_srcLang(),title:state.novel.title||'',author:state.novel.author||'',items:items,characters:(state.characters||[]).filter(function(c){return c.id!=='narrator'&&c.name;}).map(function(c){return {id:c.id,name:c.name};})})

}

function applyI18n(){
  try{
    var html=document.documentElement; html.setAttribute('lang', state.lang==='en'?'en':'ja');
    if(state.lang!=='en') return;
    var root=document.getElementById('app'); if(!root) return;
    // テキストノード走査
    var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node, nodes=[]; while(node=w.nextNode()){ nodes.push(node); }
    for(var i=0;i<nodes.length;i++){
      var t=nodes[i].nodeValue; if(!t) continue; var k=t.trim(); if(!k) continue;
      var hit=I18N_DICT[k]; if(hit!=null && hit!==k){ nodes[i].nodeValue=t.replace(k,hit); }
    }
    // 属性 (title / placeholder)
    var els=root.querySelectorAll('[title],[placeholder]');
    for(var j=0;j<els.length;j++){
      ['title','placeholder'].forEach(function(a){
        var v=els[j].getAttribute(a); if(v==null) return; var k2=v.trim(); var h2=I18N_DICT[k2];
        if(h2!=null && h2!==k2) els[j].setAttribute(a, v.replace(k2,h2));
      });
    }
  }catch(e){ console.warn('[i18n]',e); }
}

// Attached to #app element after each render
var _dType=null,_dPayload=null,_tClone=null,_tMoved=false;

function activateDragMode(){
    var pa=document.getElementById('pageArea');
    if(pa)pa.classList.add('drag-active');
}
function deactivateDragMode(){
    var pa=document.getElementById('pageArea');
    if(pa)pa.classList.remove('drag-active');
}
function findNearestDropPos(e){
    var zones=document.querySelectorAll('[data-droppos]');
    var best=null,bestDist=Infinity;
    zones.forEach(function(z){
        var r=z.getBoundingClientRect();
        var cx=r.left+r.width/2, cy=r.top+r.height/2;
        var d=Math.sqrt(Math.pow(e.clientX-cx,2)+Math.pow(e.clientY-cy,2));
        if(d<bestDist){bestDist=d;best=z}
    });
    return best;
}

function setupDnD(){
    var app=document.getElementById('app');
    if(!app)return;
    if(app._dndBound)return;
    app._dndBound=true;

    // === Desktop D&D ===
    app.addEventListener('dragstart',function(e){
        var el=e.target.closest('[data-dragid]');
        if(el){
            _dType='content';_dPayload=el.getAttribute('data-dragid');
            window._wasDragging=true;
            e.dataTransfer.effectAllowed='move';
            e.dataTransfer.setData('text/plain',_dPayload);
            setTimeout(function(){
                var c=document.querySelector('[data-cid="'+_dPayload+'"]');
                if(c)c.classList.add('dragging');
                activateDragMode();
            },0);
            return;
        }
        el=e.target.closest('[data-dragtool]');
        if(el){
            _dType='tool';_dPayload=el.getAttribute('data-dragtool');
            e.dataTransfer.effectAllowed='copy';
            e.dataTransfer.setData('text/plain','tool:'+_dPayload);
            setTimeout(activateDragMode,0);
            return;
        }
        el=e.target.closest('[data-dragchar]');
        if(el){
            _dType='character';_dPayload=el.getAttribute('data-dragchar');
            e.dataTransfer.effectAllowed='copy';
            e.dataTransfer.setData('text/plain','char:'+_dPayload);
            var ch=state.characters.find(function(c){return c.id===_dPayload});
            if(ch){
                var ghost=document.createElement('div');
                ghost.textContent='💬 '+ch.name;
                ghost.style.cssText='position:fixed;top:-100px;left:-100px;background:#8E44AD;color:#fff;padding:8px 16px;border-radius:12px;font-size:13px;z-index:9999';
                document.body.appendChild(ghost);
                e.dataTransfer.setDragImage(ghost,40,20);
                setTimeout(function(){ghost.remove()},0);
            }
            setTimeout(activateDragMode,0);
            return;
        }
    });

    // Global dragover - always allow drop when dragging
    app.addEventListener('dragover',function(e){
        if(!_dType)return;
        e.preventDefault();
        e.dataTransfer.dropEffect=_dType==='content'?'move':'copy';
        document.querySelectorAll('.insert-area.drag-over').forEach(function(x){x.classList.remove('drag-over')});
        var z=e.target.closest('[data-droppos]');
        if(z){z.classList.add('drag-over')}
        else{
            var nearest=findNearestDropPos(e);
            if(nearest)nearest.classList.add('drag-over');
        }
    });

    app.addEventListener('dragleave',function(e){
        if(!e.relatedTarget||!app.contains(e.relatedTarget)){
            document.querySelectorAll('.drag-over').forEach(function(x){x.classList.remove('drag-over')});
        }
    });

    app.addEventListener('dragend',function(e){cleanDrag()});

    app.addEventListener('drop',function(e){
        if(!_dType)return;
        e.preventDefault();
        var z=e.target.closest('[data-droppos]');
        if(!z)z=findNearestDropPos(e);
        if(z){
            z.classList.remove('drag-over');
            execDrop(parseInt(z.getAttribute('data-droppos')));
        }
        cleanDrag();
    });

    // === Mobile Touch D&D ===
    app.addEventListener('touchstart',function(e){
        if(e.target.closest('button,a,input,select,textarea,label'))return;
        var el=e.target.closest('[data-dragid]');
        if(el&&state.isAuthorMode){
            _dType='content';_dPayload=el.getAttribute('data-dragid');_tMoved=false;
            e.preventDefault();mkClone(e.touches[0],el);
            var c=document.querySelector('[data-cid="'+_dPayload+'"]');
            if(c)c.classList.add('dragging');
            activateDragMode();
            return;
        }
        el=e.target.closest('[data-dragtool]');
        if(el){
            _dType='tool';_dPayload=el.getAttribute('data-dragtool');_tMoved=false;
            e.preventDefault();mkClone(e.touches[0],el);
            activateDragMode();
            return;
        }
        el=e.target.closest('[data-dragchar]');
        if(el){
            _dType='character';_dPayload=el.getAttribute('data-dragchar');_tMoved=false;
            e.preventDefault();
            var ch=state.characters.find(function(c){return c.id===_dPayload});
            mkClone(e.touches[0],el,ch?'💬 '+ch.name:null);
            activateDragMode();
            return;
        }
