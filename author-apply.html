<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作者登録の申請 — AniNovel</title>
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#2d2a26; --muted:#6b645c;
  --line:#e5ded4; --accent:#8b5e34; --accent2:#a67c52; --err:#b23a3a; --ok:#3a7d44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
    --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262320; --ink:#ece7e0; --muted:#a49a8e;
  --line:#3a352f; --accent:#c9a227; --accent2:#d4b24c;
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
.wrap.wide{max-width:860px}
h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--muted);font-size:.95rem;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card+.card{margin-top:16px}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.9rem}
label:first-child{margin-top:0}
label .opt{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:8px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}
.btn{margin-top:26px;width:100%;padding:13px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{width:auto;margin:0;padding:8px 16px;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(139,94,52,.08)}
.msg{margin-top:18px;padding:13px 15px;border-radius:9px;font-size:.92rem;display:none}
.msg.err{display:block;background:rgba(178,58,58,.1);border:1px solid rgba(178,58,58,.35);color:var(--err)}
.msg.ok{display:block;background:rgba(58,125,68,.1);border:1px solid rgba(58,125,68,.3)}
.foot{margin-top:26px;font-size:.88rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.tag.pending{background:rgba(201,162,39,.18);color:#8a6d0b}
.tag.approved{background:rgba(58,125,68,.15);color:#2f6637}
.tag.rejected{background:rgba(178,58,58,.13);color:var(--err)}
dl.kv{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0;word-break:break-word}
.bio{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-top:4px;font-size:.9rem}

</style>
<style>
.done h2{font-size:1.2rem;margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>作者登録の申請</h1>
  <p class="lead">AniNovel で作品を公開するには、作者登録が必要です。<br>
    お申し込みの内容を確認のうえ、こちらからご連絡します。</p>

  <div class="card" id="form">
    <label for="name">お名前 <span class="opt">非公開</span></label>
    <input id="name" maxlength="100" autocomplete="name">
    <p class="hint">本名でお願いします。公開されることはありません。</p>

    <label for="email">メールアドレス <span class="opt">非公開・ログインIDになります</span></label>
    <input id="email" type="email" maxlength="200" autocomplete="email">
    <p class="hint">承認のご連絡をこちらへお送りします。</p>

    <label for="password">パスワード <span class="opt">10文字以上</span></label>
    <input id="password" type="password" maxlength="200" autocomplete="new-password">
    <p class="hint">数字だけ、推測されやすい語を含むものは使えません。</p>

    <label for="nickname">ニックネーム <span class="opt">公開</span></label>
    <input id="nickname" maxlength="50">
    <p class="hint">作品に表示される名前です。</p>

    <label for="bio">自己紹介 <span class="opt">公開・任意</span></label>
    <textarea id="bio" maxlength="1000"></textarea>

    <button class="btn" id="send">申請する</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card done" id="done">
    <h2>申請を受け付けました</h2>
    <p>内容を確認のうえ、ご登録のメールアドレスへご連絡します。</p>
    <p class="hint">お返事が届かない場合は、<strong>迷惑メールフォルダ</strong>もご確認ください。
      <code>noreply@aninovel.com</code> からお送りします。</p>
  </div>

  <p class="foot">登録済みの方は <a href="/author-login.html">ログイン</a></p>
</div>

<script>
var $=function(id){return document.getElementById(id);};
function show(kind,text){
  var m=$('msg'); m.className='msg '+kind; m.textContent=text;
}
$('send').onclick=async function(){
  var btn=$('send');
  var body={
    name:$('name').value.trim(),
    email:$('email').value.trim(),
    password:$('password').value,
    nickname:$('nickname').value.trim(),
    bio:$('bio').value.trim()
  };
  if(!body.name){ show('err','お名前を入力してください。'); return; }
  if(!body.email){ show('err','メールアドレスを入力してください。'); return; }
  if(!body.nickname){ show('err','ニックネームを入力してください。'); return; }
  if((body.password||'').length<10){ show('err','パスワードは10文字以上にしてください。'); return; }

  btn.disabled=true; show('ok','送信しています…');
  try{
    var r=await fetch('/api/apply',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j=await r.json();
    if(r.ok){
      $('form').style.display='none';
      $('done').style.display='block';
      window.scrollTo(0,0);
      return;
    }
    show('err',j.error||('エラー ('+r.status+')'));
  }catch(e){
    show('err','通信に失敗しました。時間をおいてお試しください。');
  }
  btn.disabled=false;
};
</script>
</body>
</html>
