<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AniNovel 音声診断</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
       margin:0;padding:16px;background:#f7f7f8;color:#111;font-size:15px;line-height:1.6}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{color:#666;font-size:13px;margin:0 0 16px}
  button{display:block;width:100%;padding:14px;margin:10px 0;font-size:16px;font-weight:600;
         border:0;border-radius:10px;background:#4f46e5;color:#fff}
  button:active{background:#3730a3}
  button.sec{background:#e5e7eb;color:#111}
  #log{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;
       white-space:pre-wrap;word-break:break-all;font-size:13px;min-height:200px}
  .ok{color:#047857;font-weight:600}
  .ng{color:#b91c1c;font-weight:600}
  .warn{color:#b45309}
</style>
</head>
<body>
<h1>AniNovel 音声診断</h1>
<p class="sub">上から順にボタンを押して、最後に画面全体のスクリーンショットを送ってください。</p>

<button id="b1">① 環境を調べる（音は出ません）</button>
<button id="b2">② 短い音を鳴らす（合成音・すぐ鳴るはず）</button>
<button id="b3">③ サーバの音声を鳴らす（本番と同じ経路）</button>
<button id="b4">④ 取得してから鳴らす（AniNovel と同じやり方）</button>
<button class="sec" id="b5">ログを消す</button>

<div id="log">まだ何も実行していません。</div>

<script>
var L=[];
function P(s,cls){ L.push(cls?('<span class="'+cls+'">'+s+'</span>'):s);
  document.getElementById('log').innerHTML=L.join('\n'); }
function clr(){ L=[]; document.getElementById('log').innerHTML='(消去しました)'; }

/* ---------- ① 環境 ---------- */
document.getElementById('b1').onclick=function(){
  P('===== ① 環境 =====');
  P('UA: '+navigator.userAgent);
  P('画面: '+screen.width+'x'+screen.height+' / DPR '+(window.devicePixelRatio||1));
  P('オンライン: '+navigator.onLine);
  var a=document.createElement('audio');
  P('audio 要素: '+(a.canPlayType? 'あり':'なし'));
  P('  wav 再生可否: "'+(a.canPlayType('audio/wav')||'(不可)')+'"');
  P('  mp3 再生可否: "'+(a.canPlayType('audio/mpeg')||'(不可)')+'"');
  P('AudioContext: '+(typeof (window.AudioContext||window.webkitAudioContext)!=='undefined'?'あり':'なし'));
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    var ctx=new AC();
    P('  状態: '+ctx.state+(ctx.state==='suspended'?'  ← 操作するまで音が出ない状態':''));
    P('  サンプリングレート: '+ctx.sampleRate);
    ctx.close&&ctx.close();
  }catch(e){ P('  AudioContext 生成失敗: '+e.message,'ng'); }
  P('音声合成(Web Speech): '+(('speechSynthesis' in window)?'あり':'なし'));
  if('speechSynthesis' in window){
    var v=speechSynthesis.getVoices()||[];
    P('  音声の数: '+v.length);
    var ja=v.filter(function(x){return /ja/i.test(x.lang);});
    P('  日本語音声: '+(ja.length? ja.map(function(x){return x.name;}).join(', ') : 'なし'));
  }
  P('');
  P('※ iPhone 本体の「消音スイッチ」がオンだと、','warn');
  P('  この診断でも音は鳴りません。側面のスイッチを確認してください。','warn');
};

/* ---------- ② その場で合成音 ---------- */
document.getElementById('b2').onclick=function(){
  P('');
  P('===== ② 合成音（ボタンを押したその場で鳴らす）=====');
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    var ctx=new AC();
    P('生成直後の状態: '+ctx.state);
    var go=function(){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=440; g.gain.value=0.2;
      o.connect(g); g.connect(ctx.destination);
      o.start(); setTimeout(function(){ o.stop(); P('鳴らし終わりました。','ok'); },600);
      P('再生開始。状態: '+ctx.state);
      P('→ 「ポー」という音が聞こえましたか？');
    };
    if(ctx.state==='suspended'){
      ctx.resume().then(function(){ P('resume 後の状態: '+ctx.state); go(); })
                  .catch(function(e){ P('resume 失敗: '+e.message,'ng'); });
    } else go();
  }catch(e){ P('失敗: '+e.message,'ng'); }
};

/* ---------- ③ サーバの音声をその場で ---------- */
var TEST_WORK='pub_1783638840104';
document.getElementById('b3').onclick=function(){
  P('');
  P('===== ③ サーバの音声（src を直接指定してその場で再生）=====');
  fetch('/api/audio/'+TEST_WORK,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    var ids=Object.keys(j.items||{});
    P('マニフェスト: '+ids.length+' 件');
    if(!ids.length){ P('音声がありません','ng'); return; }
    var url='/api/audio/'+TEST_WORK+'/'+encodeURIComponent(ids[0]);
    P('URL: '+url);
    var a=new Audio();
    a.onplaying=function(){ P('再生が始まりました。','ok'); };
    a.onended=function(){ P('再生が終わりました。','ok'); };
    a.onerror=function(){ P('エラー code='+(a.error&&a.error.code)+' ← 4 は形式か取得の失敗','ng'); };
    a.src=url;
    var p=a.play();
    if(p&&p.catch) p.catch(function(e){
      P('play() が拒否されました: '+e.name+' / '+e.message,'ng');
      P('→ これが出る場合、操作と再生の結びつきが切れています','warn');
    });
    P('play() を呼びました。音は出ましたか？');
  }).catch(function(e){ P('マニフェスト取得に失敗: '+e.message,'ng'); });
};

/* ---------- ④ 取得してから鳴らす（AniNovel と同じ） ---------- */
document.getElementById('b4').onclick=function(){
  P('');
  P('===== ④ 取得してから鳴らす（AniNovel と同じ手順）=====');
  P('音声データを先に取り込み、そのあと再生します。');
  fetch('/api/audio/'+TEST_WORK,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    var ids=Object.keys(j.items||{});
    if(!ids.length){ P('音声がありません','ng'); return; }
    var url='/api/audio/'+TEST_WORK+'/'+encodeURIComponent(ids[0]);
    var t0=Date.now();
    return fetch(url).then(function(r){ return r.blob(); }).then(function(b){
      P('取得: '+Math.round(b.size/1024)+'KB / '+(Date.now()-t0)+'ms / 種別 '+b.type);
      var u=URL.createObjectURL(b);
      var a=new Audio();
      a.onplaying=function(){ P('再生が始まりました。','ok'); };
      a.onended=function(){ P('再生が終わりました。','ok'); };
      a.onerror=function(){ P('エラー code='+(a.error&&a.error.code),'ng'); };
      a.src=u;
      var p=a.play();
      if(p&&p.catch) p.catch(function(e){
        P('play() が拒否されました: '+e.name,'ng');
        P('→ 取得の待ち時間で、操作との結びつきが切れたためです','warn');
        P('  これが AniNovel で音が出ない原因である可能性が高い','warn');
      });
      P('play() を呼びました。音は出ましたか？');
    });
  }).catch(function(e){ P('失敗: '+e.message,'ng'); });
};

document.getElementById('b5').onclick=clr;
</script>
</body>
</html>
