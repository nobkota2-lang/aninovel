<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パスワード再設定 — AniNovel</title>
<link rel="stylesheet" href="/author-style.css">
</head>
<body>
<div class="wrap">
  <h1>パスワード再設定</h1>
  <p class="lead">新しいパスワードを設定してください。</p>

  <div class="card" id="box">
    <label for="pw">新しいパスワード <span class="opt">10文字以上</span></label>
    <input id="pw" type="password" autocomplete="new-password">
    <p class="hint">数字だけ、推測されやすい語を含むものは使えません。</p>

    <label for="pw2">確認のためもう一度</label>
    <input id="pw2" type="password" autocomplete="new-password">

    <button class="btn" id="go">設定する</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="done" style="display:none">
    <p>パスワードを変更しました。</p>
    <a class="btn" href="/author-login.html" style="display:block;text-align:center;text-decoration:none">ログインする</a>
  </div>

  <p class="foot"><a href="/author-login.html">ログインへ戻る</a></p>
</div>

<script>
var $=function(id){return document.getElementById(id);};
function show(kind,text){ var m=$('msg'); m.className='msg '+kind; m.textContent=text; }

var token=new URLSearchParams(location.search).get('token')||'';
if(!token){
  show('err','リンクが正しくありません。メールのリンクをもう一度お開きください。');
  $('go').disabled=true;
}

$('go').onclick=async function(){
  var a=$('pw').value, b=$('pw2').value;
  if(a.length<10){ show('err','パスワードは10文字以上にしてください。'); return; }
  if(a!==b){ show('err','確認用のパスワードが一致しません。'); return; }
  var btn=$('go'); btn.disabled=true; show('ok','設定しています…');
  try{
    var r=await fetch('/api/auth/reset',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token,password:a})});
    var j=await r.json();
    if(r.ok){ $('box').style.display='none'; $('done').style.display='block'; return; }
    show('err',j.error||('エラー ('+r.status+')'));
  }catch(e){ show('err','通信に失敗しました。'); }
  btn.disabled=false;
};
</script>
</body>
</html>
